<!doctype html>
<html lang="he" dir="rtl">
<head>
<script>
(function() {
  var tripId = new URLSearchParams(location.search).get('tripId') || 'legacy';
  var cachedType = localStorage.getItem('trip-' + tripId + '-type') || 'abroad';
  var savedTheme = localStorage.getItem('trip-' + tripId + '-theme');
  var shouldStartDark =
    savedTheme === 'dark'
      ? true
      : savedTheme === 'light'
        ? false
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

  document.documentElement.classList.add('theme-' + cachedType);

  if (shouldStartDark) {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123B63">
  <title>רשימת ציוד</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary:#1D7A93;
      --primary-dark:#0F3E63;
      --accent:#f2b84b;
      --bg:#E8F1F0;
      --surface:#FFFEFB;
      --surface-2:#D6EBE9;
      --text:#17324a;
      --muted:#6f7f8c;
      --line:#C7DFDC;
      --danger:#c0533f;
      --success:#2f8b68;
      --shadow:0 12px 34px rgba(18,59,99,.09);
      --radius:22px;
    }

    :root.theme-local {
      --primary:#BD6E2E;
      --primary-dark:#7A431A;
      --accent:#4F8A8B;
      --bg:#F5E8D8;
      --surface:#FFFBF4;
      --surface-2:#F0DCC0;
      --line:#E3CBA8;
    }

    :root.theme-camping {
      --primary:#4f772d;
      --primary-dark:#2E4A1B;
      --accent:#d79a45;
      --bg:#E9F0DD;
      --surface:#FBFCF6;
      --surface-2:#DCE9C8;
      --line:#CFE0B8;
    }

    :root.theme-reserve {
      --primary:#55637A;
      --primary-dark:#2E3746;
      --accent:#c79b54;
      --bg:#E7EAEE;
      --surface:#FBFCFD;
      --surface-2:#D9DEE6;
      --line:#C7CDD6;
    }

    [data-theme="dark"] {
      --bg:#0B1015;
      --surface:#151D24;
      --surface-2:#1C262E;
      --text:#EAF2F1;
      --muted:#8CA3AC;
      --line:#223038;
      --shadow:0 14px 36px rgba(0,0,0,.4);
    }

    :root.theme-abroad[data-theme="dark"] {
      --primary:#2DD4C8;
      --primary-dark:#17B3A8;
      --bg:#0B1015;
      --surface:#151D24;
      --surface-2:#1C262E;
      --line:#223038;
      --glow-color:#2DD4C8;
    }

    :root.theme-local[data-theme="dark"] {
      --primary:#FFA94D;
      --primary-dark:#E68A2E;
      --bg:#0B1015;
      --surface:#151D24;
      --surface-2:#1C262E;
      --line:#223038;
      --glow-color:#FFA94D;
    }

    :root.theme-camping[data-theme="dark"] {
      --primary:#6EE7A0;
      --primary-dark:#45C97C;
      --bg:#0B1015;
      --surface:#151D24;
      --surface-2:#1C262E;
      --line:#223038;
      --glow-color:#6EE7A0;
    }

    :root.theme-reserve[data-theme="dark"] {
      --primary:#7FB3E8;
      --primary-dark:#5590C9;
      --bg:#0B1015;
      --surface:#151D24;
      --surface-2:#1C262E;
      --line:#223038;
      --glow-color:#7FB3E8;
    }

    [data-theme="dark"] .primary-btn {
      box-shadow:0 0 14px color-mix(in srgb, var(--glow-color) 45%, transparent);
    }

    [data-theme="dark"] .ai-suggest-btn {
      box-shadow:0 0 10px color-mix(in srgb, var(--glow-color) 35%, transparent);
    }

    [data-theme="dark"] .progress > span {
      box-shadow:0 0 8px color-mix(in srgb, var(--glow-color) 60%, transparent);
    }

    * {
      box-sizing:border-box;
    }

    html {
      background:var(--bg);
    }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      height:100dvh;
      overflow:hidden;
    }

    button,
    input,
    select {
      font:inherit;
    }

    button {
      cursor:pointer;
    }

    .hidden {
      display:none !important;
    }

    .shell {
      width:min(760px,100%);
      margin:auto;
      height:100dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      padding:max(14px,env(safe-area-inset-top)) 16px 0;
    }

    .page-head,
    .identity-row,
    .tabs {
      flex-shrink:0;
    }

    #mineView {
      display:flex;
      flex-direction:column;
      flex:1;
      min-height:0;
      overflow:hidden;
    }

    #mineView > .list-head,
    #mineView > .progress-wrap {
      flex-shrink:0;
    }

    #mineView > .items {
      flex:1;
      min-height:0;
      overflow-y:auto;
      padding-bottom:calc(86px + env(safe-area-inset-bottom));
    }

    #groupView {
      flex:1;
      min-height:0;
      overflow-y:auto;
      padding-bottom:calc(86px + env(safe-area-inset-bottom));
    }

    .top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }

    .top-actions {
      display:flex;
      gap:8px;
    }

    .icon-btn {
      width:44px;
      height:44px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--surface);
      color:var(--text);
      display:grid;
      place-items:center;
      text-decoration:none;
      flex:0 0 auto;
    }

    .page-head {
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:12px;
    }

    .page-head-info {
      flex:1;
      min-width:0;
    }

    .page-head-dest {
      font-size:.74rem;
      font-weight:750;
      color:var(--primary);
    }

    .page-head h1 {
      font-family:'Assistant',sans-serif;
      margin:1px 0 0;
      font-size:1.32rem;
      font-weight:700;
      line-height:1.2;
      color:var(--primary-dark);
    }

    .identity-row {
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .identity-row select {
      min-height:46px;
      flex:1;
      min-width:160px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:0 13px;
      color:var(--text);
      background:var(--surface);
    }

    .user-chip {
      font-size:.78rem;
      font-weight:700;
      color:var(--primary-dark);
      background:var(--surface-2);
      border:1px solid var(--line);
      padding:8px 12px;
      border-radius:999px;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .tabs {
      display:grid;
      grid-template-columns:1fr 1fr;
      background:var(--surface-2);
      padding:4px;
      border-radius:16px;
      margin:16px 0 12px;
    }

    .tab {
      min-height:44px;
      border:0;
      border-radius:12px;
      background:transparent;
      color:var(--muted);
      font-weight:750;
    }

    .tab.active {
      background:var(--surface);
      color:var(--primary-dark);
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    .card {
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:15px;
      box-shadow:var(--shadow);
    }

    .add-row {
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
    }

    .add-row input {
      width:100%;
      min-height:48px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--surface);
      color:var(--text);
      padding:0 14px;
      outline:none;
    }

    .add-row input:focus {
      border-color:var(--primary);
      box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 16%,transparent);
    }

    .primary-btn {
      min-height:48px;
      border:0;
      border-radius:14px;
      padding:0 18px;
      background:var(--primary);
      color:#fff;
      font-weight:800;
    }

    .quick-picks-label {
      font-size:.76rem;
      font-weight:750;
      color:var(--muted);
      margin-top:8px;
    }

    .category-suggest {
      display:none;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background:var(--surface-2);
      border:1px solid var(--line);
      border-radius:13px;
      padding:9px 12px;
      margin-top:8px;
      font-size:.82rem;
      color:var(--text);
    }

    .category-suggest.show {
      display:flex;
    }

    .category-suggest button {
      flex-shrink:0;
      min-height:34px;
      padding:0 12px;
      border-radius:10px;
      border:0;
      background:var(--primary);
      color:#fff;
      font-weight:800;
      font-size:.78rem;
      cursor:pointer;
    }

    [data-theme="dark"] .category-suggest button {
      box-shadow:0 0 10px color-mix(in srgb, var(--glow-color) 45%, transparent);
    }

    .quick-picks {
      display:flex;
      gap:7px;
      overflow:auto;
      padding:10px 1px 2px;
      scrollbar-width:none;
    }

    .ai-suggest-btn {
      width:100%;
      min-height:46px;
      margin-top:12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:linear-gradient(135deg,var(--surface-2),var(--surface));
      color:var(--primary-dark);
      font-weight:800;
      font-size:.9rem;
    }

    .ai-suggest-btn:disabled {
      opacity:.6;
    }

    .ai-suggestions {
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-top:10px;
    }

    .ai-suggestions .pick {
      border-color:var(--accent);
    }

    .quick-picks::-webkit-scrollbar {
      display:none;
    }

    .pick {
      border:1px solid var(--line);
      background:var(--surface-2);
      color:var(--text);
      border-radius:999px;
      padding:7px 11px;
      white-space:nowrap;
      font-size:.8rem;
    }

    .list-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:16px 2px 9px;
    }

    .list-head h2 {
      font-family:'Assistant', system-ui, sans-serif;
      font-size:1rem;
      font-weight:800;
      margin:0;
    }

    .list-select {
      min-height:42px;
      max-width:58%;
      border:1px solid var(--line);
      border-radius:13px;
      background:var(--surface);
      color:var(--text);
      padding:0 10px;
      font-weight:700;
    }

    .list-head-actions {
      display:flex;
      gap:6px;
      align-items:center;
    }

    .list-icon-btn {
      width:42px;
      height:42px;
      border:1px solid var(--line);
      border-radius:13px;
      background:var(--surface);
      color:var(--text);
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }

    .progress-wrap {
      margin-bottom:11px;
    }

    .progress-copy {
      display:flex;
      justify-content:space-between;
      font-size:.78rem;
      color:var(--muted);
      margin-bottom:6px;
    }

    .progress {
      height:8px;
      background:var(--surface-2);
      border-radius:999px;
      overflow:hidden;
    }

    .progress > span {
      display:block;
      height:100%;
      background:linear-gradient(90deg,var(--primary),var(--success));
      border-radius:inherit;
      transition:width .25s;
    }

    .items {
      display:grid;
      gap:8px;
    }

    .item {
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:10px;
      min-height:58px;
      border:1px solid var(--line);
      border-radius:16px;
      padding:9px 10px;
      background:var(--surface);
    }

    .item.selection-mode {
      grid-template-columns:auto auto 1fr auto;
    }

    .item.selected {
      border-color:var(--primary);
      background:color-mix(in srgb, var(--primary) 7%, var(--surface));
    }

    .select-check {
      width:24px;
      height:24px;
      accent-color:var(--primary);
    }

    .item.done {
      opacity:.64;
    }

    .item.done .item-name {
      text-decoration:line-through;
    }

    .check {
      width:24px;
      height:24px;
      accent-color:var(--primary);
    }

    .sub-progress {
      min-width:24px;
      height:24px;
      display:grid;
      place-items:center;
      font-size:.68rem;
      font-weight:800;
      color:var(--primary-dark);
      background:var(--surface-2);
      border-radius:8px;
      padding:0 4px;
    }

    .expand-toggle {
      font-size:.72rem;
      color:var(--muted);
    }

    .sub-panel {
      grid-column:1/-1;
      margin-top:8px;
      padding-top:8px;
      border-top:1px dashed var(--line);
      display:grid;
      gap:6px;
    }

    .sub-item {
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:8px;
      padding-inline-start:4px;
    }

    .sub-name {
      font-size:.86rem;
    }

    .sub-name.sub-done {
      text-decoration:line-through;
      color:var(--muted);
    }

    .sub-add-row {
      display:flex;
      gap:6px;
      margin-top:2px;
    }

    .sub-add-input {
      flex:1;
      min-height:38px;
      border:1px solid var(--line);
      border-radius:11px;
      background:var(--surface);
      color:var(--text);
      padding:0 10px;
      font-size:.84rem;
    }

    .item-name {
      font-weight:700;
      word-break:break-word;
    }

    .meta {
      font-size:.72rem;
      color:var(--muted);
      margin-top:2px;
    }

    .item-actions {
      display:flex;
      align-items:center;
      gap:3px;
    }

    .mini {
      width:38px;
      height:38px;
      border:0;
      border-radius:12px;
      background:transparent;
      color:var(--muted);
    }

    .empty {
      text-align:center;
      padding:42px 14px;
      color:var(--muted);
    }

    .empty .emoji {
      font-size:2.4rem;
      display:block;
      margin-bottom:8px;
    }

    .group-block {
      margin-bottom:16px;
    }

    .group-title {
      font-size:.92rem;
      margin:0 0 8px;
      color:var(--primary-dark);
    }

    .bottom-nav {
      position:fixed;
      z-index:30;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      width:min(760px,100%);
      display:grid;
      grid-template-columns:repeat(6,1fr);
      background:rgba(255,253,250,.94);
      backdrop-filter:blur(18px);
      border-top:1px solid var(--line);
      padding:8px 5px max(8px,env(safe-area-inset-bottom));
    }

    .bottom-nav a {
      min-height:52px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      text-decoration:none;
      color:var(--muted);
      font-size:1.02rem;
      border-radius:13px;
    }

    .bottom-nav a svg {
      width:22px;
      height:22px;
      fill:currentColor;
    }

    .bottom-nav a span {
      font-size:.67rem;
    }

    .bottom-nav a.active {
      color:var(--primary);
      background:var(--surface-2);
    }

    [data-theme="dark"] .bottom-nav {
      background:var(--surface);
    }

    [data-theme="dark"] .bottom-nav a.active {
      color:var(--glow-color);
      background:color-mix(in srgb, var(--glow-color) 14%, transparent);
      filter:drop-shadow(0 0 4px var(--glow-color));
    }

    .bulk-bar {
      position:fixed;
      z-index:35;
      bottom:calc(78px + env(safe-area-inset-bottom));
      left:50%;
      transform:translateX(-50%);
      width:min(730px,94%);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background:var(--primary-dark);
      color:#fff;
      border-radius:18px;
      padding:10px 12px;
      box-shadow:0 14px 34px rgba(18,59,99,.3);
    }

    .bulk-bar span {
      font-size:.82rem;
      font-weight:750;
      white-space:nowrap;
      flex:0 0 auto;
    }

    .bulk-actions {
      display:flex;
      gap:6px;
      overflow-x:auto;
    }

    .bulk-btn {
      min-height:40px;
      border:1px solid rgba(255,255,255,.28);
      background:rgba(255,255,255,.12);
      color:#fff;
      border-radius:12px;
      padding:0 12px;
      font-size:.78rem;
      font-weight:750;
      white-space:nowrap;
    }

    .bulk-btn.danger {
      background:var(--danger);
      border-color:var(--danger);
    }

    .overlay {
      position:fixed;
      inset:0;
      z-index:100;
      background:rgba(10,25,35,.58);
      display:flex;
      align-items:flex-end;
      justify-content:center;
    }

    .auth-loading {
      position:fixed;
      inset:0;
      z-index:150;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
    }

    .auth-loading.hidden {
      display:none;
    }

    .auth-spinner {
      width:32px;
      height:32px;
      border-radius:50%;
      border:3px solid var(--line);
      border-top-color:var(--primary);
      animation:auth-spin .8s linear infinite;
    }

    @keyframes auth-spin {
      to { transform:rotate(360deg); }
    }

    .sheet {
      width:min(760px,100%);
      background:var(--surface);
      border-radius:26px 26px 0 0;
      padding:22px 18px max(22px,env(safe-area-inset-bottom));
      max-height:88dvh;
      overflow:auto;
    }

    .handle {
      width:42px;
      height:5px;
      background:var(--line);
      border-radius:9px;
      margin:-8px auto 14px;
    }

    .sheet h2 {
      margin:0 0 6px;
    }

    .sheet p {
      color:var(--muted);
      margin:0 0 16px;
    }

    .field {
      display:grid;
      gap:6px;
      margin:12px 0;
    }

    .field label {
      font-size:.82rem;
      font-weight:700;
    }

    .field input,
    .field select {
      width:100%;
      min-height:48px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--surface);
      color:var(--text);
      padding:0 12px;
    }

    .sheet-actions {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:16px;
    }

    .secondary-btn {
      min-height:48px;
      border:1px solid var(--line);
      background:var(--surface-2);
      color:var(--text);
      border-radius:14px;
      font-weight:750;
    }

    .danger-btn {
      background:var(--danger);
      color:#fff;
      border:0;
    }

    .login-card {
      text-align:center;
    }

    .google-btn {
      width:100%;
      min-height:50px;
      border:1px solid var(--line);
      border-radius:15px;
      background:var(--surface);
      color:var(--text);
      font-weight:800;
    }

    .toast {
      position:fixed;
      z-index:200;
      bottom:calc(88px + env(safe-area-inset-bottom));
      left:50%;
      transform:translate(-50%,16px);
      background:#172a35;
      color:#fff;
      padding:10px 16px;
      border-radius:999px;
      opacity:0;
      pointer-events:none;
      transition:.2s;
      max-width:90%;
      text-align:center;
    }

    .toast.show {
      opacity:1;
      transform:translate(-50%,0);
    }

    @media (min-width:700px) {
      .shell {
        padding-inline:20px;
        padding-top:18px;
      }

      .bottom-nav {
        border:1px solid var(--line);
        border-bottom:0;
        border-radius:20px 20px 0 0;
      }

      .overlay {
        align-items:center;
        padding:20px;
      }

      .sheet {
        border-radius:26px;
        max-width:520px;
      }
    }

    .fab{position:fixed;z-index:40;bottom:calc(90px + env(safe-area-inset-bottom));right:max(18px,calc(50vw - 362px));width:58px;height:58px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:1.8rem;font-weight:400;line-height:1;display:grid;place-items:center;box-shadow:0 14px 30px rgba(18,59,99,.32);transition:transform .15s}
    .fab:active{transform:scale(.9)}
    [data-theme="dark"] .fab{box-shadow:0 0 0 1px var(--glow-color),0 0 18px color-mix(in srgb,var(--glow-color) 55%,transparent)}

    .custom-dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;animation:dialogFadeIn .15s ease}
    @keyframes dialogFadeIn{from{opacity:0}to{opacity:1}}
    .custom-dialog-card{background:var(--surface);border-radius:20px;padding:22px 20px;max-width:360px;width:100%;box-shadow:var(--shadow);text-align:center;animation:dialogPopIn .18s cubic-bezier(0.16,1,0.3,1)}
    @keyframes dialogPopIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}

          resolve();

        overlay.querySelector("button").onclick = cleanup;

        };
      });

    function customConfirm(message, options) {
      const danger = Boolean(options && options.danger);

      return new Promise(resolve => {

        overlay.innerHTML =
          '<div class="custom-dialog-card">' +
          '<div class="custom-dialog-brand">✈️ GitTrip</div>' +

          '">' +
          tr("אישור", "Confirm") +
          "</button></div></div>";

        overlay.querySelector(".custom-dialog-message").textContent =
          message;

        document.body.appendChild(overlay);

        const cleanup = result => {
          overlay.remove();
          resolve(result);
        };

        overlay.querySelector(".cancel").onclick = () => cleanup(false);
        overlay
          .querySelector(danger ? ".danger" : ".confirm")
          .onclick = () => cleanup(true);
        overlay.onclick = event => {
          if (event.target === overlay) cleanup(false);

    function toast(text) {

      }, 2200);
    }

    function fireConfetti() {
      const canvas = document.createElement("canvas");
      canvas.style.position = "fixed";
      canvas.style.inset = "0";
      canvas.style.zIndex = "60";
      canvas.style.pointerEvents = "none";
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      document.body.appendChild(canvas);

      const ctx = canvas.getContext("2d");
      const colors = ["#123B63", "#1F7A8C", "#F2B84B", "#E76F51", "#2F8B68"];

      const pieces = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.4,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        speedY: 2 + Math.random() * 3,
        speedX: -1.5 + Math.random() * 3,
        rotation: Math.random() * 360,
        rotationSpeed: -8 + Math.random() * 16
      }));

      const start = Date.now();
      const duration = 2600;

      function frame() {
        const elapsed = Date.now() - start;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        pieces.forEach(piece => {
          piece.x += piece.speedX;
          piece.y += piece.speedY;
          piece.rotation += piece.rotationSpeed;

          ctx.save();
          ctx.translate(piece.x, piece.y);
          ctx.rotate((piece.rotation * Math.PI) / 180);
          ctx.fillStyle = piece.color;
          ctx.fillRect(-piece.size / 2, -piece.size / 4, piece.size, piece.size / 2);
          ctx.restore();
        });

        if (elapsed < duration) {
          requestAnimationFrame(frame);
        } else {
          canvas.remove();
        }
      }

      requestAnimationFrame(frame);
      toast(tr("🎉 סיימתם לארוז!", "🎉 Packing complete!"));
    }

    function doGoogleSignIn() {
      signInWithPopup(auth, provider).catch(error => {
        const fallbackCodes = [
          "auth/popup-blocked",
          "auth/popup-closed-by-user",
          "auth/cancelled-popup-request",
          "auth/web-storage-unsupported",
          "auth/operation-not-supported-in-this-environment"
        ];

        if (
          fallbackCodes.includes(error?.code) ||
          /missing initial state/i.test(error?.message || "")
        ) {
          signInWithRedirect(auth, provider);
        } else {
          toast(error.message);
        }
      });
    }

    getRedirectResult(auth).catch(error => toast(error.message));

    function applyTheme() {
      try {
        localStorage.setItem(
          `trip-${tripId || "legacy"}-type`,
          trip.tripType || "abroad"
        );
      } catch (e) {}

      document.documentElement.classList.remove(
        "theme-abroad",
        "theme-local",
        "theme-camping",
        "theme-reserve"
      );

      document.documentElement.classList.add(
        `theme-${trip.tripType || "abroad"}`
      );

      const stored = localStorage.getItem(themeKey);
      const systemDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;
      const shouldBeDark =
        stored === "dark" ? true : stored === "light" ? false : systemDark;

      if (shouldBeDark) {
        document.documentElement.dataset.theme = "dark";
      } else {
        delete document.documentElement.dataset.theme;
      }

      $("themeBtn").textContent =
        document.documentElement.dataset.theme === "dark"
          ? "☀️"
          : "🌙";
    }

      const isEnglish = trip.language === "en";

      $("editNameLabel").textContent =

    async function ensureStarterLists() {
      const metadata = allPacking?.users?.[user?.uid]?.listMeta;
      const existingItems = allPacking?.users?.[user?.uid]?.items;

      if (metadata || (existingItems && Object.keys(existingItems).length)) {
        return;
      }

      const lists = starterLists();

      if (!lists.length) {
        return;
      }

      const updates = {};

      lists.forEach((list, index) => {
        updates[`${userBase()}/listMeta/${list.id}`] = {
          name: list.name,
          order: index,
          createdAt: Date.now()
        };
      });

      await update(ref(db), updates);
      activeList = lists[0].id;
    }

      const id = `list_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;

    async function requestAiSuggestions() {
      const button = $("aiSuggestBtn");
      const originalText = button.textContent;

      button.disabled = true;
      button.textContent = tr("חושב...", "Thinking...");

      try {
        const response = await fetch(AI_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            destination: trip.destination || "",
            tripType: trip.tripType || "abroad",
            vibes: trip.vibes || [],
            startDate: trip.startAt || "",
            endDate: trip.endAt || "",
            listName: listLabel(activeList),
            language: trip.language === "en" ? "en" : "he"
          })
        });

        if (!response.ok) {
          throw new Error("Request failed");
        }

        const data = await response.json();

        if (!data.items || !data.items.length) {
          toast(
            tr(
              "לא התקבלו הצעות הפעם, נסו שוב",
              "No suggestions this time, try again"
            )
          );
          return;
        }

        renderAiSuggestions(data.items);
      } catch (error) {
        console.error("AI suggestion error:", error);
        toast(
          tr(
            "לא ניתן היה לקבל הצעות AI כרגע",
            "Couldn't get AI suggestions right now"
          )
        );
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    function renderAiSuggestions(items) {
      const existingNames = new Set(
        Object.values(currentItems())
          .map(item => (item.name || "").trim().toLowerCase())
      );

      const fresh = items.filter(
        item => !existingNames.has(item.trim().toLowerCase())
      );

      if (!fresh.length) {
        $("aiSuggestions").classList.add("hidden");
        toast(
          tr(
            "כל ההצעות כבר ברשימה שלך",
            "All suggestions are already on your list"
          )
        );
        return;
      }

      $("aiSuggestions").classList.remove("hidden");

      $("aiSuggestions").innerHTML = fresh
        .map(item =>
          `<button class="pick" data-ai-pick="${escapeHtml(item)}">` +
          `✨ ${escapeHtml(item)}</button>`
        )
        .join("");

      document
        .querySelectorAll("[data-ai-pick]")
        .forEach(button => {
          button.onclick = () => {
            addItem(button.dataset.aiPick);
            button.remove();

            if (!document.querySelector("[data-ai-pick]")) {

            }
          };
        });
    }

    function escapeHtml(value = "") {
      return String(value).replace(
        /[&<>"']/g,
        character => ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        })[character]
      );
    }

    function participantKey(name) {
      const bytes =
        new TextEncoder().encode(
          String(name).trim()
        );

      let raw = "";

      bytes.forEach(byte => {
        raw += String.fromCharCode(byte);
      });

      return btoa(raw)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    function participantOptions() {
      const names =
        Array.isArray(trip.participants)
          ? trip.participants
          : [];

      const claims =
        trip.participantClaims || {};

      const options =
        `<option value="">` +
        `${tr("בחר/י את שמך…", "Choose your name…")}` +
        `</option>` +
        names.map((name, index) => {
          const key = participantKey(name);

          const isTaken =
            claims[key] &&
            claims[key] !== user?.uid;

          return (
            `<option value="${index}" ` +
            `${isTaken ? "disabled" : ""}>` +
            `${escapeHtml(name)}` +
            `${isTaken
              ? ` — ${tr("כבר משויך", "already linked")}`
              : ""}` +
            `</option>`
          );
        }).join("");

      $("participantSelect").innerHTML = options;
      $("memberSelect").innerHTML = options;

      if (profile) {
        const index =
          names.indexOf(profile.name);

        if (index >= 0) {
          $("participantSelect").value =
            String(index);

          $("memberSelect").value =
            String(index);
        }

        $("participantSelect").disabled = true;
      } else {
        $("participantSelect").disabled = false;
      }
    }

    async function saveProfile(index) {
      if (!user || profile) {
        return;
      }

      const name =
        (trip.participants || [])[Number(index)];

      if (!name) {
        return toast(
          tr("יש לבחור שם", "Choose a name")
        );
      }

      const key = participantKey(name);

      const claimReference = ref(
        db,
        `${tripRoot}/participantClaims/${key}`
      );

      try {
        const result = await runTransaction(
          claimReference,
          current =>
            current === null ||
            current === user.uid
              ? user.uid
              : undefined,
          {
            applyLocally:false
          }
        );

        if (
          !result.committed ||
          result.snapshot.val() !== user.uid
        ) {
          return toast(
            tr(
              "השם הזה כבר שויך למשתתף אחר",
              "This name is already linked to another participant"
            )
          );
        }

        const nextProfile = {
          name,
          participantKey:key,
          email:user.email || "",
          photoURL:user.photoURL || "",
          updatedAt:Date.now()
        };

        try {
          await set(
            ref(
              db,
              `${tripRoot}/memberProfiles/${user.uid}`
            ),
            nextProfile
          );
        } catch (error) {
          await runTransaction(
            claimReference,
            current =>
              current === user.uid
                ? null
                : current,
            {
              applyLocally:false
            }
          );

          throw error;
        }

        profile = nextProfile;

        $("memberOverlay")
          .classList
          .add("hidden");

        syncIdentity();
        listenPacking();
      } catch (error) {
        console.error(error);

        toast(
          tr(
            "לא ניתן היה לשייך את השם. נסו שוב.",
            "Could not link the name. Please try again."
          )
        );
      }
    }

    function renderLists() {
      const ids = allListIds();

      $("listSelect").innerHTML =
        ids
          .map(id =>
            `<option value="${escapeHtml(id)}">` +
            `${escapeHtml(listLabel(id))}</option>`
          )
          .join("");

      if (!ids.includes(activeList)) {
        activeList = "main";
      }

      $("listSelect").value = activeList;

    function renderMine() {
      renderLists();
      renderQuickPicks();

      const map = currentItems();

      const entries =
        Object.entries(map)
          .map(([id, item]) => ({
            id,
            ...item
          }))
          .sort((first, second) =>
            (first.isDone - second.isDone) ||
            (first.createdAt - second.createdAt)
          );

      let totalUnits = 0;
      let doneUnits = 0;

      entries.forEach(item => {
        const subs = item.subItems ? Object.entries(item.subItems) : [];

        if (subs.length) {
          subs.forEach(([, sub]) => {
            totalUnits += 1;
            if (sub.isDone) doneUnits += 1;
          });
        } else {
          totalUnits += 1;
          if (item.isDone) doneUnits += 1;
        }
      });

      const unitPercentage =
        totalUnits ? Math.round(doneUnits / totalUnits * 100) : 0;

      $("progressText").textContent =
        `${doneUnits}/${totalUnits} · ${unitPercentage}%`;

      $("progressBar").style.width =
        `${unitPercentage}%`;

      if (totalUnits && unitPercentage === 100) {
        if (!celebratedLists.has(activeList)) {
          celebratedLists.add(activeList);
          fireConfetti();
        }
      } else {
        celebratedLists.delete(activeList);
      }

      $("items").innerHTML =
        entries.length
          ? entries.map(item => {
              const subs = Object.entries(item.subItems || {}).map(([id, sub]) => ({ id, ...sub }));
              const hasSubs = subs.length > 0;
              const subDone = subs.filter(s => s.isDone).length;
              const isExpanded = expandedItems.has(item.id);

              return `
              <article class="item ${item.isDone ? "done" : ""} ${selectionMode ? "selection-mode" : ""} ${selectedIds.has(item.id) ? "selected" : ""}">
                ${selectionMode ? `
                  <input
                    class="select-check"
                    type="checkbox"
                    data-select="${item.id}"
                    ${selectedIds.has(item.id) ? "checked" : ""}
                    aria-label="${tr("בחירה", "Select")}">
                ` : ""}

                ${hasSubs ? `
                  <span class="sub-progress">${subDone}/${subs.length}</span>
                ` : `
                  <input
                    class="check"
                    type="checkbox"
                    data-check="${item.id}"
                    ${item.isDone ? "checked" : ""}>
                `}

                <div>
                  <div class="item-name">
                    ${escapeHtml(item.name)}
                  </div>

                  <div class="meta">
                    ${item.isPublic
                      ? tr("גלוי לקבוצה", "Visible to group")
                      : tr("פרטי", "Private")}
                    ${item.importedFrom
                      ? ` · ${tr("יובא מ ", "Imported from ")}${escapeHtml(item.importedFrom)}`
                      : ""}
                  </div>
                </div>

                <div class="item-actions">
                  <button
                    class="mini expand-toggle"
                    data-expand="${item.id}"
                    aria-label="${tr("תת-פריטים", "Sub-items")}">
                    ${isExpanded ? "▾" : "▸"}
                  </button>

                  <button
                    class="mini visibility-toggle"
                    data-toggle-visibility="${item.id}"
                    aria-label="${item.isPublic
                      ? tr("הפוך לפרטי", "Make private")
                      : tr("שתף עם הקבוצה", "Share with group")}">
                    ${item.isPublic ? "🌐" : "🔒"}
                  </button>

                  <button
                    class="mini"
                    data-edit="${item.id}"
                    aria-label="${tr("אפשרויות", "Options")}">
                    •••
                  </button>
                </div>

                ${isExpanded ? `
                  <div class="sub-panel">
                    ${subs.map(sub => `
                      <div class="sub-item">
                        <input class="check" type="checkbox" data-sub-check="${item.id}:${sub.id}" ${sub.isDone ? "checked" : ""}>
                        <span class="sub-name ${sub.isDone ? "sub-done" : ""}">${escapeHtml(sub.name)}</span>
                        <button class="mini" data-sub-delete="${item.id}:${sub.id}" aria-label="${tr("מחיקה", "Delete")}">✕</button>
                      </div>
                    `).join("")}

                    <div class="sub-add-row">
                      <input type="text" class="sub-add-input" data-sub-add-input="${item.id}" maxlength="80" placeholder="${tr("הוספת תת-פריט...", "Add sub-item...")}">
                      <button class="mini" data-sub-add="${item.id}" aria-label="${tr("הוספה", "Add")}">➕</button>
                    </div>
                  </div>
                ` : ""}
              </article>
            `;
            }).join("")
          : `
              <div class="empty">
                <span class="emoji">🎒</span>
                ${tr(
                  "הרשימה עדיין ריקה. הוסיפו את הפריט הראשון.",
                  "Your list is empty. Add the first item."
                )}
              </div>
            `;

      document
        .querySelectorAll("[data-check]")
        .forEach(checkbox => {
          checkbox.onchange = () => {
            update(
              ref(
                db,
                `${userBase()}/items/${activeList}/${checkbox.dataset.check}`
              ),
              {
                isDone:checkbox.checked
              }
            );
          };
        });

      document
        .querySelectorAll("[data-edit]")
        .forEach(button => {
          button.onclick = () => {
            openEdit(button.dataset.edit);
          };
        });

      document
        .querySelectorAll("[data-toggle-visibility]")
        .forEach(button => {
          button.onclick = () => {
            const id = button.dataset.toggleVisibility;
            const item = currentItems()[id];

            if (!item) {
              return;
            }

            update(
              ref(
                db,
                `${userBase()}/items/${activeList}/${id}`
              ),
              { isPublic: !item.isPublic }
            );
          };
        });

      document
        .querySelectorAll("[data-expand]")
        .forEach(button => {
          button.onclick = () => {
            const id = button.dataset.expand;

            if (expandedItems.has(id)) {
              expandedItems.delete(id);
            } else {
              expandedItems.add(id);
            }

            renderMine();
          };
        });

      document
        .querySelectorAll("[data-sub-check]")
        .forEach(checkbox => {
          checkbox.onchange = () => {
            const [itemId, subId] = checkbox.dataset.subCheck.split(":");

            update(
              ref(
                db,
                `${userBase()}/items/${activeList}/${itemId}/subItems/${subId}`
              ),
              { isDone: checkbox.checked }
            );
          };
        });

      document
        .querySelectorAll("[data-sub-delete]")
        .forEach(button => {
          button.onclick = () => {
            const [itemId, subId] = button.dataset.subDelete.split(":");

            remove(
              ref(
                db,
                `${userBase()}/items/${activeList}/${itemId}/subItems/${subId}`
              )
            );
          };
        });

      function addSubItem(itemId) {
        const input = document.querySelector(`[data-sub-add-input="${itemId}"]`);
        const name = input.value.trim();

        if (!name) {
          return;
        }

        push(
          ref(
            db,
            `${userBase()}/items/${activeList}/${itemId}/subItems`
          ),
          { name, isDone: false }
        );

        input.value = "";
      }

      document
        .querySelectorAll("[data-sub-add]")
        .forEach(button => {
          button.onclick = () => addSubItem(button.dataset.subAdd);
        });

      document
        .querySelectorAll("[data-sub-add-input]")
        .forEach(input => {
          input.onkeydown = event => {
            if (event.key === "Enter") {
              event.preventDefault();
              addSubItem(input.dataset.subAddInput);
            }
          };
        });

      document
        .querySelectorAll("[data-select]")
        .forEach(checkbox => {
          checkbox.onchange = () => {
            const id = checkbox.dataset.select;

            if (checkbox.checked) {
              selectedIds.add(id);
            } else {
              selectedIds.delete(id);
            }

            renderMine();
          };
        });

      updateBulkBar();
    }

    function updateBulkBar() {
      const bar = $("bulkBar");

      if (selectionMode && selectedIds.size > 0) {
        bar.classList.remove("hidden");

        $("bulkCount").textContent =
          tr(
            `${selectedIds.size} נבחרו`,
            `${selectedIds.size} selected`
          );
      } else {
        bar.classList.add("hidden");
      }
    }

    function setSelectionMode(next) {
      selectionMode = next;

      if (!next) {
        selectedIds = new Set();
      }

      $("selectModeBtn").classList.toggle("active", selectionMode);
      renderMine();
    }

    async function bulkDelete() {
      if (!selectedIds.size) {
        return;
      }

      if (
        !(await customConfirm(
          tr(
            `למחוק ${selectedIds.size} פריטים?`,
            `Delete ${selectedIds.size} items?`
          ),
          { danger: true }
        ))
      ) {
        return;
      }

      const updates = {};

      selectedIds.forEach(id => {
        updates[`${userBase()}/items/${activeList}/${id}`] = null;
      });

      await update(ref(db), updates);
      setSelectionMode(false);
      toast(tr("הפריטים נמחקו", "Items deleted"));
    }

    async function bulkToggleDone() {
      if (!selectedIds.size) {
        return;
      }

      const map = currentItems();

      const allDone =
        [...selectedIds].every(id => map[id]?.isDone);

      const updates = {};

      selectedIds.forEach(id => {
        updates[`${userBase()}/items/${activeList}/${id}/isDone`] = !allDone;
      });

      await update(ref(db), updates);
      setSelectionMode(false);
    }

    function openBulkMove() {
      if (!selectedIds.size) {
        return;
      }

      $("bulkMoveTarget").innerHTML =
        allListIds()
          .filter(id => id !== activeList)
          .map(id =>
            `<option value="${escapeHtml(id)}">` +
            `${escapeHtml(listLabel(id))}</option>`
          )
          .join("");

      if (!$("bulkMoveTarget").options.length) {
        return toast(
          tr(
            "אין רשימה אחרת להעביר אליה",
            "There's no other list to move to"
          )
        );
      }

      $("bulkMoveOverlay").classList.remove("hidden");
    }

    async function confirmBulkMove() {
      const targetList = $("bulkMoveTarget").value;

      if (!targetList || !selectedIds.size) {
        return;
      }

      const map = currentItems();
      const updates = {};

      selectedIds.forEach(id => {
        if (!map[id]) {
          return;
        }

        updates[`${userBase()}/items/${activeList}/${id}`] = null;
        updates[`${userBase()}/items/${targetList}/${id}`] = map[id];
      });

      await update(ref(db), updates);
      $("bulkMoveOverlay").classList.add("hidden");
      setSelectionMode(false);
      toast(tr("הפריטים הועברו", "Items moved"));
    }

    function renderGroup() {
      const users =
        allPacking?.users || {};

      const blocks = [];

      Object.entries(users)
        .forEach(([uid, data]) => {
          const publicItems = [];

          Object.entries(data.items || {})
            .forEach(([listId, list]) => {
              Object.entries(list || {})
                .forEach(([itemId, item]) => {
                  if (item.isPublic) {
                    publicItems.push({ uid, listId, itemId, ...item });

                });
            });

          if (!publicItems.length) {
            return;
          }

          const member =
            trip.memberProfiles?.[uid]?.name ||
            publicItems[0]?.ownerName ||
            tr("משתתף", "Traveler");

          const isMe = uid === user?.uid;

          blocks.push(`
            <section class="card group-block">
              <h3 class="group-title">
                ${escapeHtml(member)}
              </h3>

              <div class="items">
                ${publicItems.map(item => `
                  <div class="item ${item.isDone ? "done" : ""}">
                    <span>${item.isDone ? "✅" : "◻️"}</span>
                    <div class="item-name">

              </div>
            </section>

          <div class="card empty">

    async function importItem(key) {

        allPacking?.users?.[sourceUid]?.items?.[sourceListId]?.[sourceItemId];

        return;
      }

      const memberName =
        trip.memberProfiles?.[sourceUid]?.name ||
        sourceItem.ownerName ||
        tr("חבר/ה לקבוצה", "a group member");

      await push(
        ref(db, `${userBase()}/items/${activeList}`),
        {
          name: sourceItem.name,

          isPublic: false,
          importedFrom: memberName,
          ownerName: profile.name,
          createdByUid: user.uid,

        tr(
          `הפריט יובא לרשימה "${listLabel(activeList)}"`,
          `Item imported to "${listLabel(activeList)}"`
        )
      );
    }

      renderMine();

    }

    function detectSuggestedCategory(rawText) {
      const text = rawText.trim().toLocaleLowerCase();

      if (!text) {
        return null;
      }

      for (const category of CATEGORY_KEYWORDS) {
        if (text === category.name.toLocaleLowerCase()) {
          continue;
        }

        const matched = category.keywords.some(keyword =>
          text.includes(keyword.toLocaleLowerCase())
        );

        if (matched) {
          return category;
        }
      }

      return null;
    }

    function updateCategorySuggestion() {
      const value = $("newItem").value;
      const category = detectSuggestedCategory(value);
      const box = $("categorySuggest");

      if (!category) {
        box.classList.remove("show");
        return;
      }

      $("categorySuggestText").textContent = tr(
        `${category.icon} זה נשמע כמו "${category.name}" - להוסיף כתת-פריט?`,
        `${category.icon} This looks like "${category.name}" - add as a sub-item?`
      );

      box.dataset.categoryName = category.name;
      box.classList.add("show");
    }

    async function addToSuggestedCategory() {
      const box = $("categorySuggest");
      const categoryName = box.dataset.categoryName;
      const value = $("newItem").value.trim();

      if (!categoryName || !value || !user || !profile) {
        return;
      }

      const items = currentItems();

      let parentId = Object.keys(items).find(id =>
        items[id].name?.trim().toLocaleLowerCase() ===
        categoryName.toLocaleLowerCase()
      );

      if (!parentId) {
        const newParentRef = await push(
          ref(db, `${userBase()}/items/${activeList}`),
          {
            name: categoryName,
            isDone: false,
            isPublic: false,
            ownerName: profile.name,
            createdAt: Date.now(),
            createdByUid: user.uid
          }
        );

        parentId = newParentRef.key;
      }

      await push(
        ref(db, `${userBase()}/items/${activeList}/${parentId}/subItems`),
        { name: value, isDone: false }
      );

      $("newItem").value = "";
      box.classList.remove("show");

      toast(
        tr(
          `נוסף תחת "${categoryName}"`,
          `Added under "${categoryName}"`
        )
      );
    }

    async function addItem(value) {
      const name =
        (value || $("newItem").value).trim();

      if (
        !name ||
        !user ||
        !profile
      ) {
        return;
      }

      const alreadyExists =
        Object.values(currentItems())
          .some(item =>
            item.name
              ?.trim()
              .toLocaleLowerCase() ===
            name.toLocaleLowerCase()
          );

      if (alreadyExists) {
        return toast(
          tr(
            "הפריט כבר קיים ברשימה",
            "Item already exists"
          )
        );
      }

      await push(
        ref(
          db,
          `${userBase()}/items/${activeList}`
        ),
        {
          name,
          isDone:false,
          isPublic:false,
          ownerName:profile.name,
          createdAt:Date.now(),
          createdByUid:user.uid
        }
      );

      $("newItem").value = "";
      $("categorySuggest").classList.remove("show");

      toast(
        tr("הפריט נוסף", "Item added")
      );
    }

    function openEdit(id) {
      const item = currentItems()[id];

      if (!item) {
        return;
      }

      editingId = id;
      $("editName").value = item.name || "";

      $("editVisibility").value =
        item.isPublic
          ? "public"
          : "private";

      $("editListSelect").innerHTML =
        allListIds()
          .map(listId =>
            `<option value="${escapeHtml(listId)}">` +
            `${escapeHtml(listLabel(listId))}</option>`
          )
          .join("");

      $("editListSelect").value = activeList;

      $("editOverlay")
        .classList
        .remove("hidden");
    }

    async function saveEdit() {
      if (!editingId) {
        return;
      }

      const name =
        $("editName").value.trim();

      if (!name) {
        return;
      }

      const targetList = $("editListSelect").value;
      const sourceList = activeList;
      const fields = {
        name,
        isPublic:
          $("editVisibility").value === "public"
      };

      if (targetList && targetList !== sourceList) {
        const existingItem = currentItems()[editingId];

        await update(ref(db), {
          [`${userBase()}/items/${sourceList}/${editingId}`]: null,
          [`${userBase()}/items/${targetList}/${editingId}`]: {
            ...existingItem,
            ...fields
          }
        });

        activeList = targetList;
        toast(tr("הפריט הועבר", "Item moved"));
      } else {
        await update(
          ref(
            db,
            `${userBase()}/items/${sourceList}/${editingId}`
          ),
          fields
        );
      }

      $("editOverlay")
        .classList
        .add("hidden");

      editingId = null;
    }

    function loadTrip() {
      if (!tripRoot) {
        $("loginOverlay")
          .classList
          .add("hidden");

        toast("Missing tripId");
        return;
      }

      if (stopTrip) {
        stopTrip();
      }

      stopTrip = onValue(
        ref(db, tripRoot),
        snapshot => {
          if (!snapshot.exists()) {
            toast(
              tr(
                "הטיול לא נמצא",
                "Trip not found"
              )
            );

            return;
          }

          trip = snapshot.val();

          try {
            localStorage.setItem(langKey, trip.language || "he");
          } catch (e) { /* ignore */ }

          applyTheme();
          applyLanguage();
          configureLinks();
          participantOptions();

          if (user) {
            loadProfile();
          }
        },
        () => {
          stopTrip = null;

          toast(
            tr(
              "לא ניתן לטעון את הטיול",
              "Could not load the trip"
            )
          );
        }
      );
    }

          `${tripRoot}/memberProfiles/${user.uid}`
        )

      profile = snapshot.val();

      syncIdentity();

      if (profile) {
        listenPacking();
      }
    }

    $("bulkCancelBtn").onclick = () => {
      setSelectionMode(false);
    };

    $("bulkDeleteBtn").onclick = bulkDelete;

    $("bulkToggleDoneBtn").onclick = bulkToggleDone;

    $("bulkMoveBtn").onclick = openBulkMove;

    $("cancelBulkMove").onclick = () => {
      $("bulkMoveOverlay").classList.add("hidden");
    };

    $("confirmBulkMove").onclick = confirmBulkMove;

    $("mineTab").onclick = () => {
      $("mineTab").classList.add("active");
      $("groupTab").classList.remove("active");
      $("mineView").classList.remove("hidden");
      $("groupView").classList.add("hidden");
    };

    $("groupTab").onclick = () => {
      $("groupTab").classList.add("active");
      $("mineTab").classList.remove("active");
      $("groupView").classList.remove("hidden");
      $("mineView").classList.add("hidden");
      renderGroup();
    };

    $("cancelEdit").onclick = () => {
      $("editOverlay")
        .classList
        .add("hidden");

      editingId = null;
    };

    [
      "newListOverlay",
      "manageListOverlay",
      "editOverlay",
      "bulkMoveOverlay"
    ].forEach(overlayId => {
      const cancelId =
        "cancel" + overlayId.charAt(0).toUpperCase() +
        overlayId.slice(1).replace("Overlay", "");

      $(overlayId).addEventListener("click", event => {
        if (event.target.id === overlayId) {
          $(cancelId).click();
        }
      });
    });

    $("saveEdit").onclick = saveEdit;

    $("deleteItem").onclick = async () => {
      if (!editingId) {
        return;
      }

      if (
        await customConfirm(
          tr(
            "למחוק את הפריט?",
            "Delete this item?"
          ),
          { danger: true }
        )
      ) {
        await remove(
          ref(
            db,
            `${userBase()}/items/${activeList}/${editingId}`
          )
        );

        $("editOverlay")
          .classList
          .add("hidden");

        editingId = null;
      }
    };

    onAuthStateChanged(auth, authenticatedUser => {
      user = authenticatedUser;

      $("authLoading").classList.add("hidden");

      $("loginOverlay").classList.toggle(
        "hidden",
        Boolean(authenticatedUser)
      );

      if (authenticatedUser) {
        $("userChip").textContent =
          authenticatedUser.displayName ||
          authenticatedUser.email ||
          "";

        loadTrip();
      } else {
        profile = null;
        items = {};
        packingListening = false;

        if (stopTrip) {
          stopTrip();
          stopTrip = null;
        }

        $("memberOverlay")
          .classList
          .add("hidden");
      }
    });
  </script>
</body>
</html>
