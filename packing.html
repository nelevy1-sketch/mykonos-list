    // itemsForCategoryFilter, see step 1), but the filter passed in is
    // still just activeList, so the actual set of items shown is
    // byte-identical to before. Nothing reads data-category yet - it's
    // wiring for step 3, not a behavior change.
    //
    // docs/schema-legs.md §5.1, step 6 - itemsForLegFilter layers the
    // destination axis on top, so this map (and everything below that
    // reads from it, including the progress count) already reflects
    // BOTH active filters together. Deliberately the same "what's
    // displayed is what's counted" behavior the progress count already
    // had for the category filter alone - not a new rule, just this
    // map now has two filters feeding it instead of one.
    //
    // Extracted out of renderMine() so selectAllVisible() (docs/roadmap.md
    // part 3 item 0, "select all") can select exactly what's on screen -
    // by definition the same filtered set renderMine() itself displays,
    // not a second, possibly-drifting computation of "what's visible".
    function currentDisplayedEntries() {
      const map = itemsForLegFilter(itemsForCategoryFilter(activeList), activeLegFilter);

      return Object.entries(map)
        .map(([id, item]) => ({
          id,
          ...item
        }))
        .sort((first, second) =>
          (first.isDone - second.isDone) ||
          (first.createdAt - second.createdAt)
        );
    }

    function renderMine() {
      renderLists();
      renderLegFilter();
      renderQuickPicks();
      updateManageListBtnState();
      updateAiSuggestBtnState();

      const entries = currentDisplayedEntries();

      let totalUnits = 0;
      let doneUnits = 0;

      entries.forEach(item => {
        const subs = item.subItems ? Object.entries(item.subItems) : [];

        if (subs.length) {
          subs.forEach(([, sub]) => {
            totalUnits += 1;
            if (sub.isDone) doneUnits += 1;
          });
        } else {
          totalUnits += 1;
          if (item.isDone) doneUnits += 1;
        }
      });

      const unitPercentage =
        totalUnits ? Math.round(doneUnits / totalUnits * 100) : 0;

      $("progressText").textContent =
        `${doneUnits}/${totalUnits} · ${unitPercentage}%`;

      $("progressText").setAttribute(
        "aria-label",
        `${tr("התקדמות", "Progress")}: ${doneUnits}/${totalUnits}, ${unitPercentage}%`
      );

      $("progressBar").style.width =
        `${unitPercentage}%`;

      if (totalUnits && unitPercentage === 100) {
        if (!celebratedLists.has(activeList)) {
          celebratedLists.add(activeList);
          fireConfetti();
        }
      } else {
        celebratedLists.delete(activeList);
      }

      $("items").innerHTML =
        entries.length
          ? entries.map(item => {
              const subs = Object.entries(item.subItems || {}).map(([id, sub]) => ({ id, ...sub }));
              const hasSubs = subs.length > 0;
              const subDone = subs.filter(s => s.isDone).length;
              const isExpanded = expandedItems.has(item.id);

              return `
              <article class="item ${item.isDone ? "done" : ""} ${selectionMode ? "selection-mode" : ""} ${selectedIds.has(item.id) ? "selected" : ""}">
                ${selectionMode ? `
                  <input
                    class="select-check"
                    type="checkbox"
                    data-select="${item.id}"
                    data-category="${item.categoryId}"
                    ${selectedIds.has(item.id) ? "checked" : ""}
                    aria-label="${tr("בחירה", "Select")}">
                ` : hasSubs ? `
                  <span class="sub-progress">${subDone}/${subs.length}</span>
                ` : `
                  <input
                    class="check"
                    type="checkbox"
                    data-check="${item.id}"
                    data-category="${item.categoryId}"
                    ${item.isDone ? "checked" : ""}>
                `}

                <div class="item-info">
                  <span class="item-name">
                    ${escapeHtml(item.name)}
                  </span>

                  <span class="meta">
                    ${item.isPublic
                      ? tr("משותף", "Shared")
                      : tr("פרטי", "Private")}
                    ${item.importedFrom
                      ? ` · ${tr("יובא מ ", "Imported from ")}${escapeHtml(item.importedFrom)}`
                      : ""}
                  </span>
                </div>

                <div class="item-actions">
                  <button
                    class="mini expand-toggle ${isExpanded ? "expanded" : ""}"
                    data-expand="${item.id}"
                    data-category="${item.categoryId}"
                    aria-expanded="${isExpanded ? "true" : "false"}"
                    aria-label="${tr("תת-פריטים", "Sub-items")}">
                    ${isExpanded ? "▾" : "▸"}
                  </button>

                  <button
                    class="mini visibility-toggle"
                    data-toggle-visibility="${item.id}"
                    data-category="${item.categoryId}"
                    aria-label="${item.isPublic
                      ? tr("הפוך לפרטי", "Make private")
                      : tr("שתף עם הקבוצה", "Share with group")}">
                    ${item.isPublic ? "🌐" : "🔒"}
                  </button>

                  <button
                    class="mini"
                    data-edit="${item.id}"
                    data-category="${item.categoryId}"
                    aria-label="${tr("אפשרויות", "Options")}">
                    •••
                  </button>
                </div>

                ${isExpanded ? `
                  <div class="sub-panel">
                    ${subs.map(sub => `
                      <div class="sub-item">
                        <input class="check" type="checkbox" data-sub-check="${item.id}:${sub.id}" data-category="${item.categoryId}" ${sub.isDone ? "checked" : ""}>
                        <span class="sub-name ${sub.isDone ? "sub-done" : ""}">${escapeHtml(sub.name)}</span>
                        <button class="mini" data-sub-delete="${item.id}:${sub.id}" data-category="${item.categoryId}" aria-label="${tr("מחיקה", "Delete")}">✕</button>
                      </div>
                    `).join("")}

                    <div class="sub-add-row">
                      <input type="text" class="sub-add-input" data-sub-add-input="${item.id}" data-category="${item.categoryId}" maxlength="80" placeholder="${tr("הוספת תת-פריט...", "Add sub-item...")}">
                      <button class="mini" data-sub-add="${item.id}" data-category="${item.categoryId}" aria-label="${tr("הוספה", "Add")}">➕</button>
                    </div>
                  </div>
                ` : ""}
              </article>
            `;
            }).join("")
          : (() => {
              // docs/roadmap.md part 3 item 0 - invitation, not a notice:
              // the whole box is the same "add item" action the FAB opens
              // (wired below via addItemFab.click(), not a parallel path),
              // so it disappears the moment one real item exists and the
              // user already knows where the FAB is by then.
              const destName =
                window.getCurrentLegName
                  ? window.getCurrentLegName(trip)
                  : null;

              const emptyTitle = destName
                ? tr(`מה לוקחים ל${destName}?`, `What are you packing for ${destName}?`)
                : tr("מה לוקחים לטיול?", "What are you packing for the trip?");

              return `
                <button type="button" class="empty-action" data-open-add>
                  <span class="emoji">🎒</span>
                  <strong>${escapeHtml(emptyTitle)}</strong>
                  <span>${tr(
                    "התחילו מפריט אחד — או תנו ל-AI להציע רשימה.",
                    "Start with one item — or let AI suggest a list."
                  )}</span>
                  <span class="empty-action-cta">${tr("+ הוסף פריט", "+ Add item")}</span>
                </button>
              `;
            })();

      const emptyActionBtn = document.querySelector("[data-open-add]");

      if (emptyActionBtn) {
        emptyActionBtn.onclick = () => {
          $("addItemFab").click();
        };
      }

      document
        .querySelectorAll("[data-check]")
        .forEach(checkbox => {
          checkbox.onchange = () => {
            const categoryId = requireCategory(checkbox, "data-check");

            update(
              ref(
                db,
                `${userBase()}/items/${categoryId}/${checkbox.dataset.check}`
              ),
              {
                isDone:checkbox.checked
              }
            );
          };
        });

      document
        .querySelectorAll("[data-edit]")
        .forEach(button => {
          button.onclick = () => {
            const categoryId = requireCategory(button, "data-edit");
            openEdit(button.dataset.edit, categoryId);
          };
        });

      document
        .querySelectorAll("[data-toggle-visibility]")
        .forEach(button => {
          button.onclick = () => {
            const categoryId = requireCategory(button, "data-toggle-visibility");
            const id = button.dataset.toggleVisibility;
            const item = items?.[categoryId]?.[id];

            if (!item) {
              return;
            }

            update(
              ref(
                db,
                `${userBase()}/items/${categoryId}/${id}`
              ),
              { isPublic: !item.isPublic }
            );
          };
        });

      document
        .querySelectorAll("[data-expand]")
        .forEach(button => {
          button.onclick = () => {
            const id = button.dataset.expand;

            if (expandedItems.has(id)) {
              expandedItems.delete(id);
            } else {
              expandedItems.add(id);
            }

            renderMine();
          };
        });

      document
        .querySelectorAll("[data-sub-check]")
        .forEach(checkbox => {
          checkbox.onchange = () => {
            const categoryId = requireCategory(checkbox, "data-sub-check");
            const [itemId, subId] = checkbox.dataset.subCheck.split(":");

            update(
              ref(
                db,
                `${userBase()}/items/${categoryId}/${itemId}/subItems/${subId}`
              ),
              { isDone: checkbox.checked }
            );
          };
        });

      document
        .querySelectorAll("[data-sub-delete]")
        .forEach(button => {
          button.onclick = () => {
            const categoryId = requireCategory(button, "data-sub-delete");
            const [itemId, subId] = button.dataset.subDelete.split(":");

            remove(
              ref(
                db,
                `${userBase()}/items/${categoryId}/${itemId}/subItems/${subId}`
              )
            );
          };
        });

      // categoryId is the sub-item's PARENT category - sub-items don't
      // carry their own (see renderMine(), which tags every sub-item
      // element with the parent item's categoryId, not one of its own).
      function addSubItem(itemId, categoryId) {
        const input = document.querySelector(`[data-sub-add-input="${itemId}"]`);
        const name = input.value.trim();

        if (!name) {
          return;
        }

        push(
          ref(
            db,
            `${userBase()}/items/${categoryId}/${itemId}/subItems`
          ),
          { name, isDone: false }
        );

        input.value = "";
      }

      document
        .querySelectorAll("[data-sub-add]")
        .forEach(button => {
          button.onclick = () =>
            addSubItem(button.dataset.subAdd, requireCategory(button, "data-sub-add"));
        });

      document
        .querySelectorAll("[data-sub-add-input]")
        .forEach(input => {
          input.onkeydown = event => {
            if (event.key === "Enter") {
              event.preventDefault();
              addSubItem(input.dataset.subAddInput, requireCategory(input, "data-sub-add-input"));
            }
          };
        });

      document
        .querySelectorAll("[data-select]")
        .forEach(checkbox => {
          checkbox.onchange = () => {
            const id = checkbox.dataset.select;

            if (checkbox.checked) {
              const categoryId = requireCategory(checkbox, "data-select");
              selectedIds.set(id, categoryId);
            } else {
              selectedIds.delete(id);
            }

            renderMine();
          };
        });

      updateBulkBar();
    }

    // Shown for the whole duration of selectionMode, not just once
    // something is checked (that was the previous behavior - selectedIds.size
    // > 0 gated it too). "בחר הכל" (selectAllVisible) needs to be reachable
    // from a zero-selected state, which is exactly when it's most useful -
    // gating the bar on a non-empty selection would hide the one button
    // meant to help you get to a non-empty selection in the first place.
    // The other buttons are unaffected: bulkDelete/bulkToggleDone/
    // openBulkMove already no-op on an empty selectedIds.
    function updateBulkBar() {
      const bar = $("bulkBar");

      if (selectionMode) {
        bar.classList.remove("hidden");

        $("bulkCount").textContent =
          tr(
            `${selectedIds.size} נבחרו`,
            `${selectedIds.size} selected`
          );
      } else {
        bar.classList.add("hidden");
      }
    }

    function setSelectionMode(next) {
      selectionMode = next;

      if (!next) {
        selectedIds = new Map();
      }

      $("selectModeBtn").classList.toggle("active", selectionMode);
      renderMine();

      // The button's own title/aria-label ("בחירה מרובה") never shows on touch -
      // there's no hover state on mobile - so entering the mode needs its own
      // explanation of what just changed.
      if (next) {
        toast(
          tr(
            "מצב בחירה מרובה: סמנו פריטים ובחרו פעולה למטה",
            "Multi-select mode: check items, then pick an action below"
          )
        );
      }
    }

    // Selects exactly what's currently displayed (currentDisplayedEntries -
    // the same filtered/sorted set renderMine() renders), not everything in
    // the packing list. A user with "all" or a leg filter active would
    // otherwise get a silent surprise - items selected that they never saw.
    // No toggle-to-"clear all" - the label and the action stay fixed
    // ("select all", always selects), and the existing bulkCancelBtn
    // ("ביטול") already offers a way out of selection mode entirely, so a
    // second button/state for "deselect" would be redundant. Idempotent by
    // construction: re-running it when everything's already selected just
    // re-sets the same Map entries, nothing visibly changes.
    function selectAllVisible() {
      if (!selectionMode) {
        return;
      }

      currentDisplayedEntries().forEach(item => {
        selectedIds.set(item.id, item.categoryId);
      });

      renderMine();
    }

    async function bulkDelete() {
      if (!selectedIds.size) {
        return;
      }

      if (
        !(await customConfirm(
          tr(
            `למחוק ${selectedIds.size} פריטים?`,
            `Delete ${selectedIds.size} items?`
          ),
          { danger: true }
        ))
      ) {
        return;
      }

      const updates = {};

      selectedIds.forEach((categoryId, id) => {
        assertCategory(categoryId, "bulkDelete");
        updates[`${userBase()}/items/${categoryId}/${id}`] = null;
      });

      await update(ref(db), updates);
      setSelectionMode(false);
      toast(tr("הפריטים נמחקו", "Items deleted"));
    }

    async function bulkToggleDone() {
      if (!selectedIds.size) {
        return;
      }

      // Reads each item from its own category bucket, not currentItems()
      // (activeList-scoped) - a cross-category selection would otherwise
      // silently read undefined for every item outside the active list,
      // and "are they all done" would come out wrong for no visible reason.
      const allDone =
        [...selectedIds].every(([id, categoryId]) => items?.[categoryId]?.[id]?.isDone);

      const updates = {};

      selectedIds.forEach((categoryId, id) => {
        assertCategory(categoryId, "bulkToggleDone");
        updates[`${userBase()}/items/${categoryId}/${id}/isDone`] = !allDone;
      });

      await update(ref(db), updates);
      setSelectionMode(false);
    }

    function openBulkMove() {
      if (!selectedIds.size) {
        return;
      }

      // Excludes the shared source category only when the whole selection
      // came from one category (the common case, and what this dropdown
      // always did before cross-category selection existed). A selection
      // spanning categories has no single "current" one to hide - every
      // real category is a valid target for at least some selected items,
      // and confirmBulkMove() below skips per-item no-ops (already at the
      // target) on its own.
      const selectedCategories = new Set(selectedIds.values());
      const sharedCategory =
        selectedCategories.size === 1 ? [...selectedCategories][0] : null;

      $("bulkMoveTarget").innerHTML =
        allListIds()
          .filter(id => id !== sharedCategory)
          .map(id =>
            `<option value="${escapeHtml(id)}">` +
            `${escapeHtml(listLabel(id))}</option>`
          )
          .join("");

      if (!$("bulkMoveTarget").options.length) {
        return toast(
          tr(
            "אין רשימה אחרת להעביר אליה",
            "There's no other list to move to"
          )
        );
      }

      $("bulkMoveOverlay").classList.remove("hidden");
    }

    async function confirmBulkMove() {
      const targetList = $("bulkMoveTarget").value;

      if (!targetList || !selectedIds.size) {
        return;
      }

      const updates = {};
      let movedCount = 0;

      selectedIds.forEach((categoryId, id) => {
        assertCategory(categoryId, "confirmBulkMove");

        // Already at the target (possible in a cross-category selection,
        // even though openBulkMove() excludes the target when EVERY
        // selected item shares it) - nothing to write for this one.
        if (categoryId === targetList) {
          return;
        }

        const item = items?.[categoryId]?.[id];

        if (!item) {
          return;
        }

        updates[`${userBase()}/items/${categoryId}/${id}`] = null;
        updates[`${userBase()}/items/${targetList}/${id}`] = item;
        movedCount++;
      });

      if (!movedCount) {
        $("bulkMoveOverlay").classList.add("hidden");
        setSelectionMode(false);
        toast(tr("הפריטים כבר ברשימה הזו", "Items are already on that list"));
        return;
      }

      await update(ref(db), updates);
      $("bulkMoveOverlay").classList.add("hidden");
      setSelectionMode(false);

      // Deliberately NOT jumping activeList to targetList here, unlike
      // saveEdit()'s single-item move. The user just finished a multi-select
      // action, often spanning several source categories - yanking the view
      // to targetList would lose the context of whatever's left selected/
      // visible, for no single "where it went" that makes sense across a
      // whole batch. Single-item edit still jumps on purpose; don't "fix"
      // bulk to match it.
      toast(
        tr(`${movedCount} הועברו`, `${movedCount} moved`)
      );
    }

    function renderGroup() {
      const users =
        allPacking?.users || {};

      const blocks = [];

      // Own items are excluded, not just shown read-only - this view is
      // "what everyone ELSE is packing" (you already see your own list on
      // the other tab). The ◻️/✅ mark was always a plain <span>, never a
      // real checkbox, for anyone here - it's the import mechanism's status
      // display, and a row with no import button (your own, before this
      // filter) just showed the inert mark with nothing next to it to
      // explain why.
      Object.entries(users)
        .filter(([uid]) => uid !== user?.uid)
        .forEach(([uid, data]) => {
          const publicItems = [];

          Object.entries(data.items || {})
            .forEach(([listId, list]) => {
              Object.entries(list || {})
                .forEach(([itemId, item]) => {
                  if (item.isPublic) {
                    publicItems.push({ uid, listId, itemId, ...item });
                  }
                });
            });

          if (!publicItems.length) {
            return;
          }

          const member =
            trip.memberProfiles?.[uid]?.name ||
            publicItems[0]?.ownerName ||
            tr("משתתף", "Traveler");

          blocks.push(`
            <section class="card group-block">
              <h3 class="group-title">
                ${escapeHtml(member)}
              </h3>

              <div class="items">
                ${publicItems.map(item => `
                  <div class="item ${item.isDone ? "done" : ""}">
                    <span>${item.isDone ? "✅" : "◻️"}</span>
                    <div class="item-name">
                      ${escapeHtml(item.name)}
                    </div>
                    <button
                      class="mini"
                      data-import="${item.uid}:${item.listId}:${item.itemId}"
                      aria-label="${tr("ייבוא לרשימה שלי", "Import to my list")}">
                      ⬇️
                    </button>
                  </div>
                `).join("")}
              </div>
            </section>
          `);
        });

      // "no one else" now, not "nothing shared" - the viewer's own shared
      // items are filtered out above, so this state can be reached even
      // after the viewer shared something themselves.
      $("groupItems").innerHTML =
        blocks.join("") ||
        `
          <div class="card empty">
            <span class="emoji">👥</span>
            <strong>${tr("אף אחד אחר עדיין לא שיתף", "No one else has shared yet")}</strong>
            <span>${tr(
              "שתפו פריט מהרשימה שלכם, וכולם יראו מי כבר לקח מה.",
              "Share an item from your list, and everyone will see who's already got what."
            )}</span>
          </div>
        `;

      document
        .querySelectorAll("[data-import]")
        .forEach(button => {
          button.onclick = () => {
            importItem(button.dataset.import);
          };
        });
    }

    let pendingImportKey = null;

    // Confirmed by design: match by *name*, not category id - custom-list
    // ids are per-user timestamps (list_...), so two users' conceptually
    // identical categories almost never share an id even when they share
    // a name. Same normalization as addItem()'s own dedup check.
    function normalizeListName(name) {
      return (name || "").trim().toLocaleLowerCase();
    }

    // No "create a category named X" option here - same principle as
    // tripCharacter's own additions (docs/schema-legs.md §3.2, only ever
    // append to gear/clothing, never a new category): importing must land
    // in a category that already exists, never mint one from whatever
    // string a friend happened to name their own. Without this, importing
    // an item from a friend's oddly- or personally-named category silently
    // created a matching category here too.
    function openImportCategoryPicker(key, sourceCategoryName) {
      pendingImportKey = key;

      $("importCategoryText").textContent = tr(
        `הפריט הזה מגיע מקטגוריה בשם "${sourceCategoryName}" שאין לך. לאיזו קטגוריה קיימת להוסיף אותו?`,
        `This item comes from a category named "${sourceCategoryName}" that you don't have. Which existing category should it go in?`
      );

      $("importCategorySelect").innerHTML =
        allListIds()
          .map(id => `<option value="${escapeHtml(id)}">${escapeHtml(listLabel(id))}</option>`)
          .join("");

      // main is always present (allListIds() guarantees it) and always a
      // sensible landing spot - explicit for the same reason the old
      // default was explicit, not relying on first-in-DOM-order.
      $("importCategorySelect").value = "main";

      $("importCategoryOverlay").classList.remove("hidden");
    }

    async function importItem(key, explicitCategoryId) {
      const [sourceUid, sourceListId, sourceItemId] = key.split(":");

      const sourceItem =
        allPacking?.users?.[sourceUid]?.items?.[sourceListId]?.[sourceItemId];

      if (!sourceItem) {
        return;
      }

      if (!requireProfile()) {
        return;
      }

      let targetCategory = explicitCategoryId;

      if (!targetCategory) {
        const sourceCategoryName = listLabelFor(sourceUid, sourceListId);

        const matchId = allListIds().find(id =>
          normalizeListName(listLabel(id)) ===
          normalizeListName(sourceCategoryName)
        );

        if (matchId) {
          targetCategory = matchId;
        } else {
          openImportCategoryPicker(key, sourceCategoryName);
          return;
        }
      }

      assertCategory(targetCategory, "importItem");

      const memberName =
        trip.memberProfiles?.[sourceUid]?.name ||
        sourceItem.ownerName ||
        tr("חבר/ה לקבוצה", "a group member");

      // docs/schema-legs.md §5.1 - deliberately NOT sourceItem.legId.
      // Category carries over (by name-match above, or picked explicitly)
      // because it's semantic: "מסמכים" means the same thing to everyone
      // on the trip. A leg tag is personal context, not shared meaning -
      // the friend's copy might be tagged to Rome because THEY are
      // staying on two extra days there, which says nothing about where
      // the importing user needs their own copy. So this follows the
      // same rule as a brand-new typed item (addItem() above): tag with
      // the IMPORTING user's own active leg filter, not carried over from
      // the source. Doesn't happen automatically the way it does for
      // AI-suggestion/quick-pick adds - those call addItem() itself,
      // importItem() has always had its own push() here.
      await push(
        ref(db, `${userBase()}/items/${targetCategory}`),
        {
          name: sourceItem.name,
          isDone: false,
          isPublic: false,
          importedFrom: memberName,
          ownerName: profile.name,
          createdByUid: user.uid,
          createdAt: Date.now(),
          ...(activeLegFilter !== "all" ? { legId: activeLegFilter } : {})
        }
      );

      toast(
        tr(
          `הפריט יובא לרשימה "${listLabel(targetCategory)}"`,
          `Item imported to "${listLabel(targetCategory)}"`
        )
      );
    }

    function render() {
      renderMine();
      renderGroup();
    }

    function listenPacking() {
      if (
        !user ||
        !tripRoot ||
        packingListening
      ) {
        return;
      }

      packingListening = true;
      let starterCheckDone = false;

      onValue(
        ref(db, `${tripRoot}/packing`),
        async snapshot => {
          allPacking = snapshot.val() || {};

          items =
            allPacking.users?.[user.uid]?.items || {};

          if (!starterCheckDone) {
            starterCheckDone = true;
            await ensureStarterLists();
          }

          render();
        }
      );
    }

    const CATEGORY_KEYWORDS = [
      {
        name: tr("תרופות ועזרה ראשונה", "Medicine & first aid"),
        icon: "💊",
        keywords: [
          "כדור", "כדורים", "תרופה", "תרופות", "אקמול", "נורופן",
          "אדוויל", "אספירין", "פלסטר", "תחבושת", "ויטמין", "משחה",
          "מדחום", "טרמומטר", "אנטיביוטיקה", "תרסיס אף", "כדורי הרגעה",
          "pill", "pills", "medicine", "medication", "tylenol", "advil",
          "aspirin", "bandage", "band-aid", "vitamin", "ointment",
          "thermometer", "antibiotic"
        ]
      },
      {
        name: tr("תיק רחצה", "Toiletries bag"),
        icon: "🧴",
        keywords: [
          "קרם", "סבון", "שמפו", "מרכך", "בושם", "מברשת שיניים",
          "משחת שיניים", "דאודורנט", "ג'ל רחצה", "קרם פנים", "קרם גוף",
          "תער", "מסרק", "קרם הגנה",
          "soap", "shampoo", "conditioner", "perfume", "toothbrush",
          "toothpaste", "deodorant", "razor", "lotion", "sunscreen",
          "comb"
        ]
      },
      {
        name: tr("אלקטרוניקה", "Electronics"),
        icon: "🔌",
        keywords: [
          "מטען", "כבל", "מתאם", "סוללות", "אוזניות", "פאוור בנק",
          "charger", "cable", "adapter", "batteries", "headphones",
          "powerbank", "power bank"
        ]
      },
      {
        name: tr("מסמכים", "Documents"),
        icon: "📄",
        keywords: [
          "דרכון", "כרטיס טיסה", "ביטוח", "אישור", "תעודת זהות", "ויזה",
          "passport", "ticket", "insurance", "visa", "boarding pass"
        ]
      }
    ];

    function detectSuggestedCategory(rawText) {
      const text = rawText.trim().toLocaleLowerCase();

      if (!text) {
        return null;
      }

      for (const category of CATEGORY_KEYWORDS) {
        if (text === category.name.toLocaleLowerCase()) {
          continue;
        }

        const matched = category.keywords.some(keyword =>
          text.includes(keyword.toLocaleLowerCase())
        );

        if (matched) {
          return category;
        }
      }

      return null;
    }

    function updateCategorySuggestion() {
      const box = $("categorySuggest");

      // addToSuggestedCategory() (below) writes to activeList unchanged -
      // it was never converted to take an explicit category the way
      // addItem() was, since building a second category picker just for
      // this secondary feature would be real scope creep. Simplest correct
      // fix: don't offer the suggestion at all while browsing "all" - the
      // keyword-grouping feature simply isn't available until the user is
      // looking at one specific real category, same as it always required
      // an active list before cross-category filtering existed.
      if (activeList === "all") {
        box.classList.remove("show");
        return;
      }

      const value = $("newItem").value;
      const category = detectSuggestedCategory(value);

      if (!category) {
        box.classList.remove("show");
        return;
      }

      $("categorySuggestText").textContent = tr(
        `${category.icon} זה נשמע כמו "${category.name}" - להוסיף כתת-פריט?`,
        `${category.icon} This looks like "${category.name}" - add as a sub-item?`
      );

      box.dataset.categoryName = category.name;
      box.classList.add("show");
    }

    async function addToSuggestedCategory() {
      const box = $("categorySuggest");
      const categoryName = box.dataset.categoryName;
      const value = $("newItem").value.trim();

      if (!categoryName || !value || !user) {
        return;
      }

      if (!requireProfile()) {
        return;
      }

      const items = currentItems();

      let parentId = Object.keys(items).find(id =>
        items[id].name?.trim().toLocaleLowerCase() ===
        categoryName.toLocaleLowerCase()
      );

      if (!parentId) {
        const newParentRef = await push(
          ref(db, `${userBase()}/items/${activeList}`),
          {
            name: categoryName,
            isDone: false,
            isPublic: false,
            ownerName: profile.name,
            createdAt: Date.now(),
            createdByUid: user.uid
          }
        );

        parentId = newParentRef.key;
      }

      await push(
        ref(db, `${userBase()}/items/${activeList}/${parentId}/subItems`),
        { name: value, isDone: false }
      );

      $("newItem").value = "";
      box.classList.remove("show");

      toast(
        tr(
          `נוסף תחת "${categoryName}"`,
          `Added under "${categoryName}"`
        )
      );
    }

    // explicitCategoryId is only passed by the "all" picker in the
    // add-item overlay (addBtn/newItem's Enter handler, below) - every
    // other existing caller (quick-picks, AI suggestions) still just
    // passes a name, so they keep targeting activeList exactly as before.
    async function addItem(value, explicitCategoryId, explicitLegId) {
      const name =
        (value || $("newItem").value).trim();

      if (!name || !user) {
        return;
      }

      if (!requireProfile()) {
        return;
      }

      const targetCategory = explicitCategoryId || activeList;

      // No fallback, same rule as steps 3-4: "all" is never a real category
      // to write into. The addBtn/Enter handlers always resolve an explicit
      // category before calling addItem() while filtered to "all" - this
      // only fires if something upstream forgot to.
      assertCategory(targetCategory !== "all" ? targetCategory : null, "addItem");

      // Across every category, not just targetCategory - decided
      // deliberately for consistency with AI suggestions' own dedup
      // (renderAiSuggestions), which already checks every list for the
      // same reason: a duplicate of something on a *different* list is
      // still a duplicate the user doesn't want two copies of.
      const alreadyExists =
        Object.values(items || {})
          .flatMap(list => Object.values(list || {}))
          .some(item =>
            item.name
              ?.trim()
              .toLocaleLowerCase() ===
            name.toLocaleLowerCase()
          );

      if (alreadyExists) {
        return toast(
          tr(
            "הפריט כבר קיים ברשימה",
            "Item already exists"
          )
        );
      }

      // docs/schema-legs.md §5.1 - a new item picks up the active
      // destination filter automatically, but only when a specific leg
      // is selected: "all" is not a real leg any more than it's a real
      // category (assertCategory above already refuses it for
      // targetCategory for the same reason). No legId at all is the
      // normal, permanent state for most items - matches §5.1's own
      // compatibility rule that an item without one appears in every
      // filter, not something migrated in later.
      //
      // §7ব, step 12 commit ג - explicitLegId lets a caller that already
      // knows the correct leg (multi-leg AI suggestions - see
      // renderAiSuggestions' click handler) bypass activeLegFilter
      // entirely, since acceptance can happen while the page is filtered
      // to "all" but the individual suggestion clearly belongs to one
      // specific leg (or explicitly none, for a shared/untagged one -
      // legId:null). Every OTHER call site (typed input, quick-pick
      // accept, single-call AI accept) never passes a third argument, so
      // explicitLegId stays undefined there and this falls through to the
      // exact activeLegFilter-based tagging that's always run - unchanged.
      await push(
        ref(
          db,
          `${userBase()}/items/${targetCategory}`
        ),
        {
          name,
          isDone:false,
          isPublic:false,
          ownerName:profile.name,
          createdAt:Date.now(),
          createdByUid:user.uid,
          ...(explicitLegId !== undefined
            ? (explicitLegId ? { legId: explicitLegId } : {})
            : (activeLegFilter !== "all" ? { legId: activeLegFilter } : {}))
        }
      );

      $("newItem").value = "";
      $("categorySuggest").classList.remove("show");

      toast(
        tr("הפריט נוסף", "Item added")
      );
    }

    function openEdit(id, categoryId) {
      const item = items?.[categoryId]?.[id];

      if (!item) {
        return;
      }

      editingId = id;
      editingCategoryId = categoryId;
      $("editName").value = item.name || "";

      $("editVisibility").value =
        item.isPublic
          ? "public"
          : "private";

      $("editListSelect").innerHTML =
        allListIds()
          .map(listId =>
            `<option value="${escapeHtml(listId)}">` +
            `${escapeHtml(listLabel(listId))}</option>`
          )
          .join("");

      // The item's own category - captured above, not activeList. This is
      // what makes the source/target distinction in saveEdit() correct.
      $("editListSelect").value = editingCategoryId;

      $("editOverlay")
        .classList
        .remove("hidden");
    }

    async function saveEdit() {
      if (!editingId || !editingCategoryId) {
        return;
      }

      const name =
        $("editName").value.trim();

      if (!name) {
        return;
      }

      const targetList = $("editListSelect").value;
      const sourceList = editingCategoryId;
      const fields = {
        name,
        isPublic:
          $("editVisibility").value === "public"
      };

      if (targetList && targetList !== sourceList) {
        const existingItem = items?.[sourceList]?.[editingId];

        await update(ref(db), {
          [`${userBase()}/items/${sourceList}/${editingId}`]: null,
          [`${userBase()}/items/${targetList}/${editingId}`]: {
            ...existingItem,
            ...fields
          }
        });

        activeList = targetList;
        toast(tr("הפריט הועבר", "Item moved"));
      } else {
        await update(
          ref(
            db,
            `${userBase()}/items/${sourceList}/${editingId}`
          ),
          fields
        );
      }

      $("editOverlay")
        .classList
        .add("hidden");

      editingId = null;
      editingCategoryId = null;
    }

    function loadTrip() {
      if (!tripRoot) {
        $("loginOverlay")
          .classList
          .add("hidden");

        toast("Missing tripId");
        return;
      }

      if (stopTrip) {
        stopTrip();
      }

      stopTrip = onValue(
        ref(db, tripRoot),
        snapshot => {
          if (!snapshot.exists()) {
            toast(
              tr(
                "הטיול לא נמצא",
                "Trip not found"
              )
            );

            return;
          }

          trip = snapshot.val();
          tripDataLoaded = true;

          try {
            localStorage.setItem(langKey, trip.language || "he");
            localStorage.setItem("lastTripId", tripId);
          } catch (e) { /* ignore */ }

          applyTheme();
          applyAccent();
          applyLanguage();
          configureLinks();

          // Independent of identity - the packing list itself doesn't need
          // to know who the user is (it's keyed by uid, not by claimed
          // name), same as places.html/itinerary.html's content render.
          // Self-guards on !user/!tripRoot/packingListening, so this is
          // safe to call unconditionally here.
          listenPacking();

          if (user) {
            loadProfile();
          }
        },
        () => {
          stopTrip = null;

          toast(
            tr(
              "לא ניתן לטעון את הטיול",
              "Could not load the trip"
            )
          );
        }
      );
    }

    async function loadProfile() {
      if (profileLoadTimer) {
        clearTimeout(profileLoadTimer);
      }

      const gen = ++profileLoadGen;
      let resolved = false;

      // If the get() below never resolves, fall back to the "no profile"
      // state after 8s. #memberOverlay is gone (docs/roadmap.md part 3
      // item 0, commit ב) so there's no fallback UI to reveal anymore -
      // the stuck initial read is exactly the class of problem a retry
      // attempt is unlikely to fix (see auth-gate.js's own reasoning for
      // the same timeout pattern), so this surfaces a toast instead of
      // silently leaving profile null with nothing on screen explaining
      // why actions that need a profile aren't working.
      const timer = setTimeout(() => {
        if (resolved) return;
        resolved = true;

        if (gen !== profileLoadGen) return;

        console.warn("loadProfile timed out after 8s on packing.html - treating as no profile");
        window.__gtProfileTimeout = { page: "packing.html", at: Date.now() };

        profile = null;
        syncIdentity();
        toast(tr("לא ניתן היה לטעון את הפרופיל שלך. רעננו ונסו שוב.", "Couldn't load your profile. Refresh and try again."));
      }, 8000);

      profileLoadTimer = timer;

      try {
        const snapshot = await get(
          ref(
            db,
            `${tripRoot}/memberProfiles/${user.uid}`
          )
        );

        if (resolved) {
          return;
        }

        resolved = true;
        clearTimeout(timer);

        if (gen !== profileLoadGen) {
          return;
        }

        profile = snapshot.val();

        // docs/roadmap.md part 3 item 0, commit ב - no name-picker gate
        // for a first-time joiner. Auto-register from their Google
        // identity instead (member.js, shared with index.html - see its
        // own comment on why claims are keyed by uid, not name).
        if (!profile && window.autoRegisterMember) {
          try {
            profile = await window.autoRegisterMember({
              uid: user.uid,
              displayName: user.displayName,
              email: user.email,
              photoURL: user.photoURL,
              fallbackName: tr("משתתף", "Traveler"),
              tryClaim: (key, uid) =>
                runTransaction(
                  ref(db, `${tripRoot}/participantClaims/${key}`),
                  current => (current === null || current === uid) ? uid : undefined,
                  { applyLocally: false }
                ).then(result => Boolean(result.committed) && result.snapshot.val() === uid),
              writeProfile: fields =>
                set(ref(db, `${tripRoot}/memberProfiles/${user.uid}`), fields),
              rollbackClaim: (key, uid) =>
                runTransaction(
                  ref(db, `${tripRoot}/participantClaims/${key}`),
                  current => (current === uid ? null : current),
                  { applyLocally: false }
                )
            });

            if (gen !== profileLoadGen) {
              return;
            }

            // Best-effort, so index.html's trip picker can list this trip
            // too. Never blocks or surfaces a failure here - the join
            // itself already fully succeeded.
            update(ref(db), {
              [`users/${user.uid}/trips/${tripId}`]: {
                destination: window.getPrimaryLeg(trip).name || "",
                tripType: trip.tripType || "",
                language: trip.language || "he",
                startAt: trip.startAt || null,
                endAt: window.getLastLeg(trip).endAt || null,
                createdAt: trip.createdAt || Date.now()
              }
            }).catch(error => {
              console.error("Could not record trip under user's trip list:", error);
            });
          } catch (error) {
            console.error("[packing.html] loadProfile: auto-register failed", error);
            profile = null;
            toast(tr("לא ניתן היה להצטרף לטיול. רעננו ונסו שוב.", "Couldn't join the trip. Refresh and try again."));
          }
        }

        syncIdentity();
      } catch (error) {
        if (resolved) {
          return;
        }

        resolved = true;
        clearTimeout(timer);

        if (gen !== profileLoadGen) {
          return;
        }

        console.warn("loadProfile failed on packing.html - treating as no profile", error);
        window.__gtProfileTimeout = { page: "packing.html", at: Date.now() };

        profile = null;
        syncIdentity();
      }
    }

    $("googleBtn").onclick = doGoogleSignIn;

    $("themeBtn").onclick = () => {
      const isDark =
        document.documentElement.dataset.theme === "dark";

      localStorage.setItem(
        themeKey,
        isDark ? "light" : "dark"
      );

      applyTheme();
    };

    // Shared by the add button and Enter-in-the-input (below) so the two
    // trigger paths can't drift - exactly the kind of gap step 3 found in
    // addSubItem's own two paths.
    function addItemFromModal() {
      const categoryId =
        activeList === "all" ? $("addItemCategorySelect").value : undefined;

      addItem(undefined, categoryId);
    }

    $("addBtn").onclick = () => {
      addItemFromModal();
    };

    $("addItemFab").onclick = () => {
      resetAiSuggestions();

      const isAll = activeList === "all";

      $("addItemCategoryField").classList.toggle("hidden", !isAll);

      if (isAll) {
        $("addItemCategorySelect").innerHTML =
          allListIds()
            .map(id =>
              `<option value="${escapeHtml(id)}">` +
              `${escapeHtml(listLabel(id))}</option>`
            )
            .join("");
      }

      // docs/schema-legs.md §5.1's "visual indication" for the auto-tag
      // addItem() applies below - shown/hidden here (not computed inside
      // addItem() itself) because it has to be visible BEFORE the user
      // types the name, not after the item's already been written.
      const taggedLeg =
        activeLegFilter !== "all"
          ? window.getLegs(trip).find(leg => leg.id === activeLegFilter)
          : null;

      $("legTagHint").classList.toggle("hidden", !taggedLeg);
      $("legTagHint").textContent = taggedLeg
        ? tr(`יתווסף ל${taggedLeg.name}`, `Will be added to ${taggedLeg.name}`)
        : "";

      $("addItemOverlay").classList.remove("hidden");

      setTimeout(() => {
        $("newItem").focus();
      }, 300);
    };

    $("closeAddItemOverlay").onclick = () => {
      $("addItemOverlay").classList.add("hidden");
    };

    $("addItemOverlay").addEventListener("click", event => {
      if (event.target.id === "addItemOverlay") {
        $("closeAddItemOverlay").click();
      }
    });

    $("quickPicks").addEventListener("scroll", updateQuickPicksFade);
    $("categoryChips").addEventListener("scroll", updateCategoryChipsFade);

    $("newItem").onkeydown = event => {
      if (event.key === "Enter") {
        addItemFromModal();
      }
    };

    $("newItem").addEventListener("input", updateCategorySuggestion);

    $("categorySuggestBtn").onclick = addToSuggestedCategory;

    $("aiSuggestBtn").onclick = requestAiSuggestions;

    $("newListBtn").onclick = () => {
      $("newListName").value = "";
      $("newListOverlay").classList.remove("hidden");
    };

    $("cancelNewList").onclick = () => {
      $("newListOverlay").classList.add("hidden");
    };

    $("createListBtn").onclick = () => {
      createList($("newListName").value);
    };

    $("newListName").onkeydown = event => {
      if (event.key === "Enter") {
        createList($("newListName").value);
      }
    };

    $("cancelImportCategory").onclick = () => {
      $("importCategoryOverlay").classList.add("hidden");
      pendingImportKey = null;
    };

    $("confirmImportCategory").onclick = async () => {
      const targetCategoryId = $("importCategorySelect").value;
      const key = pendingImportKey;

      $("importCategoryOverlay").classList.add("hidden");
      pendingImportKey = null;

      await importItem(key, targetCategoryId);
    };

    $("manageListBtn").onclick = openManageList;

    $("cancelManageList").onclick = () => {
      $("manageListOverlay").classList.add("hidden");
    };

    $("renameListBtn").onclick = renameList;

    $("deleteListBtn").onclick = deleteList;

    $("duplicateListBtn").onclick = duplicateList;

    $("makeListPrivateBtn").onclick = () => setListVisibility(false);
    $("makeListPublicBtn").onclick = () => setListVisibility(true);

    $("selectModeBtn").onclick = () => {
      setSelectionMode(!selectionMode);
    };

    $("bulkCancelBtn").onclick = () => {
      setSelectionMode(false);
    };

    $("selectAllBtn").onclick = selectAllVisible;

    $("bulkDeleteBtn").onclick = bulkDelete;

    $("bulkToggleDoneBtn").onclick = bulkToggleDone;

    $("bulkMoveBtn").onclick = openBulkMove;

    $("cancelBulkMove").onclick = () => {
      $("bulkMoveOverlay").classList.add("hidden");
    };

    $("confirmBulkMove").onclick = confirmBulkMove;

    $("mineTab").onclick = () => {
      $("mineTab").classList.add("active");
      $("groupTab").classList.remove("active");
      $("mineView").classList.remove("hidden");
      $("groupView").classList.add("hidden");
    };

    $("groupTab").onclick = () => {
      $("groupTab").classList.add("active");
      $("mineTab").classList.remove("active");
      $("groupView").classList.remove("hidden");
      $("mineView").classList.add("hidden");
      renderGroup();
    };

    $("cancelEdit").onclick = () => {
      $("editOverlay")
        .classList
        .add("hidden");

      editingId = null;
      editingCategoryId = null;
    };

    [
      "newListOverlay",
      "manageListOverlay",
      "editOverlay",
      "bulkMoveOverlay",
      "importCategoryOverlay"
    ].forEach(overlayId => {
      const cancelId =
        "cancel" + overlayId.charAt(0).toUpperCase() +
        overlayId.slice(1).replace("Overlay", "");

      $(overlayId).addEventListener("click", event => {
        if (event.target.id === overlayId) {
          $(cancelId).click();
        }
      });
    });

    $("saveEdit").onclick = saveEdit;

    $("deleteItem").onclick = async () => {
      if (!editingId || !editingCategoryId) {
        return;
      }

      if (
        await customConfirm(
          tr(
            "למחוק את הפריט?",
            "Delete this item?"
          ),
          { danger: true }
        )
      ) {
        await remove(
          ref(
            db,
            `${userBase()}/items/${editingCategoryId}/${editingId}`
          )
        );

        $("editOverlay")
          .classList
          .add("hidden");

        editingId = null;
        editingCategoryId = null;
      }
    };

    function handleAuthStateChanged(authenticatedUser) {
      user = authenticatedUser;

      $("authLoading").classList.add("hidden");

      $("loginOverlay").classList.toggle(
        "hidden",
        Boolean(authenticatedUser)
      );

      if (authenticatedUser) {
        $("userChip").textContent =
          authenticatedUser.displayName ||
          authenticatedUser.email ||
          "";

        loadTrip();
      } else {
        profile = null;
        items = {};
        packingListening = false;

        if (stopTrip) {
          stopTrip();
          stopTrip = null;
        }
      }
    }

    onAuthStateChanged(auth, handleAuthStateChanged);

    if (window.armAuthGate) {
      window.armAuthGate(() => {
        if (auth.currentUser) {
          handleAuthStateChanged(auth.currentUser);
        }
      });
    }
  </script>
</body>
</html>
