<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123B63">
  <title>רשימת ציוד</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@600;700&family=Heebo:wght@600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary:#1D7A93;
      --primary-dark:#0F3E63;
      --accent:#f2b84b;
      --bg:#E8F1F0;
      --surface:#FFFEFB;
      --surface-2:#D6EBE9;
      --text:#17324a;
      --muted:#6f7f8c;
      --line:#C7DFDC;
      --danger:#c0533f;
      --success:#2f8b68;
      --shadow:0 12px 34px rgba(18,59,99,.09);
      --radius:22px;
    }

    :root.theme-local {
      --primary:#BD6E2E;
      --primary-dark:#7A431A;
      --accent:#4F8A8B;
      --bg:#F5E8D8;
      --surface:#FFFBF4;
      --surface-2:#F0DCC0;
      --line:#E3CBA8;
    }

    :root.theme-camping {
      --primary:#4f772d;
      --primary-dark:#2E4A1B;
      --accent:#d79a45;
      --bg:#E9F0DD;
      --surface:#FBFCF6;
      --surface-2:#DCE9C8;
      --line:#CFE0B8;
    }

    :root.theme-reserve {
      --primary:#55637A;
      --primary-dark:#2E3746;
      --accent:#c79b54;
      --bg:#E7EAEE;
      --surface:#FBFCFD;
      --surface-2:#D9DEE6;
      --line:#C7CDD6;
    }

    [data-theme="dark"] {
      --bg:#172126;
      --surface:#202c32;
      --surface-2:#26383b;
      --text:#f4f7f5;
      --muted:#aab8bb;
      --line:#35464a;
      --shadow:0 14px 36px rgba(0,0,0,.25);
    }

    * {
      box-sizing:border-box;
    }

    html {
      background:var(--bg);
    }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      min-height:100dvh;
      padding-bottom:calc(86px + env(safe-area-inset-bottom));
    }

    button,
    input,
    select {
      font:inherit;
    }

    button {
      cursor:pointer;
    }

    .hidden {
      display:none !important;
    }

    .shell {
      width:min(760px,100%);
      margin:auto;
      padding:max(14px,env(safe-area-inset-top)) 16px 24px;
    }

    .top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }

    .top-actions {
      display:flex;
      gap:8px;
    }

    .icon-btn {
      width:44px;
      height:44px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--surface);
      color:var(--text);
      display:grid;
      place-items:center;
      text-decoration:none;
      flex:0 0 auto;
    }

    .page-head {
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:12px;
    }

    .page-head-info {
      flex:1;
      min-width:0;
    }

    .page-head-dest {
      font-size:.74rem;
      font-weight:750;
      color:var(--primary);
    }

    .page-head h1 {
      font-family:'Frank Ruhl Libre', Georgia, serif;
      margin:1px 0 0;
      font-size:1.32rem;
      font-weight:700;
      line-height:1.2;
      color:var(--primary-dark);
    }

    .identity-row {
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .identity-row select {
      min-height:46px;
      flex:1;
      min-width:160px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:0 13px;
      color:var(--text);
      background:var(--surface);
    }

    .user-chip {
      font-size:.78rem;
      font-weight:700;
      color:var(--primary-dark);
      background:var(--surface-2);
      border:1px solid var(--line);
      padding:8px 12px;
      border-radius:999px;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .tabs {
      display:grid;
      grid-template-columns:1fr 1fr;
      background:var(--surface-2);
      padding:4px;
      border-radius:16px;
      margin:16px 0 12px;
    }

    .tab {
      min-height:44px;
      border:0;
      border-radius:12px;
      background:transparent;
      color:var(--muted);
      font-weight:750;
    }

    .tab.active {
      background:var(--surface);
      color:var(--primary-dark);
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    .card {
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:15px;
      box-shadow:var(--shadow);
    }

    .add-row {
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
    }

    .add-row input {
      width:100%;
      min-height:48px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--surface);
      color:var(--text);
      padding:0 14px;
      outline:none;
    }

    .add-row input:focus {
      border-color:var(--primary);
      box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 16%,transparent);
    }

    .primary-btn {
      min-height:48px;
      border:0;
      border-radius:14px;
      padding:0 18px;
      background:var(--primary);
      color:#fff;
      font-weight:800;
    }

    .quick-picks-label {
      font-size:.76rem;
      font-weight:750;
      color:var(--muted);
      margin-top:8px;
    }

    .quick-picks {
      display:flex;
      gap:7px;
      overflow:auto;
      padding:10px 1px 2px;
      scrollbar-width:none;
    }

    .quick-picks::-webkit-scrollbar {
      display:none;
    }

    .pick {
      border:1px solid var(--line);
      background:var(--surface-2);
      color:var(--text);
      border-radius:999px;
      padding:7px 11px;
      white-space:nowrap;
      font-size:.8rem;
    }

    .list-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:16px 2px 9px;
    }

    .list-head h2 {
      font-family:'Heebo', system-ui, sans-serif;
      font-size:1rem;
      font-weight:800;
      margin:0;
    }

    .list-select {
      min-height:42px;
      max-width:58%;
      border:1px solid var(--line);
      border-radius:13px;
      background:var(--surface);
      color:var(--text);
      padding:0 10px;
      font-weight:700;
    }

    .list-head-actions {
      display:flex;
      gap:6px;
      align-items:center;
    }

    .list-icon-btn {
      width:42px;
      height:42px;
      border:1px solid var(--line);
      border-radius:13px;
      background:var(--surface);
      color:var(--text);
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }

    .progress-wrap {
      margin-bottom:11px;
    }

    .progress-copy {
      display:flex;
      justify-content:space-between;
      font-size:.78rem;
      color:var(--muted);
      margin-bottom:6px;
    }

    .progress {
      height:8px;
      background:var(--surface-2);
      border-radius:999px;
      overflow:hidden;
    }

    .progress > span {
      display:block;
      height:100%;
      background:linear-gradient(90deg,var(--primary),var(--success));
      border-radius:inherit;
      transition:width .25s;
    }

    .items {
      display:grid;
      gap:8px;
    }

    .item {
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:10px;
      min-height:58px;
      border:1px solid var(--line);
      border-radius:16px;
      padding:9px 10px;
      background:var(--surface);
    }

    .item.selection-mode {
      grid-template-columns:auto auto 1fr auto;
    }

    .item.selected {
      border-color:var(--primary);
      background:color-mix(in srgb, var(--primary) 7%, var(--surface));
    }

    .select-check {
      width:24px;
      height:24px;
      accent-color:var(--primary);
    }

    .item.done {
      opacity:.64;
    }

    .item.done .item-name {
      text-decoration:line-through;
    }

    .check {
      width:24px;
      height:24px;
      accent-color:var(--primary);
    }

    .item-name {
      font-weight:700;
      word-break:break-word;
    }

    .meta {
      font-size:.72rem;
      color:var(--muted);
      margin-top:2px;
    }

    .item-actions {
      display:flex;
      align-items:center;
      gap:3px;
    }

    .mini {
      width:38px;
      height:38px;
      border:0;
      border-radius:12px;
      background:transparent;
      color:var(--muted);
    }

    .empty {
      text-align:center;
      padding:42px 14px;
      color:var(--muted);
    }

    .empty .emoji {
      font-size:2.4rem;
      display:block;
      margin-bottom:8px;
    }

    .group-block {
      margin-bottom:16px;
    }

    .group-title {
      font-size:.92rem;
      margin:0 0 8px;
      color:var(--primary-dark);
    }

    .bottom-nav {
      position:fixed;
      z-index:30;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      width:min(760px,100%);
      display:grid;
      grid-template-columns:repeat(5,1fr);
      background:rgba(255,253,250,.94);
      backdrop-filter:blur(18px);
      border-top:1px solid var(--line);
      padding:8px 5px max(8px,env(safe-area-inset-bottom));
    }

    .bottom-nav a {
      min-height:52px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      text-decoration:none;
      color:var(--muted);
      font-size:1.16rem;
      border-radius:13px;
    }

    .bottom-nav a span {
      font-size:.67rem;
    }

    .bottom-nav a.active {
      color:var(--primary);
      background:var(--surface-2);
    }

    [data-theme="dark"] .bottom-nav {
      background:rgba(32,44,50,.94);
    }

    .bulk-bar {
      position:fixed;
      z-index:35;
      bottom:calc(78px + env(safe-area-inset-bottom));
      left:50%;
      transform:translateX(-50%);
      width:min(730px,94%);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background:var(--primary-dark);
      color:#fff;
      border-radius:18px;
      padding:10px 12px;
      box-shadow:0 14px 34px rgba(18,59,99,.3);
    }

    .bulk-bar span {
      font-size:.82rem;
      font-weight:750;
      white-space:nowrap;
      flex:0 0 auto;
    }

    .bulk-actions {
      display:flex;
      gap:6px;
      overflow-x:auto;
    }

    .bulk-btn {
      min-height:40px;
      border:1px solid rgba(255,255,255,.28);
      background:rgba(255,255,255,.12);
      color:#fff;
      border-radius:12px;
      padding:0 12px;
      font-size:.78rem;
      font-weight:750;
      white-space:nowrap;
    }

    .bulk-btn.danger {
      background:var(--danger);
      border-color:var(--danger);
    }

    .overlay {
      position:fixed;
      inset:0;
      z-index:100;
      background:rgba(10,25,35,.58);
      display:flex;
      align-items:flex-end;
      justify-content:center;
    }

    .sheet {
      width:min(760px,100%);
      background:var(--surface);
      border-radius:26px 26px 0 0;
      padding:22px 18px max(22px,env(safe-area-inset-bottom));
      max-height:88dvh;
      overflow:auto;
    }

    .handle {
      width:42px;
      height:5px;
      background:var(--line);
      border-radius:9px;
      margin:-8px auto 14px;
    }

    .sheet h2 {
      margin:0 0 6px;
    }

    .sheet p {
      color:var(--muted);
      margin:0 0 16px;
    }

    .field {
      display:grid;
      gap:6px;
      margin:12px 0;
    }

    .field label {
      font-size:.82rem;
      font-weight:700;
    }

    .field input,
    .field select {
      width:100%;
      min-height:48px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--surface);
      color:var(--text);
      padding:0 12px;
    }

    .sheet-actions {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:16px;
    }

    .secondary-btn {
      min-height:48px;
      border:1px solid var(--line);
      background:var(--surface-2);
      color:var(--text);
      border-radius:14px;
      font-weight:750;
    }

    .danger-btn {
      background:var(--danger);
      color:#fff;
      border:0;
    }

    .login-card {
      text-align:center;
    }

    .google-btn {
      width:100%;
      min-height:50px;
      border:1px solid var(--line);
      border-radius:15px;
      background:var(--surface);
      color:var(--text);
      font-weight:800;
    }

    .toast {
      position:fixed;
      z-index:200;
      bottom:calc(88px + env(safe-area-inset-bottom));
      left:50%;
      transform:translate(-50%,16px);
      background:#172a35;
      color:#fff;
      padding:10px 16px;
      border-radius:999px;
      opacity:0;
      pointer-events:none;
      transition:.2s;
      max-width:90%;
      text-align:center;
    }

    .toast.show {
      opacity:1;
      transform:translate(-50%,0);
    }

    @media (min-width:700px) {
      body {
        padding-top:18px;
      }

      .shell {
        padding-inline:20px;
      }

      .bottom-nav {
        border:1px solid var(--line);
        border-bottom:0;
        border-radius:20px 20px 0 0;
      }

      .overlay {
        align-items:center;
        padding:20px;
      }

      .sheet {
        border-radius:26px;
        max-width:520px;
      }
    }
  </style>
</head>

<body>
  <main class="shell" id="app">
    <header class="page-head">
      <a class="icon-btn" id="homeTop" href="index.html" aria-label="בית">⌂</a>

      <div class="page-head-info">
        <div class="page-head-dest" id="destination">הטיול שלנו</div>
        <h1 id="pageTitle">רשימת ציוד 🎒</h1>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" aria-label="מצב תצוגה">🌙</button>
        <button class="icon-btn" id="logoutBtn" aria-label="יציאה">↪</button>
      </div>
    </header>

    <div class="identity-row">
      <select id="participantSelect">
        <option value="">בחר/י את שמך…</option>
      </select>

      <span class="user-chip" id="userChip"></span>
    </div>

    <div class="tabs">
      <button class="tab active" id="mineTab">הציוד שלי</button>
      <button class="tab" id="groupTab">מה הקבוצה אורזת</button>
    </div>

    <section id="mineView">
      <div class="card">
        <div class="add-row">
          <input id="newItem" maxlength="100" placeholder="מה צריך לארוז?">
          <button class="primary-btn" id="addBtn">הוסף</button>
        </div>

        <div class="quick-picks-label hidden" id="quickPicksLabel">מה עוד חסר לך?</div>
        <div class="quick-picks" id="quickPicks"></div>
      </div>

      <div class="list-head">
        <h2 id="myListHeading">הרשימה שלי</h2>

        <div class="list-head-actions">
          <select class="list-select" id="listSelect"></select>
          <button class="list-icon-btn" id="selectModeBtn" aria-label="בחירה מרובה" title="בחירה מרובה">☑️</button>
          <button class="list-icon-btn" id="manageListBtn" aria-label="ניהול רשימה" title="ניהול רשימה">⚙️</button>
          <button class="list-icon-btn" id="newListBtn" aria-label="רשימה חדשה" title="רשימה חדשה">➕</button>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-copy">
          <span id="progressLabel">התקדמות</span>
          <strong id="progressText">0/0</strong>
        </div>

        <div class="progress">
          <span id="progressBar" style="width:0"></span>
        </div>
      </div>

      <div class="items" id="items"></div>
    </section>

    <div class="bulk-bar hidden" id="bulkBar">
      <span id="bulkCount">0 נבחרו</span>
      <div class="bulk-actions">
        <button class="bulk-btn" id="bulkMoveBtn">העברה</button>
        <button class="bulk-btn" id="bulkToggleDoneBtn">סימון</button>
        <button class="bulk-btn danger" id="bulkDeleteBtn">מחיקה</button>
        <button class="bulk-btn" id="bulkCancelBtn">ביטול</button>
      </div>
    </div>

    <section id="groupView" class="hidden">
      <div id="groupItems"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="ניווט ראשי">
    <a id="navHome" href="index.html">
      ⌂
      <span>בית</span>
    </a>

    <a class="active" id="navPacking" href="packing.html">
      🎒
      <span>ציוד</span>
    </a>

    <a id="navShopping" data-feature="shopping" href="shopping.html">
      🛒
      <span>קניות</span>
    </a>

    <a id="navPlaces" data-feature="places" href="places.html">
      📍
      <span>מקומות</span>
    </a>

    <a id="navExpenses" data-feature="expenses" href="expenses.html">
      💸
      <span>הוצאות</span>
    </a>
  </nav>

  <div class="overlay" id="loginOverlay">
    <div class="sheet login-card">
      <div class="handle"></div>
      <h2 id="loginTitle">כניסה לטיול</h2>

      <p id="loginText">
        כדי לשמור רשימה אישית יש להתחבר באמצעות Google.
      </p>

      <button class="google-btn" id="googleBtn">
        G&nbsp;&nbsp; כניסה עם Google
      </button>
    </div>
  </div>

  <div class="overlay hidden" id="memberOverlay">
    <div class="sheet">
      <div class="handle"></div>
      <h2 id="memberTitle">מי את/ה בקבוצה?</h2>

      <p id="memberText">
        בחרו את השם שהמארגן הוסיף לטיול.
      </p>

      <div class="field">
        <select id="memberSelect"></select>
      </div>

      <button
        class="primary-btn"
        style="width:100%"
        id="saveMemberBtn">
        זה אני
      </button>
    </div>
  </div>

  <div class="overlay hidden" id="newListOverlay">
    <div class="sheet">
      <div class="handle"></div>
      <h2 id="newListTitle">רשימה חדשה</h2>

      <div class="field">
        <label id="newListNameLabel">שם הרשימה</label>
        <input id="newListName" maxlength="60" placeholder="למשל: מסמכים">
      </div>

      <div class="sheet-actions">
        <button class="secondary-btn" id="cancelNewList">ביטול</button>
        <button class="primary-btn" id="createListBtn">יצירה</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="manageListOverlay">
    <div class="sheet">
      <div class="handle"></div>
      <h2 id="manageListTitle">ניהול רשימה</h2>

      <div class="field">
        <label id="renameListLabel">שם הרשימה</label>
        <input id="renameListName" maxlength="60">
      </div>

      <div class="sheet-actions">
        <button class="secondary-btn" id="cancelManageList">ביטול</button>
        <button class="primary-btn" id="renameListBtn">שמירה</button>
      </div>

      <div class="field">
        <label id="listVisibilityLabel">שיתוף כל הרשימה</label>
        <div class="sheet-actions">
          <button class="secondary-btn" style="flex:1" id="makeListPrivateBtn">🔒 הפוך הכל לפרטי</button>
          <button class="secondary-btn" style="flex:1" id="makeListPublicBtn">🌐 הפוך הכל לגלוי</button>
        </div>
      </div>

      <button class="secondary-btn" style="width:100%;margin-top:8px" id="duplicateListBtn">שכפול הרשימה</button>
      <button class="secondary-btn danger-btn" style="width:100%;margin-top:8px" id="deleteListBtn">מחיקת הרשימה</button>
    </div>
  </div>

  <div class="overlay hidden" id="editOverlay">
    <div class="sheet">
      <div class="handle"></div>
      <h2 id="editTitle">עריכת פריט</h2>

      <div class="field">
        <label id="editNameLabel">שם הפריט</label>
        <input id="editName" maxlength="100">
      </div>

      <div class="field">
        <label id="visibilityLabel">שיתוף עם הקבוצה</label>

        <select id="editVisibility">
          <option value="private">🔒 פרטי</option>
          <option value="public">🌐 גלוי לקבוצה</option>
        </select>
      </div>

      <div class="field">
        <label id="editListLabel">רשימה</label>
        <select id="editListSelect"></select>
      </div>

      <div class="sheet-actions">
        <button class="secondary-btn" id="cancelEdit">ביטול</button>

    function fireConfetti() {
      const canvas = document.createElement("canvas");
      canvas.style.position = "fixed";
      canvas.style.inset = "0";
      canvas.style.zIndex = "60";
      canvas.style.pointerEvents = "none";
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      document.body.appendChild(canvas);

      const ctx = canvas.getContext("2d");
      const colors = ["#123B63", "#1F7A8C", "#F2B84B", "#E76F51", "#2F8B68"];

      const pieces = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.4,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        speedY: 2 + Math.random() * 3,
        speedX: -1.5 + Math.random() * 3,
        rotation: Math.random() * 360,
        rotationSpeed: -8 + Math.random() * 16
      }));

      const start = Date.now();
      const duration = 2600;

      function frame() {
        const elapsed = Date.now() - start;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        pieces.forEach(piece => {
          piece.x += piece.speedX;
          piece.y += piece.speedY;
          piece.rotation += piece.rotationSpeed;

          ctx.save();
          ctx.translate(piece.x, piece.y);
          ctx.rotate((piece.rotation * Math.PI) / 180);
          ctx.fillStyle = piece.color;
          ctx.fillRect(-piece.size / 2, -piece.size / 4, piece.size, piece.size / 2);
          ctx.restore();
        });

        if (elapsed < duration) {
          requestAnimationFrame(frame);
        } else {
          canvas.remove();
        }
      }

      requestAnimationFrame(frame);
      toast(tr("🎉 סיימתם לארוז!", "🎉 Packing complete!"));
    }

    function renderQuickPicks() {

      const existingNames = new Set(

          .map(item => (item.name || "").trim().toLowerCase())

      const suggestions =

      $("quickPicksLabel").classList.toggle(
        "hidden",

      $("quickPicks").innerHTML =

            return (
              `<button class="pick" ` +
              `data-pick="${escapeHtml(item)}">` +
              `+ ${escapeHtml(item)}` +

          .join("");

        .querySelectorAll("[data-pick]")
        .forEach(button => {

    function escapeHtml(value = "") {
      return String(value).replace(
        /[&<>"']/g,
        character => ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        })[character]
      );
    }

    function participantKey(name) {
      const bytes =
        new TextEncoder().encode(
          String(name).trim()
        );

      let raw = "";

      bytes.forEach(byte => {
        raw += String.fromCharCode(byte);
      });

      return btoa(raw)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    function participantOptions() {
      const names =
        Array.isArray(trip.participants)
          ? trip.participants

      const claims =
        trip.participantClaims || {};

      const options =
        `<option value="">` +
        `${tr("בחר/י את שמך…", "Choose your name…")}` +
        `</option>` +
        names.map((name, index) => {
          const key = participantKey(name);

          const isTaken =
            claims[key] &&
            claims[key] !== user?.uid;

          return (
            `<option value="${index}" ` +
            `${isTaken ? "disabled" : ""}>` +
            `${escapeHtml(name)}` +
            `${isTaken
              ? ` — ${tr("כבר משויך", "already linked")}`
              : ""}` +
            `</option>`
          );
        }).join("");

      $("participantSelect").innerHTML = options;
      $("memberSelect").innerHTML = options;

      if (profile) {
        const index =
          names.indexOf(profile.name);

        if (index >= 0) {
          $("participantSelect").value =
            String(index);

            String(index);

        $("participantSelect").disabled = true;

    async function saveProfile(index) {
      if (!user || profile) {
        return;
      }

      const name =
        (trip.participants || [])[Number(index)];

      if (!name) {
        return toast(
          tr("יש לבחור שם", "Choose a name")
        );
      }

      const key = participantKey(name);

      const claimReference = ref(
        db,
        `${tripRoot}/participantClaims/${key}`
      );

      try {
        const result = await runTransaction(
          claimReference,
          current =>
            current === null ||
            current === user.uid
              ? user.uid
              : undefined,
          {
            applyLocally:false
          }
        );

        if (
          !result.committed ||
          result.snapshot.val() !== user.uid
        ) {
          return toast(
            tr(
              "השם הזה כבר שויך למשתתף אחר",
              "This name is already linked to another participant"
            )
          );
        }

        const nextProfile = {
          name,
          participantKey:key,
          email:user.email || "",
          photoURL:user.photoURL || "",
          updatedAt:Date.now()
        };

        try {
          await set(
            ref(
              db,
              `${tripRoot}/memberProfiles/${user.uid}`
            ),
            nextProfile
          );
        } catch (error) {
          await runTransaction(
            claimReference,
            current =>
              current === user.uid
                ? null
                : current,
            {
              applyLocally:false
            }
          );

          throw error;
        }

        profile = nextProfile;

        $("memberOverlay")
          .classList
          .add("hidden");

        syncIdentity();
        listenPacking();
      } catch (error) {
        console.error(error);

        toast(
          tr(
            "לא ניתן היה לשייך את השם. נסו שוב.",
            "Could not link the name. Please try again."
          )
        );
      }
    }

    function syncIdentity() {
      $("userChip").textContent =
        profile
          ? `${profile.name} · ${user?.email || ""}`
          : user?.email || "";

      participantOptions();

      $("memberOverlay").classList.toggle(
        "hidden",
        !(user && !profile)
      );
    }

    function userBase() {
      return `${tripRoot}/packing/users/${user.uid}`;
    }

    function currentItems() {
      return items?.[activeList] || {};
    }

    function allListIds() {
      const metadata =
        allPacking?.users?.[user?.uid]?.listMeta || {};

      return [...new Set([
        "main",
        ...Object.keys(items || {}),
        ...Object.keys(metadata)
      ])];
    }

    function listLabel(id) {
      const metadata =
        allPacking?.users?.[user?.uid]?.listMeta || {};

      const defaultName =
        id === "main"
          ? tr("רשימה ראשית", "Main list")
          : id;

      return metadata[id]?.name || defaultName;
    }

    function renderLists() {
      const ids = allListIds();

      $("listSelect").innerHTML =
        ids
          .map(id =>
            `<option value="${escapeHtml(id)}">` +
            `${escapeHtml(listLabel(id))}</option>`
          )
          .join("");

      if (!ids.includes(activeList)) {
        activeList = "main";
      }

      $("listSelect").value = activeList;
    }

    function renderMine() {
      renderLists();
      renderQuickPicks();

      const map = currentItems();

      const entries =
        Object.entries(map)
          .map(([id, item]) => ({
            id,
            ...item
          }))
          .sort((first, second) =>
            (first.isDone - second.isDone) ||
            (first.createdAt - second.createdAt)
          );

      const completed =
        entries.filter(item => item.isDone).length;

      const percentage =
        entries.length
          ? Math.round(
              completed / entries.length * 100
            )
          : 0;

      $("progressText").textContent =
        `${completed}/${entries.length} · ${percentage}%`;

      $("progressBar").style.width =
        `${percentage}%`;

      if (entries.length && percentage === 100) {
        if (!celebratedLists.has(activeList)) {
          celebratedLists.add(activeList);
          fireConfetti();
        }
      } else {
        celebratedLists.delete(activeList);
      }

      $("items").innerHTML =
        entries.length
          ? entries.map(item => `
              <article class="item ${item.isDone ? "done" : ""} ${selectionMode ? "selection-mode" : ""} ${selectedIds.has(item.id) ? "selected" : ""}">
                ${selectionMode ? `
                  <input
                    class="select-check"
                    type="checkbox"
                    data-select="${item.id}"
                    ${selectedIds.has(item.id) ? "checked" : ""}
                    aria-label="${tr("בחירה", "Select")}">
                ` : ""}

                <input
                  class="check"
                  type="checkbox"
                  data-check="${item.id}"
                  ${item.isDone ? "checked" : ""}>

                <div>
                  <div class="item-name">
                    ${escapeHtml(item.name)}
                  </div>

                  <div class="meta">
                    ${item.isPublic
                      ? tr("גלוי לקבוצה", "Visible to group")
                      : tr("פרטי", "Private")}
                    ${item.importedFrom
                      ? ` · ${tr("יובא מ ", "Imported from ")}${escapeHtml(item.importedFrom)}`
                      : ""}
                  </div>
                </div>

                <div class="item-actions">
                  <button
                    class="mini visibility-toggle"
                    data-toggle-visibility="${item.id}"
                    aria-label="${item.isPublic
                      ? tr("הפוך לפרטי", "Make private")
                      : tr("שתף עם הקבוצה", "Share with group")}">
                    ${item.isPublic ? "🌐" : "🔒"}
                  </button>

                  <button
                    class="mini"
                    data-edit="${item.id}"
                    aria-label="${tr("אפשרויות", "Options")}">
                    •••
                  </button>
                </div>
              </article>
            `).join("")
          : `
              <div class="empty">
                <span class="emoji">🎒</span>
                ${tr(
                  "הרשימה עדיין ריקה. הוסיפו את הפריט הראשון.",
                  "Your list is empty. Add the first item."
                )}
              </div>
            `;

      document
        .querySelectorAll("[data-check]")
        .forEach(checkbox => {
          checkbox.onchange = () => {
            update(
              ref(
                db,
                `${userBase()}/items/${activeList}/${checkbox.dataset.check}`
              ),
              {
                isDone:checkbox.checked
              }
            );
          };
        });

      document
        .querySelectorAll("[data-edit]")
        .forEach(button => {
          button.onclick = () => {
            openEdit(button.dataset.edit);
          };
        });

      document
        .querySelectorAll("[data-toggle-visibility]")
        .forEach(button => {
          button.onclick = () => {
            const id = button.dataset.toggleVisibility;
            const item = currentItems()[id];

            if (!item) {
              return;
            }

            update(
              ref(
                db,
                `${userBase()}/items/${activeList}/${id}`
              ),
              { isPublic: !item.isPublic }
            );
          };
        });

      document
        .querySelectorAll("[data-select]")
        .forEach(checkbox => {
          checkbox.onchange = () => {
            const id = checkbox.dataset.select;

            if (checkbox.checked) {
              selectedIds.add(id);
            } else {
              selectedIds.delete(id);
            }

            renderMine();
          };
        });

      updateBulkBar();
    }

    function updateBulkBar() {
      const bar = $("bulkBar");

      if (selectionMode && selectedIds.size > 0) {
        bar.classList.remove("hidden");

        $("bulkCount").textContent =
          tr(
            `${selectedIds.size} נבחרו`,
            `${selectedIds.size} selected`
          );
      } else {
        bar.classList.add("hidden");
      }
    }

    function setSelectionMode(next) {
      selectionMode = next;

      if (!next) {
        selectedIds = new Set();
      }

      $("selectModeBtn").classList.toggle("active", selectionMode);
      renderMine();
    }

    async function bulkDelete() {
      if (!selectedIds.size) {
        return;
      }

      if (
        !confirm(
          tr(
            `למחוק ${selectedIds.size} פריטים?`,
            `Delete ${selectedIds.size} items?`
          )
        )
      ) {
        return;
      }

      const updates = {};

      selectedIds.forEach(id => {
        updates[`${userBase()}/items/${activeList}/${id}`] = null;
      });

      await update(ref(db), updates);
      setSelectionMode(false);
      toast(tr("הפריטים נמחקו", "Items deleted"));
    }

    async function bulkToggleDone() {
      if (!selectedIds.size) {
        return;
      }

      const map = currentItems();

      const allDone =
        [...selectedIds].every(id => map[id]?.isDone);

      const updates = {};

      selectedIds.forEach(id => {
        updates[`${userBase()}/items/${activeList}/${id}/isDone`] = !allDone;
      });

      await update(ref(db), updates);
      setSelectionMode(false);
    }

    function openBulkMove() {
      if (!selectedIds.size) {
        return;
      }

      $("bulkMoveTarget").innerHTML =
        allListIds()
          .filter(id => id !== activeList)
          .map(id =>
            `<option value="${escapeHtml(id)}">` +
            `${escapeHtml(listLabel(id))}</option>`
          )
          .join("");

      if (!$("bulkMoveTarget").options.length) {
        return toast(
          tr(
            "אין רשימה אחרת להעביר אליה",
            "There's no other list to move to"
          )
        );
      }

      $("bulkMoveOverlay").classList.remove("hidden");
    }

    async function confirmBulkMove() {
      const targetList = $("bulkMoveTarget").value;

      if (!targetList || !selectedIds.size) {
        return;
      }

      const map = currentItems();
      const updates = {};

      selectedIds.forEach(id => {
        if (!map[id]) {
          return;
        }

        updates[`${userBase()}/items/${activeList}/${id}`] = null;
        updates[`${userBase()}/items/${targetList}/${id}`] = map[id];
      });

      await update(ref(db), updates);
      $("bulkMoveOverlay").classList.add("hidden");
      setSelectionMode(false);
      toast(tr("הפריטים הועברו", "Items moved"));
    }

    function renderGroup() {
      const users =
        allPacking?.users || {};

      const blocks = [];

      Object.entries(users)
        .forEach(([uid, data]) => {
          const publicItems = [];

          Object.entries(data.items || {})
            .forEach(([listId, list]) => {
              Object.entries(list || {})
                .forEach(([itemId, item]) => {
                  if (item.isPublic) {
                    publicItems.push({ uid, listId, itemId, ...item });
                  }
                });
            });

          if (!publicItems.length) {
            return;
          }

          const member =
            trip.memberProfiles?.[uid]?.name ||
            publicItems[0]?.ownerName ||
            tr("משתתף", "Traveler");

          const isMe = uid === user?.uid;

          blocks.push(`
            <section class="card group-block">
              <h3 class="group-title">
                ${escapeHtml(member)}
              </h3>

              <div class="items">
                ${publicItems.map(item => `
                  <div class="item ${item.isDone ? "done" : ""}">
                    <span>${item.isDone ? "✅" : "◻️"}</span>
                    <div class="item-name">
                      ${escapeHtml(item.name)}
                    </div>
                    ${isMe ? "<span></span>" : `
                      <button
                        class="mini"
                        data-import="${item.uid}:${item.listId}:${item.itemId}"
                        aria-label="${tr("ייבוא לרשימה שלי", "Import to my list")}">
                        ⬇️
                      </button>
                    `}
                  </div>
                `).join("")}
              </div>
            </section>
          `);
        });

      $("groupItems").innerHTML =
        blocks.join("") ||
        `
          <div class="card empty">
            <span class="emoji">👥</span>
            ${tr(
              "עדיין לא שותפו פריטים עם הקבוצה.",
              "No items have been shared with the group yet."
            )}
          </div>
        `;

      document
        .querySelectorAll("[data-import]")
        .forEach(button => {
          button.onclick = () => {
            importItem(button.dataset.import);
          };
        });
    }

    async function importItem(key) {
      const [sourceUid, sourceListId, sourceItemId] = key.split(":");

      const sourceItem =
        allPacking?.users?.[sourceUid]?.items?.[sourceListId]?.[sourceItemId];

      if (!sourceItem || !profile) {
        return;
      }

      const memberName =
        trip.memberProfiles?.[sourceUid]?.name ||
        sourceItem.ownerName ||
        tr("חבר/ה לקבוצה", "a group member");

      await push(
        ref(db, `${userBase()}/items/${activeList}`),
        {
          name: sourceItem.name,
          isDone: false,
          isPublic: false,
          importedFrom: memberName,
          ownerName: profile.name,
          createdByUid: user.uid,
          createdAt: Date.now()
        }
      );

      toast(
        tr(
          `הפריט יובא לרשימה "${listLabel(activeList)}"`,
          `Item imported to "${listLabel(activeList)}"`
        )
      );
    }

    function render() {
      renderMine();
      renderGroup();
    }

    function listenPacking() {
      if (
        !user ||
        !tripRoot ||
        packingListening
      ) {
        return;
      }

      packingListening = true;
      let starterCheckDone = false;

      onValue(
        ref(db, `${tripRoot}/packing`),
        async snapshot => {
          allPacking = snapshot.val() || {};

          items =
            allPacking.users?.[user.uid]?.items || {};

          if (!starterCheckDone) {
            starterCheckDone = true;
            await ensureStarterLists();
          }

          render();
        }
      );
    }

    async function addItem(value) {
      const name =
        (value || $("newItem").value).trim();

      if (
        !name ||
        !user ||
        !profile
      ) {
        return;
      }

      const alreadyExists =
        Object.values(currentItems())
          .some(item =>
            item.name
              ?.trim()
              .toLocaleLowerCase() ===
            name.toLocaleLowerCase()
          );

      if (alreadyExists) {
        return toast(
          tr(
            "הפריט כבר קיים ברשימה",
            "Item already exists"
          )
        );
      }

      await push(
        ref(
          db,
          `${userBase()}/items/${activeList}`
        ),
        {
          name,
          isDone:false,
          isPublic:false,
          ownerName:profile.name,
          createdAt:Date.now(),
          createdByUid:user.uid
        }
      );

      $("newItem").value = "";

      toast(
        tr("הפריט נוסף", "Item added")
      );
    }

    function openEdit(id) {
      const item = currentItems()[id];

      if (!item) {
        return;
      }

      editingId = id;
      $("editName").value = item.name || "";

      $("editVisibility").value =
        item.isPublic
          ? "public"
          : "private";

      $("editListSelect").innerHTML =
        allListIds()
          .map(listId =>
            `<option value="${escapeHtml(listId)}">` +
            `${escapeHtml(listLabel(listId))}</option>`
          )
          .join("");

      $("editListSelect").value = activeList;

      $("editOverlay")
        .classList
        .remove("hidden");
    }

    async function saveEdit() {
      if (!editingId) {
        return;
      }

      const name =
        $("editName").value.trim();

      if (!name) {
        return;
      }

      const targetList = $("editListSelect").value;
      const sourceList = activeList;
      const fields = {
        name,
        isPublic:
          $("editVisibility").value === "public"
      };

      if (targetList && targetList !== sourceList) {
        const existingItem = currentItems()[editingId];

        await update(ref(db), {
          [`${userBase()}/items/${sourceList}/${editingId}`]: null,
          [`${userBase()}/items/${targetList}/${editingId}`]: {
            ...existingItem,
            ...fields
          }
        });

        activeList = targetList;
        toast(tr("הפריט הועבר", "Item moved"));
      } else {
        await update(
          ref(
            db,
            `${userBase()}/items/${sourceList}/${editingId}`
          ),
          fields
        );
      }

      $("editOverlay")
        .classList
        .add("hidden");

      editingId = null;
    }

    function loadTrip() {
      if (!tripRoot) {
        $("loginOverlay")
          .classList
          .add("hidden");

        toast("Missing tripId");
        return;
      }

      if (stopTrip) {
        stopTrip();
      }

      stopTrip = onValue(
        ref(db, tripRoot),
        snapshot => {
          if (!snapshot.exists()) {
            toast(
              tr(
                "הטיול לא נמצא",
                "Trip not found"
              )
            );

            return;
          }

          trip = snapshot.val();

          applyTheme();
          applyLanguage();
          configureLinks();
          participantOptions();

          if (user) {
            loadProfile();
          }
        },
        () => {
          stopTrip = null;

          toast(
            tr(
              "לא ניתן לטעון את הטיול",
              "Could not load the trip"
            )
          );
        }
      );
    }

    async function loadProfile() {
      const snapshot = await get(
        ref(
          db,
          `${tripRoot}/memberProfiles/${user.uid}`
        )
      );

      profile = snapshot.val();

      syncIdentity();

      if (profile) {
        listenPacking();
      }
    }

    $("googleBtn").onclick = doGoogleSignIn;

    $("logoutBtn").onclick = () => {
      signOut(auth);
    };

    $("themeBtn").onclick = () => {
      const isDark =
        document.documentElement.dataset.theme === "dark";

      localStorage.setItem(
        themeKey,
        isDark ? "light" : "dark"
      );

      applyTheme();
    };

    $("saveMemberBtn").onclick = () => {
      saveProfile(
        $("memberSelect").value
      );
    };

    $("participantSelect").onchange = event => {
      saveProfile(event.target.value);
    };

    $("addBtn").onclick = () => {
      addItem();
    };

    $("newItem").onkeydown = event => {
      if (event.key === "Enter") {
        addItem();
      }
    };

    $("listSelect").onchange = event => {
      activeList = event.target.value;
      renderMine();
    };

    $("newListBtn").onclick = () => {
      $("newListName").value = "";
      $("newListOverlay").classList.remove("hidden");
    };

    $("cancelNewList").onclick = () => {
      $("newListOverlay").classList.add("hidden");
    };

    $("createListBtn").onclick = () => {
      createList($("newListName").value);
    };

    $("newListName").onkeydown = event => {
      if (event.key === "Enter") {
        createList($("newListName").value);
      }
    };

    $("manageListBtn").onclick = openManageList;

    $("cancelManageList").onclick = () => {
      $("manageListOverlay").classList.add("hidden");
    };

    $("renameListBtn").onclick = renameList;

    $("deleteListBtn").onclick = deleteList;

    $("duplicateListBtn").onclick = duplicateList;

    $("makeListPrivateBtn").onclick = () => setListVisibility(false);
    $("makeListPublicBtn").onclick = () => setListVisibility(true);

    $("selectModeBtn").onclick = () => {
      setSelectionMode(!selectionMode);
    };

    $("bulkCancelBtn").onclick = () => {
      setSelectionMode(false);
    };

    $("bulkDeleteBtn").onclick = bulkDelete;

    $("bulkToggleDoneBtn").onclick = bulkToggleDone;

    $("bulkMoveBtn").onclick = openBulkMove;

    $("cancelBulkMove").onclick = () => {
      $("bulkMoveOverlay").classList.add("hidden");
    };

    $("confirmBulkMove").onclick = confirmBulkMove;

    $("mineTab").onclick = () => {
      $("mineTab").classList.add("active");
      $("groupTab").classList.remove("active");
      $("mineView").classList.remove("hidden");
      $("groupView").classList.add("hidden");
    };

    $("groupTab").onclick = () => {
      $("groupTab").classList.add("active");
      $("mineTab").classList.remove("active");
      $("groupView").classList.remove("hidden");
      $("mineView").classList.add("hidden");
      renderGroup();
    };

    $("cancelEdit").onclick = () => {
      $("editOverlay")
        .classList
        .add("hidden");

      editingId = null;
    };

    $("saveEdit").onclick = saveEdit;

    $("deleteItem").onclick = async () => {
      if (!editingId) {
        return;
      }

      if (
        confirm(
          tr(
            "למחוק את הפריט?",
            "Delete this item?"
          )
        )
      ) {
        await remove(
          ref(
            db,
            `${userBase()}/items/${activeList}/${editingId}`
          )
        );

        $("editOverlay")
          .classList
          .add("hidden");

        editingId = null;
      }
    };

    onAuthStateChanged(auth, authenticatedUser => {
      user = authenticatedUser;

      $("loginOverlay").classList.toggle(
        "hidden",
        Boolean(authenticatedUser)
      );

      if (authenticatedUser) {
        $("userChip").textContent =
          authenticatedUser.email ||
          authenticatedUser.displayName ||
          "";

        loadTrip();
      } else {
        profile = null;
        items = {};
        packingListening = false;

        if (stopTrip) {
          stopTrip();
          stopTrip = null;
        }

        $("memberOverlay")
          .classList
          .add("hidden");
      }
    });
  </script>
</body>
</html>
