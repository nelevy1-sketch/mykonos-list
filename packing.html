<!doctype html>
<!-- GitTrip - version tracked in version.js -->
<html lang="he" dir="rtl" data-tokens="core">
<head>
<script>
(function() {
  var tripId = new URLSearchParams(location.search).get('tripId') || 'legacy';
  var cachedType = localStorage.getItem('trip-' + tripId + '-type') || 'abroad';
  var savedTheme = localStorage.getItem('trip-' + tripId + '-theme');

  var cachedName = localStorage.getItem('trip-' + tripId + '-name');

  // Called by a tiny inline script right after the header markup, so the real
  // trip name is already in the DOM at first paint instead of the placeholder.
  window.showTripName = function (elementId) {
    var el = cachedName && document.getElementById(elementId);
    if (el) el.textContent = cachedName;
  };
  var shouldStartDark =
    savedTheme === 'dark'
      ? true
      : savedTheme === 'light'
        ? false
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

  document.documentElement.classList.add('theme-' + cachedType);

  if (shouldStartDark) {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>

  <style>
    /* design tokens, dark mode, bottom nav, sheets and dialogs live in shared.css

       shared defaults, so it overrides the layout knobs below. */

      --nav-label-size:.67rem;

    }

    .shell {

      flex-direction:column;
      overflow:hidden;

    }

    .page-head,
    .identity-row,
    .tabs {

    }

    #mineView {
      display:flex;
      flex-direction:column;
      flex:1;
      min-height:0;
      overflow:hidden;
    }

    #mineView > .list-head,
    #mineView > .progress-wrap {
      flex-shrink:0;
    }

    #mineView > .items {
      flex:1;
      min-height:0;
      overflow-y:auto;
      padding-bottom:calc(160px + env(safe-area-inset-bottom));
    }

    #groupView {
      flex:1;
      min-height:0;
      overflow-y:auto;
      padding-bottom:calc(160px + env(safe-area-inset-bottom));
    }

    .top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }

    .top-actions {

      gap:8px;
    }

    .icon-btn {
      width:44px;
      height:44px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--surface);
      color:var(--text);
      display:grid;
      place-items:center;
      text-decoration:none;

    }

    .page-head {

    }

    .page-head-info {

    .page-head h1 {

    .category-suggest button {

    }

    [data-theme="dark"] .category-suggest button {
      box-shadow:0 0 10px color-mix(in srgb, var(--glow-color) 45%, transparent);
    }

    /* No -webkit-overflow-scrolling: touch here on purpose - it's a legacy
       pre-iOS-13 property iOS Safari has ignored for years now (momentum
       scrolling on overflow:auto is automatic since then). Don't add it
       back just because it's "missing" - it wouldn't change anything on
       any device this app still needs to support. */
    .quick-picks {
      display:flex;
      gap:7px;
      overflow:auto;
      padding-block:10px 2px;
      padding-inline:2px 14px;
      scrollbar-width:none;
    }

    /* Content-fade at the trailing edge, not a decoration - toggled by JS
       (.has-more) only while there's actually more to scroll to, so a short
       list that already fits shows no fade at all. mask-image, not an
       overlay element, so a partially-visible last pick fades smoothly
       instead of being hard-clipped by the container's own edge - itself a
       cue that there's more. RTL vs LTR isn't a mirror-image tweak: the
       "far" edge - where hidden content actually is - is physically the
       LEFT in Hebrew and the RIGHT in English, so the two need opposite
       gradient directions, not the same one flipped by the browser. -webkit-
       prefix required - unprefixed mask-image alone isn't enough on Safari. */
    [dir="rtl"] .quick-picks.has-more {
      -webkit-mask-image: linear-gradient(to left, black calc(100% - 24px), transparent 100%);
      mask-image: linear-gradient(to left, black calc(100% - 24px), transparent 100%);
    }

    [dir="ltr"] .quick-picks.has-more {
      -webkit-mask-image: linear-gradient(to right, black calc(100% - 24px), transparent 100%);
      mask-image: linear-gradient(to right, black calc(100% - 24px), transparent 100%);
    }

    .quick-picks-end-spacer {
      flex:0 0 12px;
    }

    /* Desktop only. A mouse has no touch gesture, and the scrollbar above
       is hidden by default - with neither, there was literally no way to
       reach a scrolled-off item, not just an undiscoverable one (verified:
       plain wheel scroll does nothing here, and this container has no
       tabindex so keyboard can't reach it either). Deliberately NOT wheel-
       to-horizontal JS: that hijacks the page's normal vertical scroll the
       moment the pointer happens to be over this strip, which feels broken
       even when it's intentional. pointer:fine is the right signal, not a
       width breakpoint - a touch tablet in a wide window shouldn't get
       this, a narrow mouse-driven one should. Thin and on-brand (var(--line)
       already adapts per trip-type theme and dark mode) rather than the OS
       default, and padding-block-end drops to 0 so the reserved scrollbar
       height doesn't add as much extra vertical space on top of it. */
    @media (hover: hover) and (pointer: fine) {
      .quick-picks {
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
        padding-block-end: 0;
      }

      .quick-picks::-webkit-scrollbar {
        display: block;
        height: 5px;
      }

      .quick-picks::-webkit-scrollbar-track {
        background: transparent;
      }

      .quick-picks::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 999px;
      }
    }

    .ai-suggest-btn {
      width:100%;
      min-height:46px;
      margin-top:12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:linear-gradient(135deg,var(--surface-2),var(--surface));
      color:var(--primary-dark);
      font-weight:800;
      font-size:.9rem;
    }

    .ai-suggest-btn:disabled {
      opacity:.6;
    }

    .ai-suggestions {
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-top:10px;
    }

    .ai-suggestions .pick {
      border-color:var(--accent);
    }

    .quick-picks::-webkit-scrollbar {
      display:none;
    }

    .pick {
      border:1px solid var(--line);
      background:var(--surface-2);
      color:var(--text);
      border-radius:999px;
      padding:7px 11px;
      white-space:nowrap;
      font-size:.8rem;
      flex-shrink:0;
    }

    .list-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:0 2px 9px;
    }

    .progress-count {
      flex:0 0 auto;
      font-size:.78rem;
      font-weight:700;
      color:var(--muted);
    }

    /* Same scroll mechanics as .quick-picks (fade mask, thin desktop-only
       scrollbar, trailing spacer instead of padding alone - see that
       block's comments for why each exists), but the interaction model is
       .day-tab's (itinerary.html), not .pick's: single persistent
       selection, not one-shot action buttons.
       Its own full-width row below .list-head, not a flex item competing
       with the icon buttons for space - that's what made the fade
       imperceptible on mobile (confirmed: only ~137px of 375px was left
       for it once squeezed next to 3 buttons, showing barely two and a
       half chips). The fade/scroll mechanics themselves needed no changes
       for this - they were already relative to the container's own width,
       same as .quick-picks always was. */
    .category-chips {
      display:flex;
      gap:7px;
      overflow:auto;
      margin:0 2px 9px;
      padding-block:10px 2px;
      padding-inline:2px 14px;
      scrollbar-width:none;
    }

    [dir="rtl"] .category-chips.has-more {
      -webkit-mask-image: linear-gradient(to left, black calc(100% - 24px), transparent 100%);
      mask-image: linear-gradient(to left, black calc(100% - 24px), transparent 100%);
    }

    [dir="ltr"] .category-chips.has-more {
      -webkit-mask-image: linear-gradient(to right, black calc(100% - 24px), transparent 100%);
      mask-image: linear-gradient(to right, black calc(100% - 24px), transparent 100%);
    }

    .category-chips-end-spacer {
      flex:0 0 12px;
    }

    @media (hover: hover) and (pointer: fine) {
      .category-chips {
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
        padding-block-end: 0;
      }

      .category-chips::-webkit-scrollbar {
        display: block;
        height: 5px;
      }

      .category-chips::-webkit-scrollbar-track {
        background: transparent;
      }

      .category-chips::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 999px;
      }
    }

    .category-chips::-webkit-scrollbar {
      display:none;
    }

    .chip {
      border:1px solid var(--line);
      background:var(--surface-2);
      color:var(--text);
      border-radius:999px;
      padding:7px 11px;
      white-space:nowrap;
      font-size:.8rem;
      font-weight:700;
      flex-shrink:0;
    }

    .chip.active {
      background:var(--primary);
      border-color:var(--primary);
      color:#fff;
    }

    [data-theme="dark"] .chip.active {
      box-shadow:0 0 10px color-mix(in srgb, var(--glow-color) 45%, transparent);
    }

    /* Just the 3 icon buttons now (chips moved to their own row below) -
       sized to its own content, not stretched to fill .list-head. */
    .list-head-actions {
      display:flex;
      gap:6px;
      align-items:center;
      flex:0 0 auto;
    }

    .list-icon-btn {
      width:42px;
      height:42px;
      border:1px solid var(--line);
      border-radius:13px;
      background:var(--surface);
      color:var(--text);
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }

    /* docs/schema-legs.md §5.1, step 6 - the destination filter. A select,
       not a second chip strip: legs are capped at 6 and typically 2-4,
       nothing like categories' unbounded/user-created list, and this row
       already exists (list-head) - reusing it costs zero new vertical
       space, unlike a whole second .category-chips-style row would.
       Matches this file's own established convention for "choose one from
       a short list, as a form input" (addItemCategorySelect,
       importCategorySelect, editListSelect all do this already) rather
       than inventing custom popover chrome. Sized
       like .list-icon-btn (same 42px height) but content-width up to a
       cap, not a fixed square - "כל היעדים"/a long destination name is
       naturally wider than an icon glyph. */
    .leg-filter-select {
      flex:0 0 auto;
      height:42px;
      max-width:96px;
      padding:0 8px;
      border:1px solid var(--line);
      border-radius:13px;
      background:var(--surface);
      color:var(--text);
      font-size:.74rem;
      font-weight:700;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    /* docs/schema-legs.md §5.1's "visual indication" requirement for
       auto-tagging a new item with the active leg filter - a one-line
       hint in the add-item sheet, not a new UI pattern (same small-muted-
       text role .quick-picks-label already plays for a different hint in
       this same sheet). */
    .leg-tag-hint {
      font-size:.72rem;
      color:var(--muted);
      margin:-6px 0 10px;
    }

    .progress-wrap {
      margin-bottom:11px;
    }

    .progress {
      height:8px;
      background:var(--surface-2);
      border-radius:999px;
      overflow:hidden;
    }

    .progress > span {
      display:block;
      height:100%;
      background:linear-gradient(90deg,var(--primary),var(--success));
      border-radius:inherit;
      transition:width .25s;
    }

    .items {
      display:grid;
      grid-auto-rows:max-content;
      gap:8px;
      align-content:start;
    }

    .item {
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:10px;
      min-height:44px;
      border:1px solid var(--line);
      border-radius:16px;
      padding:9px 10px;
      background:var(--surface);
    }

    .item.selected {
      border-color:var(--primary);
      background:color-mix(in srgb, var(--primary) 7%, var(--surface));
    }

    .select-check {
      width:24px;
      height:24px;
      accent-color:var(--primary);
    }

    .item.done {

    }

    .item.done .item-name {

    }

    .check {
      width:24px;
      height:24px;
      accent-color:var(--primary);
    }

    .sub-progress {
      min-width:24px;
      height:24px;
      display:grid;
      place-items:center;
      font-size:.68rem;
      font-weight:800;
      color:var(--primary-dark);
      background:var(--surface-2);
      border-radius:8px;
      padding:0 4px;
    }

    .expand-toggle {
      font-size:1.05rem;
      font-weight:700;
      color:var(--text);
    }

    .expand-toggle.expanded {
      color:var(--primary-dark);
      background:color-mix(in srgb, var(--primary) 16%, transparent);
    }

    .sub-panel {
      grid-column:1/-1;
      margin-top:8px;
      padding-top:8px;
      border-top:1px dashed var(--line);
      display:grid;
      gap:6px;
    }

    .sub-item {
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:8px;
      padding-inline-start:4px;
    }

    .sub-name {
      font-size:.86rem;
    }

    .sub-name.sub-done {
      text-decoration:line-through;
      color:var(--muted);
    }

    .sub-add-row {
      display:flex;
      gap:6px;
      margin-top:2px;
    }

    .sub-add-input {
      flex:1;
      min-height:38px;
      border:1px solid var(--line);
      border-radius:11px;
      background:var(--surface);
      color:var(--text);
      padding:0 10px;
      font-size:.84rem;
    }

    .item-info {
      display:flex;
      align-items:baseline;
      gap:6px;
      min-width:0;
    }

    .item-name {
      font-weight:700;
      flex:1 1 auto;
      min-width:30%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .meta {
      flex:0 1 auto;
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:.72rem;
      color:var(--muted);
      white-space:nowrap;
    }

    .item-actions {
      display:flex;
      align-items:center;
      gap:6px;
      margin-block:-9px;
    }

    .mini {
      width:40px;
      height:40px;
      border:0;
      border-radius:12px;
      background:transparent;
      color:var(--muted);
    }

    .empty {
      text-align:center;
      padding:42px 14px;
      color:var(--muted);
    }

    .empty .emoji {
      font-size:2.4rem;
      display:block;
      margin-bottom:8px;
    }

    .empty strong {
      display:block;
      color:var(--text);
      font-size:1rem;
      margin-bottom:4px;
    }

    .empty span {
      display:block;
      font-size:.85rem;
    }

    /* docs/roadmap.md part 3 item 0 (empty-state copy) - a per-category
       empty list is the whole invitation to add the first item, not a
       passive message next to a separate button. Deliberately its own
       class, not a variant of .empty above: .empty stays the
       non-interactive "nothing to point at" case (renderGroup()'s
       shared-items panel), this one is always a real <button>. */
    .empty-action {
      display:block;
      width:100%;
      min-height:44px;
      text-align:center;
      padding:32px 14px;
      color:var(--muted);
      background:transparent;
      border:1.5px dashed var(--line);
      border-radius:var(--radius);
      font:inherit;
      cursor:pointer;
    }

    .empty-action:focus {
      border-color:var(--primary);
      box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 16%,transparent);
    }

    .empty-action .emoji {
      font-size:2.4rem;
      display:block;
      margin-bottom:8px;
    }

    .empty-action strong {
      display:block;
      color:var(--text);
      font-size:1rem;
      margin-bottom:4px;
    }

    .empty-action span {
      display:block;
      font-size:.85rem;
    }

    /* docs/roadmap.md part 3 item 0, empty-state affordance follow-up -
       the dashed border alone still read as decoration, not a control,
       so this adds a small pill that LOOKS like a button (it isn't one -
       nesting a real <button> inside .empty-action would be invalid
       HTML and confuse screen readers, since .empty-action itself is
       the actual control). Purely visual anchor. */
    /* display:block, not inline-block - .empty-action span{display:block}
       above is more specific (class+element vs. this rule's class alone)
       and would win anyway. Written explicitly rather than left as dead
       inline-block, since a full-width bar matches this app's own
       primary-btn convention and reads as a bigger, clearer tap target. */
    .empty-action-cta {
      display:block;
      margin-top:10px;
      padding:8px 16px;
      border-radius:999px;
      background:var(--primary);
      color:#fff;
      font-size:.85rem;
      font-weight:700;
    }

    /* Finite on purpose - animation-iteration-count, no JS, no
       localStorage. An empty category can sit untouched for days; a
       looping pulse would still be looping when the user comes back
       tomorrow, which reads as noise, not an invitation. This is
       deliberately NOT the same mechanism as index.html's
       adminGearPulse (.admin-gear-seen, persisted across visits via
       localStorage, cleared only by an explicit interaction) - there's
       no "seen" state here at all. Each fresh render of this button
       (page load, or - on pages with tabs - switching into the tab
       that shows it) is a new DOM element, so the animation naturally
       replays every time regardless of whether this is visit 1 or
       visit 30. That's intentional, not a gap: without a "seen" flag
       to maintain, this stays simple. */
    .empty-action {
      animation-name: emptyActionPulse;
      animation-duration: 1.8s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: 3;
    }

    @keyframes emptyActionPulse {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 35%, transparent); }
      50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--primary) 0%, transparent); }
    }

    @media (prefers-reduced-motion: reduce) {
      .empty-action {
        animation: none;
      }
    }

    .group-block {
      margin-bottom:16px;
    }

    .group-title {
      font-size:.92rem;
      margin:0 0 8px;
      color:var(--primary-dark);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .bulk-bar {
      position:fixed;
      z-index:35;
      bottom:calc(78px + env(safe-area-inset-bottom));
      left:50%;
      transform:translateX(-50%);
      width:min(730px,94%);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background:var(--primary-dark);
      color:#fff;
      border-radius:18px;
      padding:10px 12px;
      box-shadow:0 14px 34px rgba(18,59,99,.3);
    }

    .bulk-bar span {
      font-size:.82rem;
      font-weight:750;
      white-space:nowrap;
      flex:0 0 auto;
    }

    .bulk-actions {
      display:flex;
      gap:6px;
      overflow-x:auto;
    }

    .bulk-btn {
      min-height:40px;
      border:1px solid rgba(255,255,255,.28);
      background:rgba(255,255,255,.12);
      color:#fff;
      border-radius:12px;
      padding:0 12px;
      font-size:.78rem;
      font-weight:750;
      white-space:nowrap;
    }

    .bulk-btn.danger {
      background:var(--danger);

    }

    .sheet p {

    .field input,

      }

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      set,
      push,
      update,
      remove,
      get,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const config = {
      apiKey: "AIzaSyDhTtqVrBiKfKLxdOVmd_XwBEJm5oh_vMg",
      authDomain: "mykonos-list.firebaseapp.com",
      databaseURL: "https://mykonos-list-default-rtdb.firebaseio.com",
      projectId: "mykonos-list",
      storageBucket: "mykonos-list.firebasestorage.app",
      messagingSenderId: "471388041921",
      appId: "1:471388041921:web:c0100252c6397f67dc1a40",
      measurementId: "G-0VXCEZ117S"
    };

    const app = initializeApp(config);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const query = new URLSearchParams(location.search);
    const tripId = query.get("tripId");
    const tripRoot = tripId ? `trips/${tripId}` : null;
    const themeKey = `trip-${tripId || "legacy"}-theme`;
    const langKey = `trip-${tripId || "legacy"}-lang`;
    const activeListKey = `trip-${tripId || "legacy"}-activeList`;
    const activeLegFilterKey = `trip-${tripId || "legacy"}-activeLegFilter`;

    let user = null;
    let trip = {};

    // True once a real trip record has arrived - see applyLanguage() below.
    let tripDataLoaded = false;
    let profile = null;

    // loadProfile() is called on every firing of the trip's onValue
    // listener (not just once) - and that listener re-fires on ANY change
    // under tripRoot, packing items included. profileLoadGen makes an
    // older, still-pending call a no-op once a newer one has started, so a
    // slow first call can never overwrite what a faster second call already
    // wrote. profileLoadTimer is a best-effort cleanup of the previous
    // call's timer - it reduces how often the stale timeout fires at all,
    // but the generation check above is what actually prevents a stale
    // write if it does.
    let profileLoadGen = 0;
    let profileLoadTimer = null;

    let items = {};
    let allPacking = {};

    // Restored per trip (not global - a different trip means a different
    // list). Falls back to "main" like before when there's nothing saved
    // yet. Deliberately NOT guarded against a stale/deleted list here -
    // renderLists()'s existing fallback (below) already catches that on
    // the very next render, no need for a second copy of the same check.
    let activeList = "main";
    try {
      const savedActiveList = localStorage.getItem(activeListKey);
      if (savedActiveList) activeList = savedActiveList;
    } catch (e) {}

    // docs/schema-legs.md §5.1, step 6 - the destination axis, restored
    // the same way as activeList above (per-trip, not global). Validity
    // (a stale/deleted leg, or a single-leg trip where this control isn't
    // even shown) is checked at render time in renderLegFilter(), same
    // division of responsibility as activeList's own fallback in
    // renderLists() - not duplicated here.
    let activeLegFilter = "all";
    try {
      const savedLegFilter = localStorage.getItem(activeLegFilterKey);
      if (savedLegFilter) activeLegFilter = savedLegFilter;
    } catch (e) {}
    let editingId = null;
    // Captured by openEdit() at click time, from data-edit's data-category -
    // NOT read from activeList when the modal opens. saveEdit()/deleteItem
    // read the item's real category from here, not from whatever list
    // happens to be active while the modal is open.
    let editingCategoryId = null;
    let packingListening = false;
    let stopTrip = null;
    let selectionMode = false;
    // itemId -> categoryId. Not a flat Set: a selection can span categories
    // in a merged view, and every bulk action needs each item's own
    // category, not one shared activeList. A Map avoids splitting a
    // compound "categoryId:itemId" string at every consumer - item ids are
    // already relied on as globally unique across categories elsewhere
    // (itemsForCategoryFilter's flat merge), so keying by bare itemId here
    // carries no collision risk.
    let selectedIds = new Map();
    let celebratedLists = new Set();
    let expandedItems = new Set();

    const $ = id => document.getElementById(id);

    const tr = (hebrew, english) =>
      trip.language === "en" ? english : hebrew;

    function customAlert(message) {
      return new Promise(resolve => {
        const overlay = document.createElement("div");
        overlay.className = "custom-dialog-overlay";

        overlay.innerHTML =
          '<div class="custom-dialog-card">' +
          '<div class="custom-dialog-brand">✈️ GitTrip</div>' +
          '<p class="custom-dialog-message"></p>' +
          '<div class="custom-dialog-actions">' +
          '<button class="custom-dialog-btn confirm">' +
          tr("הבנתי", "OK") +
          "</button></div></div>";

        overlay.querySelector(".custom-dialog-message").textContent =
          message;

        document.body.appendChild(overlay);

        const cleanup = () => {
          overlay.remove();
          resolve();
        };

        overlay.querySelector("button").onclick = cleanup;
        overlay.onclick = event => {
          if (event.target === overlay) cleanup();
        };
      });
    }

    function customConfirm(message, options) {
      const danger = Boolean(options && options.danger);

      return new Promise(resolve => {
        const overlay = document.createElement("div");
        overlay.className = "custom-dialog-overlay";

        overlay.innerHTML =
          '<div class="custom-dialog-card">' +
          '<div class="custom-dialog-brand">✈️ GitTrip</div>' +
          '<p class="custom-dialog-message"></p>' +
          '<div class="custom-dialog-actions">' +
          '<button class="custom-dialog-btn cancel">' +
          tr("ביטול", "Cancel") +
          "</button>" +
          '<button class="custom-dialog-btn ' +
          (danger ? "danger" : "confirm") +
          '">' +
          tr("אישור", "Confirm") +
          "</button></div></div>";

        overlay.querySelector(".custom-dialog-message").textContent =
          message;

        document.body.appendChild(overlay);

        const cleanup = result => {
          overlay.remove();
          resolve(result);
        };

        overlay.querySelector(".cancel").onclick = () => cleanup(false);
        overlay
          .querySelector(danger ? ".danger" : ".confirm")
          .onclick = () => cleanup(true);
        overlay.onclick = event => {
          if (event.target === overlay) cleanup(false);
        };
      });
    }

    const scoped = file => {
      const url = new URL(file, location.href);

      if (tripId) {
        url.searchParams.set("tripId", tripId);
      }

      return url.href;
    };

    try {
      const cachedLang = localStorage.getItem(langKey);

      if (cachedLang) {
        trip.language = cachedLang;
        applyLanguage();
      }
    } catch (e) { /* ignore */ }

    // Run once immediately, synchronously from the URL's tripId - before
    // Firebase answers - so the home button (and other nav links) carry
    // tripId even if tapped before the trip finishes loading. Re-run once
    // the real trip data arrives, which also fixes up spliitUrl/features.
    configureLinks();

    function toast(text) {
      $("toast").textContent = text;
      $("toast").classList.add("show");

      setTimeout(() => {
        $("toast").classList.remove("show");
      }, 2200);
    }

    function fireConfetti() {
      const canvas = document.createElement("canvas");
      canvas.style.position = "fixed";
      canvas.style.inset = "0";
      canvas.style.zIndex = "60";
      canvas.style.pointerEvents = "none";
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      document.body.appendChild(canvas);

      const ctx = canvas.getContext("2d");
      const colors = ["#123B63", "#1F7A8C", "#F2B84B", "#E76F51", "#2F8B68"];

      const pieces = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.4,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        speedY: 2 + Math.random() * 3,
        speedX: -1.5 + Math.random() * 3,
        rotation: Math.random() * 360,
        rotationSpeed: -8 + Math.random() * 16
      }));

      const start = Date.now();
      const duration = 2600;

      function frame() {
        const elapsed = Date.now() - start;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        pieces.forEach(piece => {
          piece.x += piece.speedX;
          piece.y += piece.speedY;
          piece.rotation += piece.rotationSpeed;

          ctx.save();
          ctx.translate(piece.x, piece.y);
          ctx.rotate((piece.rotation * Math.PI) / 180);
          ctx.fillStyle = piece.color;
          ctx.fillRect(-piece.size / 2, -piece.size / 4, piece.size, piece.size / 2);
          ctx.restore();
        });

        if (elapsed < duration) {
          requestAnimationFrame(frame);
        } else {
          canvas.remove();
        }
      }

      requestAnimationFrame(frame);
      toast(tr("🎉 סיימתם לארוז!", "🎉 Packing complete!"));
    }

    function starterLists() {

        ],
        camping: [

          { id: "gear", name: "ציוד", items: ["מים", "קרם הגנה", "ערכת עזרה ראשונה", "גפרורים"] },
          { id: "clothing", name: "ביגוד", items: ["בגדים חמים", "נעלי הליכה", "גרביים רזרביים"] }
        ],
        reserve: [
          { id: "uniform", name: "ציוד אישי", items: ["מדים", "נעלי קרב", "כלי רחצה"] },
          { id: "clothing", name: "ביגוד", items: ["בגד חם", "בגד להחלפה"] },
          { id: "gear", name: "ציוד", items: ["מטען", "תרופות", "פנס", "סוללות"] }
        ]
      };

      const english = {
        abroad: [
          { id: "documents", name: "Documents", items: ["Passport", "Flight ticket", "Travel insurance", "Hotel confirmation"] },
          { id: "clothing", name: "Clothing", items: ["Swimsuit", "Sunglasses", "Walking shoes", "Hat"] },
          { id: "gear", name: "Gear", items: ["Phone charger", "Medicine", "Power bank", "Power adapter"] }
        ],
        local: [
          { id: "documents", name: "Documents", items: ["ID card", "Driver's license", "Credit card", "Booking confirmation"] },
          { id: "clothing", name: "Clothing", items: ["Light jacket", "Change of clothes"] },
          { id: "gear", name: "Gear", items: ["Water bottle", "Hat", "Charger", "Medicine", "Walking shoes"] }
        ],
        camping: [
          { id: "shelter", name: "Shelter", items: ["Tent", "Sleeping bag", "Air mattress", "Flashlight"] },
          { id: "gear", name: "Gear", items: ["Water", "Sunscreen", "First aid kit", "Matches"] },
          { id: "clothing", name: "Clothing", items: ["Warm clothes", "Hiking shoes", "Spare socks"] }
        ],
        reserve: [
          { id: "uniform", name: "Personal gear", items: ["Uniform", "Combat boots", "Toiletries"] },
          { id: "clothing", name: "Clothing", items: ["Warm clothing", "Change of clothes"] },
          { id: "gear", name: "Gear", items: ["Charger", "Medicine", "Flashlight", "Batteries"] }
        ]
      };

      const lists = (trip.language === "en" ? english : hebrew)[type] || [];

      const vibes = trip.vibes || [];

      if ((type === "abroad" || type === "local") && vibes.length) {
        const en = trip.language === "en";

        const vibeClothing = {
          urban: en
            ? ["Comfortable walking shoes", "Light jacket"]
            : ["נעליים נוחות להליכה", "מעיל קל"],
          beach: en
            ? ["Swimsuit", "Sunglasses", "Sunscreen"]
            : ["בגד ים", "משקפי שמש", "קרם הגנה"],
          nature: en
            ? ["Hiking shoes", "Backpack"]
            : ["נעלי הליכה", "תרמיל גב"],
          relax: en
            ? ["Comfortable clothing", "Robe"]
            : ["בגדים נוחים", "חלוק"]
        };

        const clothingList = lists.find(list => list.id === "clothing");

        if (clothingList) {
          const merged = new Set();

          vibes.forEach(vibe =>
            (vibeClothing[vibe] || []).forEach(item => merged.add(item))
          );

          if (merged.size) {
            clothingList.items = [...merged];
          }
        }
      }

      // tripCharacter (docs/schema-legs.md §3.2) - same idea as vibes above
      // (suggest extra items for an existing category) but a properly
      // MERGING version. vibes above does `clothingList.items = [...merged]`,
      // which replaces the category outright instead of combining with what
      // tripType already put there - that's a real bug (see CLAUDE.md), not
      // fixed here since it's out of scope for this change. This block reads
      // whatever each category currently holds (tripType's own items, and/or
      // whatever vibes left behind) and appends to it instead, so both
      // mechanisms actually run in parallel rather than one clobbering the
      // other - which is also why this runs AFTER the vibes block above, not
      // before: tripCharacter's own contribution must survive regardless of
      // whether vibes touched clothing on this trip.
      //
      // Applies to all 4 trip types - unlike vibes (abroad/local only),
      // nothing in the schema restricts tripCharacter that way. Only ever
      // adds to gear/clothing, never creates a category a trip type doesn't
      // have: reserve has no "clothing", so a pride/bachelor + reserve trip
      // silently skips its one clothing item; everything else in gear still
      // lands normally.
      const character = trip.tripCharacter;

      if (character) {
        const en = trip.language === "en";

        const characterGear = {
          family: en
            ? ["First aid kit", "Personal medication", "Snacks for the road", "Extra power bank"]
            : ["ערכת עזרה ראשונה", "תרופות אישיות", "חטיפים לדרך", "מטען נייד נוסף"],
          // Deliberately empty. "friends" is this app's own default trip
          // character (no particular skew), and a couple's trip doesn't need
          // different gear from any other trip - do not "fix" this by
          // inventing items for either.
          friends: [],
          couple: [],
          ski: en
            ? ["Ski gloves", "Ski goggles", "Sunscreen", "Thermal socks", "Beanie"]
            : ["כפפות סקי", "משקפי סקי", "קרם הגנה", "גרבי תרמיות", "כובע גרב"],
          pride: en
            ? ["Hand fan", "Water bottle", "Sunscreen", "Power bank", "Earplugs"]
            : ["מניפה", "בקבוק מים", "קרם הגנה", "מטען נייד", "אטמי אוזניים"],
          bachelor: en
            ? ["Power bank", "Backup credit card", "Painkillers"]
            : ["מטען נייד", "כרטיס אשראי נוסף", "כדורי כאב ראש"],
          festival: en
            ? ["Earplugs", "Closed-toe shoes", "Sleeping bag", "Toilet paper", "Flashlight"]
            : ["אטמי אוזניים", "נעליים סגורות", "שק שינה", "נייר טואלט", "פנס"]
        };

        const characterClothing = {
          pride: en ? ["Party outfits"] : ["תלבושות למסיבות"],
          bachelor: en ? ["Party outfits"] : ["תלבושות למסיבות"]
        };

        // Dedup only - never shown, never changes what's displayed. Kept
        // deliberately small (one real-world item, "charger/power bank",
        // named five different ways across the existing tables and the new
        // character lists). "מטען נייד נוסף"/"Extra power bank" is left OUT
        // of this map on purpose: family is meant to add a second one even
        // when a charger is already listed - "with kids you really do want
        // two." Other near-miss pairs were considered and deliberately left
        // separate, not added here: "מטען לטלפון"/"Phone charger" already
        // coexists with "פאוור בנק"/"Power bank" as two distinct items in
        // abroad's own gear list, which is itself evidence they're not the
        // same item; "תרופות אישיות"/"Personal medication" (family) and
        // "כדורי כאב ראש"/"Painkillers" (bachelor) both read as specific
        // additions alongside a generic "תרופות"/"Medicine" entry, the same
        // shape as the charger exception above, not a restatement of it.
        const DEDUP_SYNONYMS = {
          "פאוור בנק": "charger",
          "מטען": "charger",
          "מטען נייד": "charger",
          "power bank": "charger",
          "charger": "charger"
        };

        const dedupKey = name => {
          const normalized = name.trim().toLowerCase();
          return DEDUP_SYNONYMS[normalized] || normalized;
        };

        // Cross-category on purpose: an item already suggested anywhere in
        // this trip type (e.g. "שק שינה" under camping's own "לינה"/shelter
        // list) shouldn't be re-suggested under gear just because that's
        // where the character table happens to put it.
        const allExistingKeys = new Set(
          lists.flatMap(list => list.items).map(dedupKey)
        );

        function appendDeduped(categoryId, newItems) {
          if (!newItems || !newItems.length) {
            return;
          }

          const targetList = lists.find(list => list.id === categoryId);

          if (!targetList) {
            return;
          }

          newItems.forEach(item => {
            const key = dedupKey(item);

            if (allExistingKeys.has(key)) {
              return;
            }

            allExistingKeys.add(key);
            targetList.items.push(item);
          });
        }

        appendDeduped("gear", characterGear[character]);
        appendDeduped("clothing", characterClothing[character]);
      }

      return lists;
    }

    // Writes listMeta exactly once per user per trip, on their very first
    // visit - intentional, not a bug to "fix" by making it run again later.
    // The guard below means a user who has since renamed/deleted/reordered
    // their categories never gets silently overwritten back to the
    // starter set on a later load. A user with no listMeta yet (this
    // guard's whole reason to exist) still sees category names correctly
    // in the meantime - listLabelFor() (below) falls back to the raw
    // category id itself when no listMeta entry exists for it, which is
    // why "gear"/"clothing" render fine even before this write lands, not
    // a separate gap.
    async function ensureStarterLists() {
      const metadata = allPacking?.users?.[user?.uid]?.listMeta;
      const existingItems = allPacking?.users?.[user?.uid]?.items;

      if (metadata || (existingItems && Object.keys(existingItems).length)) {
        return;
      }

      const lists = starterLists();

      if (!lists.length) {
        return;
      }

      const updates = {};

      lists.forEach((list, index) => {
        updates[`${userBase()}/listMeta/${list.id}`] = {
          name: list.name,
          order: index,
          createdAt: Date.now()
        };
      });

      await update(ref(db), updates);
      activeList = lists[0].id;
    }

    // Core of createList() below, without its UI side effects (closing
    // newListOverlay, clearing its input, its own toast) - importItem()'s
    // "create category named X" picker needs the same write and the new
    // id back, but none of the newListOverlay-specific UI behavior.
    async function createListReturningId(name) {
      const trimmed = (name || "").trim();

      if (!trimmed || !user) {
        return null;
      }

      const id = `list_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;

      await set(
        ref(db, `${userBase()}/listMeta/${id}`),
        { name: trimmed, createdAt: Date.now() }
      );

      return id;
    }

    async function createList(name) {
      const id = await createListReturningId(name);

      if (!id) {
        return;
      }

      activeList = id;
      $("newListOverlay").classList.add("hidden");
      $("newListName").value = "";
      renderMine();
      toast(tr("הרשימה נוצרה", "List created"));
    }

    function openManageList() {
      const isMain = activeList === "main";

      $("renameListName").value = listLabel(activeList);
      $("renameListName").disabled = isMain;
      $("renameListBtn").disabled = isMain;
      $("renameListBtn").style.opacity = isMain ? ".5" : "1";
      $("deleteListBtn").classList.toggle("hidden", isMain);

      $("manageListOverlay").classList.remove("hidden");
    }

    async function duplicateList() {
      const sourceItems = currentItems();
      const baseName = listLabel(activeList);
      const newId = `list_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;

      const updates = {
        [`${userBase()}/listMeta/${newId}`]: {
          name: `${baseName} (${tr("עותק", "copy")})`,
          createdAt: Date.now()
        }
      };

      Object.entries(sourceItems).forEach(([id, item]) => {
        updates[`${userBase()}/items/${newId}/${id}`] = item;
      });

      await update(ref(db), updates);

      activeList = newId;
      $("manageListOverlay").classList.add("hidden");
      renderMine();
      toast(tr("הרשימה שוכפלה", "List duplicated"));
    }

    async function setListVisibility(isPublic) {
      const sourceItems = currentItems();
      const ids = Object.keys(sourceItems);

      if (!ids.length) {
        return;
      }

      const updates = {};

      ids.forEach(id => {
        updates[`${userBase()}/items/${activeList}/${id}/isPublic`] = isPublic;
      });

      await update(ref(db), updates);
      $("manageListOverlay").classList.add("hidden");

      toast(
        isPublic
          ? tr("כל הרשימה שותפה עם הקבוצה", "The whole list is now shared")
          : tr("כל הרשימה הפכה לפרטית", "The whole list is now private")
      );
    }

    async function renameList() {
      const name = $("renameListName").value.trim();

      if (!name || activeList === "main") {
        return;
      }

      await update(
        ref(db, `${userBase()}/listMeta/${activeList}`),
        { name }
      );

      $("manageListOverlay").classList.add("hidden");
      toast(tr("הרשימה עודכנה", "List updated"));
    }

    async function deleteList() {
      if (activeList === "main") {
        return;
      }

      if (
        !(await customConfirm(
          tr(
            "למחוק את הרשימה וכל הפריטים בה?",
            "Delete this list and all its items?"
          ),
          { danger: true }
        ))
      ) {
        return;
      }

      const idToDelete = activeList;
      activeList = "main";

      await update(ref(db), {
        [`${userBase()}/listMeta/${idToDelete}`]: null,
        [`${userBase()}/items/${idToDelete}`]: null
      });

      $("manageListOverlay").classList.add("hidden");
      renderMine();
      toast(tr("הרשימה נמחקה", "List deleted"));
    }

    function renderQuickPicks() {
      const lists = starterLists();
      const match = lists.find(list => list.id === activeList);
      const allSuggestions = match ? match.items : [];

      const existingNames = new Set(
        Object.values(currentItems())
          .map(item => (item.name || "").trim().toLowerCase())
      );

      const suggestions =
        allSuggestions.filter(item =>
          !existingNames.has(item.trim().toLowerCase())
        );

      $("quickPicksLabel").classList.toggle(
        "hidden",
        !suggestions.length
      );

      $("quickPicks").innerHTML =
        suggestions
          .map(item => {
            return (
              `<button class="pick" ` +
              `data-pick="${escapeHtml(item)}">` +
              `+ ${escapeHtml(item)}` +
              `</button>`
            );
          })
          .join("") +
        // Trailing spacer, not CSS padding alone: padding at the scroll
        // end of an overflow container isn't reliably honored at true
        // max-scroll on every engine. A real flex child guarantees the
        // breathing room is actually reachable.
        `<span class="quick-picks-end-spacer" aria-hidden="true"></span>`;

      // Found while testing the fade below: replacing the content here
      // doesn't reset scroll position on its own, so switching categories
      // (e.g. gear -> clothing) could leave the strip mid-scrolled from
      // whatever the previous category's content happened to be, showing
      // the wrong slice of the new list and - since the fade reflects
      // actual scroll position - a wrong fade state too.
      $("quickPicks").scrollLeft = 0;

      document
        .querySelectorAll("[data-pick]")
        .forEach(button => {
          button.onclick = () => {
            addItem(button.dataset.pick);
          };
        });

      updateQuickPicksFade();
    }

    // Shows the trailing-edge fade only while there's actually more to
    // scroll to - never on a short list that already fits, and it turns
    // off by itself once a scroll reaches the true end. Math.abs() because
    // RTL scrollLeft direction isn't standardized the same way across
    // engines (this one uses negative values going toward the end); abs()
    // makes the "how far from the end" math identical either way instead
    // of branching on direction.
    function updateQuickPicksFade() {
      const el = $("quickPicks");
      const hasMore = Math.abs(el.scrollLeft) + el.clientWidth < el.scrollWidth - 1;
      el.classList.toggle("has-more", hasMore);
    }

    const AI_FUNCTION_URL =
      "https://us-central1-mykonos-list.cloudfunctions.net/suggestPackingList";

    // docs/schema-legs.md §7ב, step 12 commit ב - the leg the AI request
    // should describe: whichever leg activeLegFilter is actually pointing
    // at, falling back to the primary leg when the filter is "all" - same
    // fallback every other activeLegFilter consumer in this file already
    // uses (see the taggedLeg lookup a few hundred lines below). Fixes a
    // real bug: requestAiSuggestions() used to hardcode
    // window.getPrimaryLeg(trip) unconditionally, so filtering to a later
    // leg and clicking "suggest" silently asked the model about the wrong
    // destination - no error, no indication, just suggestions for the
    // wrong place. For a single-leg trip activeLegFilter is always "all"
    // and getLegs(trip) has exactly one entry, so this resolves to the
    // exact same leg getPrimaryLeg(trip) already returns.
    function aiSuggestLeg() {
      if (activeLegFilter !== "all") {
        const leg = window.getLegs(trip).find(l => l.id === activeLegFilter);
        if (leg) return leg;
      }

      return window.getPrimaryLeg(trip);
    }

    // docs/schema-legs.md §7ב - fetches one AI response and resolves with
    // its items, or REJECTS on any failure (network error, non-ok status,
    // empty/missing items) - a single failure shape so Promise.allSettled
    // (requestAiSuggestionsMultiLeg below) can treat every kind of problem
    // identically without re-deriving this logic per call site. reason is
    // attached to the thrown Error so a caller that cares (the single-call
    // path, for its truncated-specific toast) can still tell truncation
    // apart from everything else - commit א's server contract is unchanged,
    // this just moves where it's read from.
    async function fetchAiItems(body) {
      const response = await fetch(AI_FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        let reason = null;

        try {
          reason = (await response.json())?.reason || null;
        } catch (e) {}

        const error = new Error(reason === "truncated" ? "truncated" : "Request failed");
        error.reason = reason;
        throw error;
      }

      const data = await response.json();

      if (!data.items || !data.items.length) {
        const error = new Error("No items");
        error.reason = "empty";
        throw error;
      }

      return data.items;
    }

    // docs/schema-legs.md §7ב - the exact single-call request this file has
    // always sent, byte-for-byte: one leg (aiSuggestLeg() - the filtered
    // leg, or the primary leg on "all"/single-leg), one fetch, no per-leg
    // instruction added to the prompt (scope omitted - functions/index.js
    // only adds that instruction when scope:"leg" is sent explicitly, which
    // this path never does). Used whenever activeLegFilter points at a
    // specific leg, or the trip only has one leg to begin with - see
    // requestAiSuggestions()'s dispatch below for the multi-leg branch.
    async function requestAiSuggestionsSingle() {
      const leg = aiSuggestLeg();

      const items = await fetchAiItems({
        destination: leg.name || "",
        tripType: trip.tripType || "abroad",
        vibes: leg.vibes || [],
        startDate: leg.startAt || "",
        endDate: leg.endAt || "",
        listName: listLabel(activeList),
        language: trip.language === "en" ? "en" : "he"
      });

      // legId:undefined tells renderAiSuggestions() to tag on accept using
      // activeLegFilter, exactly like every AI suggestion has always been
      // tagged - see addItem()'s own comment on what undefined means there.
      renderAiSuggestions(items.map(name => ({ name, legId: undefined })));
    }

    // docs/schema-legs.md §7ב, step 12 commit ג - one call per leg (each
    // with legId:leg.id, so an accepted item is tagged with the leg that
    // actually suggested it - never activeLegFilter, which is "all" the
    // whole time this path runs) plus one call for trip-wide shared items
    // (legId:null - explicitly untagged, shows under every filter).
    // Promise.allSettled so one leg failing doesn't take the others down -
    // partial results are shown, with a toast naming what's missing.
    async function requestAiSuggestionsMultiLeg(legs) {
      const calls = [
        ...legs.map(leg => ({
          legId: leg.id,
          legName: leg.name,
          promise: fetchAiItems({
            destination: leg.name || "",
            tripType: trip.tripType || "abroad",
            vibes: leg.vibes || [],
            startDate: leg.startAt || "",
            endDate: leg.endAt || "",
            listName: listLabel(activeList),
            language: trip.language === "en" ? "en" : "he",
            scope: "leg"
          })
        })),
        {
          legId: null,
          legName: tr("פריטים משותפים", "Shared items"),
          promise: fetchAiItems({
            destination: legs.map(leg => leg.name).join(", "),
            tripType: trip.tripType || "abroad",
            listName: listLabel(activeList),
            language: trip.language === "en" ? "en" : "he",
            scope: "shared"
          })
        }
      ];

      const settled = await Promise.allSettled(calls.map(c => c.promise));

      const merged = [];
      const failedNames = [];

      settled.forEach((result, i) => {
        if (result.status === "fulfilled") {
          result.value.forEach(name => merged.push({ name, legId: calls[i].legId }));
        } else {
          console.error(`AI suggestion error (${calls[i].legName}):`, result.reason);
          failedNames.push(calls[i].legName);
        }
      });

      if (!merged.length) {
        toast(
          tr(
            "לא ניתן היה לקבל הצעות AI כרגע",
            "Couldn't get AI suggestions right now"
          )
        );
        return;
      }

      renderAiSuggestions(merged);

      // Never blocks the suggestions that did succeed from showing (above,
      // unconditionally) - this is purely informational, so the user knows
      // the shorter-than-expected list is a real failure, not "the AI just
      // didn't have much to say about Bangkok."
      if (failedNames.length === 1) {
        toast(
          tr(
            `לא התקבלו הצעות ל${failedNames[0]}`,
            `No suggestions received for ${failedNames[0]}`
          )
        );
      } else if (failedNames.length > 1) {
        toast(
          tr(
            `לא התקבלו הצעות ל-${failedNames.length} יעדים`,
            `No suggestions received for ${failedNames.length} destinations`
          )
        );
      }
    }

    // Suggestions are scoped to whichever category/destination was active
    // when they were fetched (aiSuggestLeg() above reads activeLegFilter at
    // request time) - stale ones left visible after either changes read as
    // current for the new context, which is a wrong-but-plausible-looking
    // result, not an obvious error. Called from every place that can change
    // that context: opening the add-item modal (covers a category switch
    // too, since the modal has to be closed to reach the category chips
    // behind it) and the destination filter's own onchange - a no-op
    // whenever the modal happens to already be closed.
    function resetAiSuggestions() {
      $("aiSuggestions").classList.add("hidden");
      $("aiSuggestions").innerHTML = "";
    }

    async function requestAiSuggestions() {
      const button = $("aiSuggestBtn");
      const originalText = button.textContent;
      const legs = window.getLegs(trip);

      // docs/schema-legs.md §7ব, step 12 commit ג - multi-call only when
      // the filter is "all" AND there's more than one leg to ask about.
      // A leg-specific filter stays on the single-call path unchanged
      // (commit ב's own scope) - asking about one already-chosen
      // destination doesn't need N+1 calls.
      const useMultiLeg = activeLegFilter === "all" && window.isMultiLeg(trip);

      button.disabled = true;
      button.textContent = useMultiLeg
        ? tr("אוסף הצעות לכל היעדים...", "Gathering suggestions for every destination...")
        : tr("חושב...", "Thinking...");

      try {
        if (useMultiLeg) {
          await requestAiSuggestionsMultiLeg(legs);
        } else {
          await requestAiSuggestionsSingle();
        }
      } catch (error) {
        console.error("AI suggestion error:", error);
        toast(
          error.message === "truncated"
            ? tr(
                "התשובה נקטעה, נסו שוב",
                "The response was cut off, try again"
              )
            : error.reason === "empty"
              ? tr(
                  "לא התקבלו הצעות הפעם, נסו שוב",
                  "No suggestions this time, try again"
                )
              : tr(
                  "לא ניתן היה לקבל הצעות AI כרגע",
                  "Couldn't get AI suggestions right now"
                )
        );
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    // Safety net for the AI-suggestion prompt, not the fix itself - see
    // functions/index.js and CHANGELOG.md. Semantic near-duplicates
    // ("מעיל מעבר עמיד למים ולרוח" vs "מעיל סתווי עמיד לרוח ולגשם") are
    // not text-detectable at all and can only be fixed in the prompt.
    // What *is* text-detectable, and did slip through even after the
    // prompt fix, is one phrasing being a whole-word prefix of another
    // ("צעיף קל" / "צעיף קל לסתיו", "מטרייה מתקפלת" / "מטרייה מתקפלת קלה").
    function normalizeForDedup(value) {
      return String(value)
        .replace(/\([^)]*\)/g, " ") // "(Power Bank)" etc. - noise for comparison
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
    }

    function wordsOfItem(value) {
      const normalized = normalizeForDedup(value);
      return normalized ? normalized.split(" ") : [];
    }

    // True if `aWords`/`bWords` name the same real item: identical after
    // normalization, or one is a whole-*word* prefix of the other
    // ("צעיף קל" is a prefix of "צעיף קל לסתיו"). Word-level, not
    // character-level - "מעיל" must not match "מעילים" or "מעילון" just
    // because the characters line up; splitting on whitespace already
    // guarantees that, since those are simply different single tokens.
    //
    // The shorter side must have at least 2 words. A single generic word
    // ("מעיל") being a prefix of a more specific one ("מעיל גשם") is too
    // weak a signal to treat as certainly the same item - those could
    // legitimately be two different, deliberately-added things - so
    // single-word items only match by exact equality, never by prefix.
    function isSameItem(aWords, bWords) {
      if (aWords.join(" ") === bWords.join(" ")) {
        return true;
      }

      const [shorter, longer] =
        aWords.length <= bWords.length ? [aWords, bWords] : [bWords, aWords];

      if (shorter.length < 2 || shorter.length >= longer.length) {
        return false;
      }

      return shorter.every((word, i) => word === longer[i]);
    }

    // docs/schema-legs.md §7ব, step 12 commit ג - aiItems is {name,legId}[].
    // legId is undefined (single-call path - tag on accept using
    // activeLegFilter, exactly as always), a real leg id (multi-call,
    // per-leg response - that leg suggested it), or null (multi-call,
    // shared-items response, or a cross-leg collision resolved below -
    // explicitly untagged, shows under every filter).
    function renderAiSuggestions(aiItems) {
      // Every list, not just the active one - a suggestion that duplicates
      // something already on a *different* list is still a duplicate.
      const existingWordLists = Object.values(items)
        .flatMap(list => Object.values(list || {}))
        .map(item => wordsOfItem(item.name || ""))
        .filter(words => words.length);

      let filteredAgainstExisting = 0;
      let filteredAsDuplicate = 0;
      const accepted = [];

      aiItems.forEach(entry => {
        const words = wordsOfItem(entry.name);

        if (!words.length) {
          return;
        }

        if (existingWordLists.some(existing => isSameItem(words, existing))) {
          filteredAgainstExisting++;
          return;
        }

        const dupIndex = accepted.findIndex(a => isSameItem(words, a.words));

        if (dupIndex === -1) {
          accepted.push({ name: entry.name, legId: entry.legId, words });
          return;
        }

        filteredAsDuplicate++;

        const existing = accepted[dupIndex];

        // The same item name coming back from two DIFFERENT origins (two
        // legs independently suggesting "sunscreen," or a leg and the
        // shared call agreeing on something) is not "belongs to whichever
        // one got kept below" - that would tag it as leg-specific when the
        // model effectively flagged it as useful beyond one destination.
        // Untagged is the honest answer: it shows under every filter,
        // same as a duplicate the shared call would have produced on its
        // own. A collision within the SAME origin (two phrasings from one
        // leg's own response) keeps that origin's legId - only a genuine
        // cross-origin collision does this. Do not "simplify" this to
        // always keeping the first/kept entry's legId - that's the
        // silently-wrong-legId bug this whole commit exists to avoid.
        const mergedLegId = existing.legId === entry.legId ? existing.legId : null;

        // Keep whichever phrasing is shorter, regardless of arrival order -
        // it's the more canonical name, and it's also the smaller one.
        accepted[dupIndex] =
          words.length < existing.words.length
            ? { name: entry.name, legId: mergedLegId, words }
            : { ...existing, legId: mergedLegId };
      });

      // Diagnostic only, not user-facing: this is here to find out whether
      // the prompt fix alone is enough or this filter is still doing real
      // work. Revisit after a few weeks of production use.
      if (filteredAgainstExisting || filteredAsDuplicate) {
        console.log(
          `AI suggestions: filtered ${filteredAgainstExisting} already on a list, ` +
          `${filteredAsDuplicate} duplicate within the batch itself ` +
          `(of ${aiItems.length} suggested)`
        );
      }

      const fresh = accepted.map(a => ({ name: a.name, legId: a.legId }));

      // Not a failure, just a signal something upstream (prompt or
      // filtering) may need another look - never blocks the suggestions
      // that did survive from showing.
      if (fresh.length < 3) {
        console.warn(
          `AI suggestions: only ${fresh.length} left after filtering ` +
          `(of ${aiItems.length} suggested)`
        );
      }

      if (!fresh.length) {
        $("aiSuggestions").classList.add("hidden");
        toast(
          tr(
            "כל ההצעות כבר ברשימה שלך",
            "All suggestions are already on your list"
          )
        );
        return;
      }

      $("aiSuggestions").classList.remove("hidden");

      $("aiSuggestions").innerHTML = fresh
        .map((entry, i) =>
          `<button class="pick" data-ai-index="${i}">` +
          `✨ ${escapeHtml(entry.name)}</button>`
        )
        .join("");

      document
        .querySelectorAll("[data-ai-index]")
        .forEach(button => {
          button.onclick = () => {
            const entry = fresh[Number(button.dataset.aiIndex)];
            addItem(entry.name, undefined, entry.legId);
            button.remove();

            if (!document.querySelector("[data-ai-index]")) {
              $("aiSuggestions").classList.add("hidden");
            }
          };
        });
    }

    function escapeHtml(value = "") {
      return String(value).replace(
        /[&<>"']/g,
        character => ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        })[character]
      );
    }

    // #myName used to be a <select> populated from trip.participants (the
    // organizer's fixed roster from wizard.html) - a leftover of the
    // closed-roster flow the auto-registration work (docs/roadmap.md part
    // 3 item 0, commit ব) removed everywhere else. It looked unrelated to
    // that gate (always visible, not a blocking overlay) and was kept on
    // purpose at the time (v4.30.1) without checking whether it shared the
    // gate's actual bug. It did: the same one found and fixed in
    // shopping.html's #myName (v4.30.2) - profile.name (from
    // memberProfiles, via auto-register) almost never matches an entry in
    // trip.participants, and setting .value on a <select> with no matching
    // <option> is a silent no-op. The select stayed stuck on its
    // placeholder, disabled, looking exactly like "no identity" even
    // though profile was already set correctly and everything else on the
    // page worked. Same fix as shopping.html: a read-only span, driven
    // directly by profile.name. participantOptions()/saveProfile() (the
    // functions that built and wrote through the old select) are removed,
    // not frozen - nothing else in this file called them.
    function syncIdentity() {
      $("userChip").textContent =
        user?.displayName || user?.email || "";

      $("myName").textContent = profile?.name || "";
    }

    // Same race-guard pattern as shopping.html's requireUserName(): profile
    // resolves asynchronously (loadProfile() -> autoRegisterMember), so an
    // action fired in the narrow window before that settles used to just
    // silently do nothing - no toast, not even a console warning. Callers
    // that already checked !profile on their own (addItem, importItem,
    // addToSuggestedCategory) now go through this instead, so the wait is
    // visible rather than hidden.
    function requireProfile() {
      if (!profile) {
        toast(
          tr(
            "עדיין טוען את הפרופיל שלך, נסו שוב בעוד רגע",
            "Still loading your profile, try again in a moment"
          )
        );

        return null;
      }

      return profile;
    }

    function userBase() {
      return `${tripRoot}/packing/users/${user.uid}`;
    }

    function currentItems() {
      return items?.[activeList] || {};
    }

    // Filtered view over every category's items - step 1 of replacing the
    // single-list <select> with a filtered strip. Not wired to anything
    // yet: currentItems() stays exactly as-is, and every existing caller
    // (renderMine, renderQuickPicks, the 14 per-item write sites, AI
    // dedup, etc.) keeps using it unchanged until the later steps.
    //
    // filter === "all" merges every real category bucket in `items` into
    // one flat map, tagging each item with the categoryId it actually
    // came from. That tag is the whole point: every per-item write site
    // today assumes activeList IS the item's category, because rendering
    // has only ever shown one category at a time. The moment a merged
    // view exists, that assumption breaks everywhere at once unless each
    // item carries its own category forward from here.
    //
    // A specific filter (a real category id) returns just that category,
    // tagged the same way - "all" and "one category" are the same shape,
    // just a different source set, so callers don't need two code paths.
    function itemsForCategoryFilter(filter) {
      const sourceIds =
        filter === "all"
          ? Object.keys(items || {})
          : [filter];

      const merged = {};

      sourceIds.forEach(categoryId => {
        const bucket = items?.[categoryId] || {};

        Object.entries(bucket).forEach(([id, item]) => {
          merged[id] = { ...item, categoryId };
        });
      });

      return merged;
    }

    // docs/schema-legs.md §5.1, step 6 - the destination axis, layered ON
    // TOP of itemsForCategoryFilter's own map rather than folded into it:
    // keeps that function's contract (purely about category) intact,
    // same incremental-step pattern this rework has used throughout
    // (steps 1-5 above). Takes an already-category-filtered map, not
    // `items` directly - the two filters compose, they don't replace
    // each other.
    //
    // An item with no legId always passes, regardless of which leg is
    // selected - not just at "all". This is what makes a trip that
    // predates legs, or any item nobody has tagged, behave exactly as if
    // this filter didn't exist (docs/schema-legs.md §5.1: "פריט בלי
    // legId מופיע תמיד, בכל מסנן") - no migration, no backfill.
    function itemsForLegFilter(map, legFilter) {
      if (!legFilter || legFilter === "all") {
        return map;
      }

      const filtered = {};

      Object.entries(map).forEach(([id, item]) => {
        if (!item.legId || item.legId === legFilter) {
          filtered[id] = item;
        }
      });

      return filtered;
    }

    // Step 3 rule: no fallback to activeList. A missing category means
    // something upstream forgot to tag an element or a selectedIds entry -
    // a real bug. Writing to activeList anyway would hide it as a silent
    // wrong-category write instead of a loud failure.
    function assertCategory(categoryId, context) {
      if (!categoryId) {
        console.error(`[packing] missing category for ${context}`);
        throw new Error(`packing.html: missing category (${context})`);
      }

      return categoryId;
    }

    // DOM-element form of assertCategory - every per-item write site
    // converted in step 3 goes through this first.
    function requireCategory(el, context) {
      return assertCategory(el?.dataset?.category, context);
    }

    function allListIds() {
      const metadata =
        allPacking?.users?.[user?.uid]?.listMeta || {};

      return [...new Set([
        "main",
        ...Object.keys(items || {}),
        ...Object.keys(metadata)
      ])];
    }

    // uid-parameterized so importItem() can also resolve a *friend's*
    // source category name (their own listMeta, not mine) for the
    // name-match check - listLabel() below is just this with my own uid.
    function listLabelFor(uid, id) {
      const metadata =
        allPacking?.users?.[uid]?.listMeta || {};

      const defaultName =
        id === "main"
          ? tr("רשימה ראשית", "Main list")
          : id;

      return metadata[id]?.name || defaultName;
    }

    function listLabel(id) {
      return listLabelFor(user?.uid, id);
    }

    function renderLists() {
      const ids = allListIds();

      // main is a ghost list - allListIds() always includes it, unconditionally,
      // whether or not the user has ever put anything in it (see docs/
      // schema-legs.md-style history: it predates the categories-as-lists
      // feature by a few hours and was never reconciled with it). Hide it
      // from the chip strip specifically - not from the data, not from
      // editListSelect/bulkMoveTarget/addItemCategorySelect, which are
      // "pick a destination" contexts where an empty-but-real target is
      // still legitimate to offer - when it has neither real items nor an
      // explicit listMeta entry (the latter can't actually happen through
      // any UI path today - rename is blocked for main - but checked
      // anyway rather than assumed impossible).
      const mainHasContent =
        Object.keys(items?.main || {}).length > 0;
      const mainHasExplicitMeta =
        !!(allPacking?.users?.[user?.uid]?.listMeta?.main);
      const hideMain = !mainHasContent && !mainHasExplicitMeta;

      // "all" is a valid activeList value (persisted like any other, see
      // below) but is never a real category, so it can never appear in
      // `ids` - the check has to special-case it explicitly, or a restored
      // "all" gets silently overwritten on every load. This is corrected
      // BEFORE building the chips below, not after (unlike the old
      // <select>, a chip's "active" look has to be baked into the HTML at
      // generation time - there's no equivalent of setting .value on an
      // already-populated element afterward).
      //
      // Falls back to "all", not "main": a stale/deleted category is one
      // reason activeList can be invalid, but "was on main, and main just
      // emptied out and got hidden" is a second, distinct one - `ids`
      // always contains "main" (it's a ghost, not a real gap), so the
      // naive "!ids.includes(activeList)" check alone would never catch
      // that second case, leaving no chip marked active and a blank list
      // with no visible explanation. "all" is always rendered and always
      // a sensible landing spot either way - not just a fallback, an
      // improvement over dumping someone on a list that might be empty.
      //
      // Deliberately not touching deleteList()'s own "activeList = main" -
      // renderMine() calls renderLists() immediately after any change that
      // reassigns activeList, so this one central check corrects it
      // regardless of which of the several call sites set it, the same
      // reasoning already used for why the localStorage save point below
      // lives here alone instead of being duplicated at each site.
      const activeListIsValid =
        activeList === "all" ||
        (ids.includes(activeList) && !(activeList === "main" && hideMain));

      if (!activeListIsValid) {
        activeList = "all";
      }

      const visibleIds = hideMain ? ids.filter(id => id !== "main") : ids;
      const chipIds = ["all", ...visibleIds];

      $("categoryChips").innerHTML =
        chipIds
          .map(id => {
            const label = id === "all" ? tr("הכל", "All") : listLabel(id);
            const isActive = id === activeList;

            return (
              `<button class="chip${isActive ? " active" : ""}" ` +
              `data-chip="${escapeHtml(id)}">` +
              `${escapeHtml(label)}</button>`
            );
          })
          .join("") +
        `<span class="category-chips-end-spacer" aria-hidden="true"></span>`;

      // Same reset as quick-picks needed (v4.13.1): swapping the strip's
      // content doesn't reset scroll position on its own, so switching
      // categories could leave it mid-scrolled from whatever the previous
      // set of chips happened to be.
      $("categoryChips").scrollLeft = 0;

      document
        .querySelectorAll("[data-chip]")
        .forEach(chip => {
          chip.onclick = () => {
            activeList = chip.dataset.chip;
            renderMine();
          };
        });

      updateCategoryChipsFade();

      // Single save point for all 7 places activeList gets reassigned
      // (list switch, create/duplicate/delete, ensureStarterLists, the
      // fallback above, moving an item to another list) - every one
      // of them ends up calling renderMine() -> renderLists(), either
      // directly or via the RTDB listener echoing the write back. Cheaper
      // and lower-risk than duplicating a save call at each site.
      try {
        localStorage.setItem(activeListKey, activeList);
      } catch (e) {}
    }

    // docs/schema-legs.md §5.1, step 6 - the destination filter select.
    // Mirrors renderLists()'s own validity-check-then-build shape above,
    // for the same reason: this is a second, independent axis over the
    // same items, not a variant of the category filter, so it gets its
    // own render function rather than being folded into that one.
    function renderLegFilter() {
      const select = $("legFilterSelect");

      // Single-leg trip - the control isn't disabled, it isn't rendered
      // at all (docs/schema-legs.md §5.1: "אפס שינוי"). window.isMultiLeg
      // is the same check already used throughout the legs work
      // (index.html, itinerary.html) - not a local reimplementation.
      if (!window.isMultiLeg(trip)) {
        select.classList.add("hidden");
        select.innerHTML = "";
        return;
      }

      const legs = window.getLegs(trip);

      // A leg that no longer exists (deleted/reordered in the admin
      // panel since this was saved) falls back to "all" - same reasoning
      // as activeList's own fallback above: a stale selection should
      // never leave the control silently pointing at nothing.
      const activeLegFilterIsValid =
        activeLegFilter === "all" ||
        legs.some(leg => leg.id === activeLegFilter);

      if (!activeLegFilterIsValid) {
        activeLegFilter = "all";
      }

      select.innerHTML =
        [{ id: "all", name: tr("כל היעדים", "All destinations") }, ...legs]
          .map(leg =>
            `<option value="${escapeHtml(leg.id)}"` +
            `${leg.id === activeLegFilter ? " selected" : ""}>` +
            `${escapeHtml(leg.name || "")}</option>`
          )
          .join("");

      select.classList.remove("hidden");

      select.onchange = () => {
        activeLegFilter = select.value;
        resetAiSuggestions();
        renderMine();
      };

      // Same single-save-point reasoning as activeList's own persistence
      // above - every path that can change activeLegFilter ends up back
      // through renderMine() -> renderLegFilter().
      try {
        localStorage.setItem(activeLegFilterKey, activeLegFilter);
      } catch (e) {}
    }

    function updateCategoryChipsFade() {
      const el = $("categoryChips");
      const hasMore = Math.abs(el.scrollLeft) + el.clientWidth < el.scrollWidth - 1;
      el.classList.toggle("has-more", hasMore);
    }

    // Shared by renderMine() (data/state-driven) and applyLanguage()
    // (language-driven) - two independent triggers that both need the
    // disabled state to stay in sync with activeList, not just with
    // whichever one happened to run more recently. Icon-only button, so
    // "why disabled" goes through title/aria-label like the rest of this
    // file's icon buttons - the same as themeBtn/homeTop elsewhere.
    function updateManageListBtnState() {
      const btn = $("manageListBtn");
      const disabled = activeList === "all";
      const label = disabled
        ? tr("בחרו קטגוריה לניהול", "Choose a category to manage")
        : tr("ניהול רשימה", "Manage list");

      btn.disabled = disabled;
      btn.title = label;
      btn.setAttribute("aria-label", label);
    }

    // Same reasoning as updateManageListBtnState(), but the button has its
    // own visible text (not icon-only) - the explanation replaces that
    // text directly instead of going through title/aria-label, since a
    // hover-only tooltip is never discoverable on touch (see
    // setSelectionMode()'s own comment on the same limitation).
    function updateAiSuggestBtnState() {
      const btn = $("aiSuggestBtn");
      const disabled = activeList === "all";

      btn.disabled = disabled;
      btn.textContent = disabled
        ? tr("בחרו קטגוריה לקבלת הצעות AI", "Choose a category for AI suggestions")
        : tr("✨ הצע רשימה עם AI", "✨ Suggest a list with AI");
    }

    // Same source as currentItems() would give today (activeList only) -
    // this is step 2 of the filtered-list rework: every interactive
    // element below gets tagged with its item's categoryId (from
