(function() {
  var tripId = new URLSearchParams(location.search).get('tripId') || 'legacy';
  var cachedType = localStorage.getItem('trip-' + tripId + '-type') || 'abroad';
  var savedTheme = localStorage.getItem('trip-' + tripId + '-theme');
  var shouldStartDark =
    savedTheme === 'dark'
      ? true
      : savedTheme === 'light'
        ? false
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

  document.documentElement.classList.add('theme-' + cachedType);

  if (shouldStartDark) {
    document.documentElement.dataset.theme = 'dark';
  }
})();

function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}
function canManageEntry(entry){return user&&(entry.createdByUid===user.uid||trip.ownerId===user.uid)}
function doGoogleSignIn(){signInWithPopup(auth,provider).catch(error=>{if(['auth/popup-blocked','auth/popup-closed-by-user','auth/cancelled-popup-request','auth/web-storage-unsupported','auth/operation-not-supported-in-this-environment'].includes(error?.code)||/missing initial state/i.test(error?.message||'')){signInWithRedirect(auth,provider)}else{toast(error.message)}})}
getRedirectResult(auth).catch(error=>toast(error.message));
function applyTheme(){try{localStorage.setItem(`trip-${tripId||'legacy'}-type`,trip.tripType||'abroad')}catch(e){}document.documentElement.classList.remove('theme-abroad','theme-local','theme-camping','theme-reserve');document.documentElement.classList.add(`theme-${trip.tripType||'abroad'}`);const stored=localStorage.getItem(themeKey),systemDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches,shouldBeDark=stored==='dark'?true:stored==='light'?false:systemDark;if(shouldBeDark)document.documentElement.dataset.theme='dark';else delete document.documentElement.dataset.theme;$('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙'}
function pad2(n){return String(n).padStart(2,'0')}
function dateKey(d){return`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`}
function tripDayDates(){if(!trip.startAt||!trip.endAt)return[];const start=new Date(trip.startAt),end=new Date(trip.endAt);if(isNaN(start)||isNaN(end))return[];let cursor=new Date(start.getFullYear(),start.getMonth(),start.getDate());const endDay=new Date(end.getFullYear(),end.getMonth(),end.getDate());const days=[];let guard=0;while(cursor<=endDay&&guard<60){days.push(new Date(cursor));cursor.setDate(cursor.getDate()+1);guard++}return days}
function initials(name=''){return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?'}
function renderDayTabs(){const days=tripDayDates(),todayKey=dateKey(new Date());if(!days.length){$('dayTabs').innerHTML=`<div class="empty" style="width:100%"><b>🗓️</b>${tr('לא נמצאו תאריכי טיול תקינים כדי לבנות ימים.','No valid trip dates found to build days.')}</div>`;return}if(!activeDay||!days.some(d=>dateKey(d)===activeDay)){const todayInRange=days.find(d=>dateKey(d)===todayKey);activeDay=todayInRange?todayKey:dateKey(days[0])}$('dayTabs').innerHTML=days.map((d,i)=>{const key=dateKey(d),isActive=key===activeDay,isToday=key===todayKey,dateLabel=new Intl.DateTimeFormat(trip.language==='en'?'en-GB':'he-IL',{day:'numeric',month:'numeric'}).format(d);return`<button class="day-tab${isActive?' active':''}${isToday?' today':''}" data-day="${key}"><span class="day-num">${tr('יום','Day')} ${i+1}</span><span class="day-date">${dateLabel}</span></button>`}).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{activeDay=b.dataset.day;renderDayTabs();renderActivities()})}
function computeLiveActivityId(sortedArr){if(activeDay!==dateKey(new Date()))return null;const timed=sortedArr.filter(x=>x.time);if(!timed.length)return null;const now=new Date(),nowHHMM=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;let liveId=null;for(const act of timed){if(act.time<=nowHHMM)liveId=act.id;else break}return liveId}
function renderActivities(){const dayData=itineraryDays[activeDay]?.activities||{};const arr=Object.entries(dayData).map(([id,x])=>({id,...x})).sort((a,b)=>{if(a.time&&b.time)return a.time.localeCompare(b.time);if(a.time)return -1;if(b.time)return 1;return(a.createdAt||0)-(b.createdAt||0)});const liveId=computeLiveActivityId(arr);$('activitiesList').innerHTML=arr.length?arr.map(x=>{const joiners=Object.keys(x.joiners||{}),iJoined=user&&x.joiners&&x.joiners[user.uid],joinerNames=joiners.map(uid=>x.joinerNames?.[uid]||'').filter(Boolean),isLive=x.id===liveId;return`<article class="activity-card${isLive?' live-now':''}">${isLive?`<span class="live-badge"><span class="live-dot"></span>${tr('קורה עכשיו','Happening now')}</span>`:''}<div class="activity-time${x.time?'':' notime'}">${x.time?escapeHtml(x.time):tr('גמיש','Flexible')}</div><div class="activity-body"><h3>${escapeHtml(x.title)}</h3><p>${escapeHtml(x.note||'')}</p><div class="activity-owner">${tr('נוסף ע״י','Added by')} ${escapeHtml(x.ownerName||'')}</div>${joiners.length?`<div class="joiners-row"><div class="joiner-avatars">${joinerNames.slice(0,4).map(n=>`<span class="joiner-avatar">${escapeHtml(initials(n))}</span>`).join('')}</div><span class="joiners-count">${joiners.length} ${tr('מגיעים','joining')}</span></div>`:''}<div class="card-actions"><button class="action join${iJoined?' joined':''}" data-join="${x.id}">${iJoined?tr('✓ אני בא/ה','✓ I\'m in'):tr('+ אני בא/ה',"+ I'm in")}</button>${canManageEntry(x)?`<button class="action" data-edit-activity="${x.id}">${tr('עריכה','Edit')}</button><button class="action danger" data-delete-activity="${x.id}">${tr('מחיקה','Delete')}</button>`:''}</div></div></article>`}).join(''):`<div class="empty"><b>🗓️</b>${tr('אין עדיין פעילויות ליום הזה. הוסיפו אחת עם כפתור ה-+','No activities for this day yet. Add one with the + button')}</div>`;document.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>toggleJoin(b.dataset.join));document.querySelectorAll('[data-edit-activity]').forEach(b=>b.onclick=()=>openActivityForm(b.dataset.editActivity));document.querySelectorAll('[data-delete-activity]').forEach(b=>b.onclick=()=>deleteActivity(b.dataset.deleteActivity))}
async function toggleJoin(id){if(!user||!profile)return toast(tr('בחרו קודם שם','Choose your name first'));const activity=itineraryDays[activeDay]?.activities?.[id];if(!activity)return;const base=`${root}/itinerary/days/${activeDay}/activities/${id}`;if(activity.joiners&&activity.joiners[user.uid]){await remove(ref(db,`${base}/joiners/${user.uid}`));await remove(ref(db,`${base}/joinerNames/${user.uid}`))}else{await set(ref(db,`${base}/joiners/${user.uid}`),true);await set(ref(db,`${base}/joinerNames/${user.uid}`),profile.name)}}
function populatePlacesDatalist(){const names=Object.values(savedPlaces).map(p=>p.name).filter(Boolean);$('placesDatalist').innerHTML=[...new Set(names)].map(n=>`<option value="${escapeHtml(n)}">`).join('')}
function fillNoteFromMatchingPlace(){const title=$('activityTitle').value.trim();if(!title)return;const match=Object.values(savedPlaces).find(p=>p.name?.trim().toLocaleLowerCase()===title.toLocaleLowerCase());if(match&&match.note&&!$('activityNote').value.trim()){$('activityNote').value=match.note}}
function openActivityForm(id){editingActivityId=id||null;const x=id?itineraryDays[activeDay]?.activities?.[id]:null;$('activityTime').value=x?.time||'';$('activityTitle').value=x?.title||'';$('activityNote').value=x?.note||'';$('activityModalTitle').textContent=id?tr('עריכת פעילות','Edit activity'):tr('הוספת פעילות','Add activity');$('saveActivity').textContent=id?tr('עדכון','Update'):tr('שמירה','Save');$('activityOverlay').classList.remove('hidden')}
async function saveActivity(){const title=$('activityTitle').value.trim();if(!title)return toast(tr('יש להזין כותרת לפעילות','Enter an activity title'));if(!activeDay)return;const fields={title,time:$('activityTime').value||'',note:$('activityNote').value.trim()};if(editingActivityId){await update(ref(db,`${root}/itinerary/days/${activeDay}/activities/${editingActivityId}`),fields)}else{await push(ref(db,`${root}/itinerary/days/${activeDay}/activities`),{...fields,ownerName:profile.name,createdByUid:user.uid,createdAt:Date.now()})}$('activityOverlay').classList.add('hidden');editingActivityId=null}
async function deleteActivity(id){if(!activeDay)return;if(!(await customConfirm(tr('למחוק את הפעילות?','Delete this activity?'),{danger:true})))return;await remove(ref(db,`${root}/itinerary/days/${activeDay}/activities/${id}`))}
function participantKey(name){const bytes=new TextEncoder().encode(String(name).trim());let raw='';bytes.forEach(b=>raw+=String.fromCharCode(b));return btoa(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function profileOptions(){const names=Array.isArray(trip.participants)?trip.participants:[],claims=trip.participantClaims||{};$('memberSelect').innerHTML=`<option value="">${tr('בחר/י שם…','Choose a name…')}</option>`+names.map((n,i)=>{const taken=claims[participantKey(n)]&&claims[participantKey(n)]!==user?.uid;return`<option value="${i}" ${taken?'disabled':''}>${escapeHtml(n)}${taken?` — ${tr('כבר משויך','already linked')}`:''}</option>`}).join('')}
async function saveProfile(){if(!user||profile)return;const name=(trip.participants||[])[Number($('memberSelect').value)];if(!name)return toast(tr('יש לבחור שם','Choose a name'));const key=participantKey(name),claimRef=ref(db,`${root}/participantClaims/${key}`);try{const result=await runTransaction(claimRef,current=>current===null||current===user.uid?user.uid:undefined,{applyLocally:false});if(!result.committed||result.snapshot.val()!==user.uid)return toast(tr('השם הזה כבר שויך למשתתף אחר','This name is already linked to another participant'));const nextProfile={name,participantKey:key,email:user.email||'',photoURL:user.photoURL||'',updatedAt:Date.now()};try{await set(ref(db,`${root}/memberProfiles/${user.uid}`),nextProfile)}catch(error){await runTransaction(claimRef,current=>current===user.uid?null:current,{applyLocally:false});throw error}profile=nextProfile;$('memberOverlay').classList.add('hidden');$('userChip').textContent=`${profile.name} · ${user.displayName||''}`}catch(error){console.error(error);toast(tr('לא ניתן היה לשייך את השם. נסו שוב.','Could not link the name. Please try again.'))}}
async function loadProfile(){const s=await get(ref(db,`${root}/memberProfiles/${user.uid}`));profile=s.val();profileOptions();if(!profile)$('memberOverlay').classList.remove('hidden');else $('userChip').textContent=`${profile.name} · ${user.displayName||''}`}
function configureLinks(){['Home','Packing','Shopping','Places','Itinerary'].forEach(n=>{const el=$(`nav${n}`);el.href=scoped(el.getAttribute('href').split('?')[0])});$('homeTop').href=scoped('index.html');const expensesEl=$('navExpenses');if(trip.spliitUrl){expensesEl.href=trip.spliitUrl;expensesEl.target='_blank';expensesEl.rel='noopener';expensesEl.onclick=null}else{expensesEl.href='#';expensesEl.removeAttribute('target');expensesEl.onclick=e=>{e.preventDefault();toast(tr('המארגן עדיין לא הוסיף קישור להתחשבנות - ניתן להוסיף מדף הבית','The organizer hasn\'t added an expenses link yet - it can be added from the home page'))}}document.querySelectorAll('[data-feature]').forEach(el=>{if(el.dataset.feature==='itinerary')return;el.style.display=trip.features?.[el.dataset.feature]===false?'none':'flex'})}
function applyLanguage(){const en=trip.language==='en';document.documentElement.lang=en?'en':'he';document.documentElement.dir=en?'ltr':'rtl';document.title=`${tr('תוכנית יומית','Itinerary')} • ${trip.destination||''}`;$('destination').textContent=trip.destination||tr('הטיול שלנו','Our trip');$('title').textContent=tr('תוכנית יומית 🗓️','Itinerary 🗓️');$('loginTitle').textContent=tr('כניסה לטיול','Trip sign-in');$('loginText').textContent=tr('כדי לתכנן ולהצטרף לפעילויות יש להתחבר באמצעות Google.','Sign in with Google to plan and join activities.');$('googleBtn').innerHTML=`G&nbsp;&nbsp; ${tr('כניסה עם Google','Continue with Google')}`;$('memberTitle').textContent=tr('מי את/ה בקבוצה?','Who are you in the group?');$('memberText').textContent=tr('בחרו את השם שהמארגן הוסיף לטיול.','Choose the name added by the organizer.');$('saveMemberBtn').textContent=tr('זה אני','This is me');$('timeLabel').textContent=tr('שעה (אופציונלי)','Time (optional)');$('activityTitleLabel').textContent=tr('מה עושים?','What are you doing?');$('activityNoteLabel').textContent=tr('הערה','Note');$('cancelActivity').textContent=tr('ביטול','Cancel');$('activityModalTitle').textContent=editingActivityId?tr('עריכת פעילות','Edit activity'):tr('הוספת פעילות','Add activity');$('saveActivity').textContent=editingActivityId?tr('עדכון','Update'):tr('שמירה','Save');[['navHome','בית','Home'],['navPacking','ציוד','Packing'],['navShopping','קניות','Shopping'],['navPlaces','מקומות','Places'],['navItinerary','תוכנית','Plan'],['navExpenses','הוצאות','Expenses']].forEach(([id,he,en])=>$(id).querySelector('span').textContent=tr(he,en));renderDayTabs();renderActivities()}
function listen(){if(stopTrip)stopTrip();stopTrip=onValue(ref(db,root),s=>{if(!s.exists())return toast(tr('הטיול לא נמצא','Trip not found'));trip=s.val();try{localStorage.setItem(langKey,trip.language||'he')}catch(e){}itineraryDays=trip.itinerary?.days||{};savedPlaces=trip.places?.items||{};populatePlacesDatalist();applyTheme();applyLanguage();configureLinks();profileOptions();if(user)loadProfile()},()=>{stopTrip=null;toast(tr('לא ניתן לטעון את הטיול','Could not load the trip'))})}
$('googleBtn').onclick=doGoogleSignIn;$('themeBtn').onclick=()=>{localStorage.setItem(themeKey,document.documentElement.dataset.theme==='dark'?'light':'dark');applyTheme()};$('saveMemberBtn').onclick=saveProfile;$('fab').onclick=()=>{if(!profile)return toast(tr('בחרו קודם שם','Choose your name first'));openActivityForm(null)};$('saveActivity').onclick=saveActivity;$('activityTitle').addEventListener('change',fillNoteFromMatchingPlace);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$(b.dataset.close).classList.add('hidden');editingActivityId=null});$('activityOverlay').onclick=e=>{if(e.target.id==='activityOverlay')$('cancelActivity').click()};
onAuthStateChanged(auth,u=>{user=u;$('authLoading').classList.add('hidden');$('loginOverlay').classList.toggle('hidden',!!u);if(u){$('userChip').textContent=u.displayName||u.email||'';if(root)listen();else toast('Missing tripId')}else{profile=null;if(stopTrip){stopTrip();stopTrip=null}$('memberOverlay').classList.add('hidden')}});
let lastLiveActivityId;setInterval(()=>{if(!activeDay)return;const dayData=itineraryDays[activeDay]?.activities||{},arr=Object.entries(dayData).map(([id,x])=>({id,...x})),liveId=computeLiveActivityId(arr);if(liveId!==lastLiveActivityId){lastLiveActivityId=liveId;renderActivities()}},60000);
</script>
