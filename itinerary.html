<script>
(function() {
  var tripId = new URLSearchParams(location.search).get('tripId') || 'legacy';
  var cachedType = localStorage.getItem('trip-' + tripId + '-type') || 'abroad';
  var savedTheme = localStorage.getItem('trip-' + tripId + '-theme');

  var cachedName = localStorage.getItem('trip-' + tripId + '-name');

  // Called by a tiny inline script right after the header markup, so the real
  // trip name is already in the DOM at first paint instead of the placeholder.
  window.showTripName = function (elementId) {
    var el = cachedName && document.getElementById(elementId);
    if (el) el.textContent = cachedName;
  };
  var shouldStartDark =
    savedTheme === 'dark'
      ? true
      : savedTheme === 'light'
        ? false
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

  document.documentElement.classList.add('theme-' + cachedType);

  if (shouldStartDark) {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>

// 1 hour is the near-universal default every mainstream calendar app
// (Google Calendar, Outlook, Apple Calendar) already uses for a new
// quick-added event - not a GitTrip-specific guess. There is no UI hint
// anywhere in this page to draw a different number from: activities
// render as a flat time-sorted list (renderActivities above), each row a
// fixed-size card with a point-in-time label, never a timeline/calendar
// grid with proportional-width blocks - so there's no existing signal
// about expected length to match.
const ICS_DEFAULT_DURATION_MS=60*60*1000;

// dayKey's leg (and its timezone) is looked up here, NOT via
// getLegForDate(trip, date) - that function is instant-based and can
// land on the wrong leg near a boundary when the viewer's own device
// timezone differs from the leg's (documented in legs.js, caught with a
// real Rome/Bangkok fixture). tripDayDates() exists specifically to
// avoid that - it compares "YYYY-MM-DD" day-key strings, each computed
// in that leg's OWN timezone, sidestepping the instant entirely. Reuse
// it here rather than re-deriving the leg a second, different way.
function timezoneForDay(dayKey){const days=window.tripDayDates(trip,tripId);const match=days.find(d=>dateKey(d.date)===dayKey);return match?.leg?.timezone||null}

// RFC 5545 TEXT value escaping - backslash, comma, semicolon, and
// newlines all need escaping in SUMMARY/DESCRIPTION or a strict parser
// can misread the value as ending early or splitting a list.
function icsEscape(value){return String(value||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}

function icsUtcStamp(date){return date.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z')}

// The ONE place a VEVENT block gets built - exportActivityToIcs (single
// activity, never RSVP-filtered) and exportDayToIcs (a whole day,
// RSVP-filtered) both call this in a loop rather than each building
// their own VEVENT text. Two independent copies of "how a VEVENT is
// formatted" is exactly the failure class already documented repeatedly
// in this app (docs/architecture.md §8 - three separate scopedTripUrl
// implementations, three separate empty-state definitions) - one
// silently drifting from the other while looking equivalent. Do not add
// a second formatter here even for a seemingly-trivial variant.
function buildIcsEvent({id,title,note,dayKey,time,timezone}){const stamp=icsUtcStamp(new Date());const lines=['BEGIN:VEVENT',`UID:${id}@gittrip.app`,`DTSTAMP:${stamp}`];if(time&&timezone){const start=window.localInputToUtcInZone(`${dayKey}T${time}`,timezone);const end=new Date(start.getTime()+ICS_DEFAULT_DURATION_MS);lines.push(`DTSTART:${icsUtcStamp(start)}`);lines.push(`DTEND:${icsUtcStamp(end)}`)}else{
// No time at all (the "גמיש"/Flexible case) - or a day whose leg
// couldn't be resolved (shouldn't happen for a real activity, but no
// timezone to convert with either way. Rendered as an all-day event
// (VALUE=DATE, no time component) rather than skipped - decided
// explicitly: skipping it silently is exactly the "looks complete but
// isn't" failure this whole export feature exists to avoid for the
// user's own calendar. RFC 5545 defaults an all-day event's duration to
// one day when DTEND is omitted, so no DTEND line is needed here.
lines.push(`DTSTART;VALUE=DATE:${dayKey.replace(/-/g,'')}`)}lines.push(`SUMMARY:${icsEscape(title)}`);if(note)lines.push(`DESCRIPTION:${icsEscape(note)}`);lines.push('END:VEVENT');return lines}

function buildIcsCalendar(events){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GitTrip//Itinerary Export//HE','CALSCALE:GREGORIAN'];events.forEach(ev=>lines.push(...buildIcsEvent(ev)));lines.push('END:VCALENDAR');return lines.join('\r\n')}

function downloadIcsFile(content,filenameHint){const blob=new Blob([content],{type:'text/calendar;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`${(filenameHint||'itinerary').replace(/[^\w\-א-ת ]+/g,'').trim().replace(/\s+/g,'-')||'itinerary'}.ics`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}

// Always exports, regardless of RSVP - the user picked this one activity
// explicitly from its own menu, unlike exportDayToIcs's whole-day scope
// below (which filters to what they're actually attending).
function exportActivityToIcs(id){if(!activeDay)return;const activity=itineraryDays[activeDay]?.activities?.[id];if(!activity)return;const timezone=timezoneForDay(activeDay);const ics=buildIcsCalendar([{id,title:activity.title,note:activity.note,dayKey:activeDay,time:activity.time,timezone}]);downloadIcsFile(ics,activity.title)}

// RSVP-filtered by design (decided explicitly, not the single-activity
// export's scope) - only activities the current user marked "אני בא/ה"
// on. exportDayBtn is already disabled when this would be empty
// (renderActivities above), but guarded here too in case it's ever
// triggered another way.
function exportDayToIcs(){if(!activeDay||!user)return;const dayData=itineraryDays[activeDay]?.activities||{};const timezone=timezoneForDay(activeDay);const entries=Object.entries(dayData).filter(([,x])=>x.joiners&&x.joiners[user.uid]);if(!entries.length)return;const events=entries.map(([id,x])=>({id,title:x.title,note:x.note,dayKey:activeDay,time:x.time,timezone}));downloadIcsFile(buildIcsCalendar(events),`itinerary-${activeDay}`)}
// docs/roadmap.md part 3 item 0, commit ב - no name-picker gate for a
// first-time joiner. loadProfile() below auto-registers from Google
// identity instead (member.js, shared with index.html/packing.html/
// places.html) - participantKey/profileOptions/saveProfile (the closed-
// roster #memberSelect flow) are gone, not frozen. member.js computes
// the claim key internally now (uid-based, not name-based - see its own
// comment), so this file never needs to call window.participantKey.
// docs/roadmap.md part 3 item 0, commit ב - the "no profile yet" branch
// used to reveal #memberOverlay; there's nothing left to reveal now, so
// both the timeout and the auto-register-failure branches below show a
// toast instead - a stuck/failed join needs to be noisy, not a silent
// dead end with no explanation.
async function loadProfile(){if(profileLoadTimer)clearTimeout(profileLoadTimer);const gen=++profileLoadGen;let resolved=false;const timer=setTimeout(()=>{if(resolved)return;resolved=true;if(gen!==profileLoadGen)return;console.warn('loadProfile timed out after 8s on itinerary.html - treating as no profile');window.__gtProfileTimeout={page:'itinerary.html',at:Date.now()};profile=null;toast(tr('לא ניתן היה לטעון את הפרופיל שלך. רעננו ונסו שוב.','Couldn\'t load your profile. Refresh and try again.'))},8000);profileLoadTimer=timer;try{const s=await get(ref(db,`${root}/memberProfiles/${user.uid}`));if(resolved)return;resolved=true;clearTimeout(timer);if(gen!==profileLoadGen)return;profile=s.val();if(!profile&&window.autoRegisterMember){try{profile=await window.autoRegisterMember({uid:user.uid,displayName:user.displayName,email:user.email,photoURL:user.photoURL,fallbackName:tr('משתתף','Traveler'),tryClaim:(key,uid)=>runTransaction(ref(db,`${root}/participantClaims/${key}`),current=>current===null||current===uid?uid:undefined,{applyLocally:false}).then(result=>Boolean(result.committed)&&result.snapshot.val()===uid),writeProfile:fields=>set(ref(db,`${root}/memberProfiles/${user.uid}`),fields),rollbackClaim:(key,uid)=>runTransaction(ref(db,`${root}/participantClaims/${key}`),current=>current===uid?null:current,{applyLocally:false})});if(gen!==profileLoadGen)return;update(ref(db),{[`users/${user.uid}/trips/${tripId}`]:{destination:window.getPrimaryLeg(trip).name||'',...(trip.tripTitle?{tripTitle:trip.tripTitle}:{}),tripType:trip.tripType||'',language:trip.language||'he',startAt:trip.startAt||null,endAt:window.getLastLeg(trip).endAt||null,createdAt:trip.createdAt||Date.now()}}).catch(error=>console.error("Could not record trip under user's trip list:",error))}catch(error){console.error('[itinerary.html] loadProfile: auto-register failed',error);profile=null;toast(tr('לא ניתן היה להצטרף לטיול. רעננו ונסו שוב.','Couldn\'t join the trip. Refresh and try again.'))}}if(profile)$('userChip').textContent=profile.name||''}catch(error){if(resolved)return;resolved=true;clearTimeout(timer);if(gen!==profileLoadGen)return;console.warn('loadProfile failed on itinerary.html - treating as no profile',error);window.__gtProfileTimeout={page:'itinerary.html',at:Date.now()};profile=null;toast(tr('לא ניתן היה לטעון את הפרופיל שלך. רעננו ונסו שוב.','Couldn\'t load your profile. Refresh and try again.'))}}
function configureLinks(){['Home','Packing','Shopping','Places','Itinerary'].forEach(n=>{const el=$(`nav${n}`);el.href=scoped(el.getAttribute('href').split('?')[0])});$('homeTop').href=scoped('index.html');const expensesEl=$('navExpenses');if(trip.spliitUrl){expensesEl.href=trip.spliitUrl;expensesEl.target='_blank';expensesEl.rel='noopener';expensesEl.onclick=null}else{expensesEl.href='#';expensesEl.removeAttribute('target');expensesEl.onclick=e=>{e.preventDefault();if(window.isOrganizer(user,trip.ownerId)){const overlay=document.createElement('div');overlay.className='custom-dialog-overlay';overlay.innerHTML='<div class="custom-dialog-card"><div class="custom-dialog-brand">✈️ GitTrip</div><p class="custom-dialog-message">'+tr('עדיין לא הוספתם קישור להתחשבנות - ','You haven\'t added an expenses link yet - ')+'<a href="'+scoped('index.html')+'" style="color:var(--primary);font-weight:700">'+tr('לחצו כאן','click here')+'</a>'+tr(' כדי לחזור לדף הבית ולהוסיף.',' to go back to the home page and add one.')+'</p><div class="custom-dialog-actions"><button class="custom-dialog-btn confirm">'+tr('הבנתי','OK')+'</button></div></div>';document.body.appendChild(overlay);const cleanup=()=>overlay.remove();overlay.querySelector('button').onclick=cleanup;overlay.onclick=e=>{if(e.target===overlay)cleanup()}}else{toast(tr('המארגן עדיין לא הוסיף קישור להתחשבנות - ניתן להוסיף מדף הבית','The organizer hasn\'t added an expenses link yet - it can be added from the home page'))}}}document.querySelectorAll('[data-feature]').forEach(el=>{if(el.dataset.feature==='itinerary')return;el.style.display=trip.features?.[el.dataset.feature]===false?'none':'flex'})}
function applyLanguage(){const en=trip.language==='en';document.documentElement.lang=en?'en':'he';document.documentElement.dir=en?'ltr':'rtl';document.title=`${tr('תוכנית יומית','Itinerary')} • ${trip.tripTitle||window.getPrimaryLeg(trip).name||''}`;if(trip.tripTitle||window.getPrimaryLeg(trip).name||tripDataLoaded)$('destination').textContent=trip.tripTitle||window.getPrimaryLeg(trip).name||tr('הטיול שלנו','Our trip');$('title').textContent=tr('תוכנית יומית 🗓️','Itinerary 🗓️');$('loginTitle').textContent=tr('כניסה לטיול','Trip sign-in');$('loginText').textContent=tr('כדי לתכנן ולהצטרף לפעילויות יש להתחבר באמצעות Google.','Sign in with Google to plan and join activities.');$('googleBtn').innerHTML=`G&nbsp;&nbsp; ${tr('כניסה עם Google','Continue with Google')}`;$('timeLabel').textContent=tr('שעה (אופציונלי)','Time (optional)');$('activityTitleLabel').textContent=tr('מה עושים?','What are you doing?');$('activityNoteLabel').textContent=tr('הערה','Note');$('cancelActivity').textContent=tr('ביטול','Cancel');$('activityModalTitle').textContent=editingActivityId?tr('עריכת פעילות','Edit activity'):tr('הוספת פעילות','Add activity');$('saveActivity').textContent=editingActivityId?tr('עדכון','Update'):tr('שמירה','Save');$('exportDayBtn').textContent=tr('📅 ייצוא היום ליומן','📅 Export today to calendar');$('itineraryTab').textContent=tr('תוכנית יומית','Itinerary');$('placesTab').textContent=tr('מקומות','Places');$('mapTab').textContent=tr('מפה','Map');$('search').placeholder=tr('חיפוש מקום...','Search places...');$('legFilterSelect').setAttribute('aria-label',tr('סינון לפי יעד','Filter by destination'));$('placeNameLabel').textContent=tr('שם המקום','Place name');$('categoryLabel').textContent=tr('קטגוריה','Category');$('placeLegLabel').textContent=tr('יעד','Destination');$('mapLabel').textContent=tr('קישור Google Maps','Google Maps link');$('noteLabel').textContent=tr('הערה','Note');$('suggestPlacesBtn').textContent=tr('✨ הצע מקומות עם AI','✨ Suggest places with AI');$('cancelPlace').textContent=tr('ביטול','Cancel');$('savePlace').textContent=editingPlaceId?tr('עדכון','Update'):tr('שמירה','Save');$('placeModalTitle').textContent=editingPlaceId?tr('עריכת מקום','Edit place'):tr('הוספת מקום','Add a place');$('dayPickerTitle').textContent=tr('הוספה לתוכנית היומית','Add to daily itinerary');$('dayPickerSubtitle').textContent=tr('לאיזה יום להוסיף?','Which day to add it to?');$('cancelDayPicker').textContent=tr('ביטול','Cancel');$('placeCategory').innerHTML=categories().map(x=>`<option>${escapeHtml(x)}</option>`).join('');updateFab();[['navHome','בית','Home'],['navPacking','ציוד','Packing'],['navShopping','קניות','Shopping'],['navPlaces','זיכרונות','Memories'],['navItinerary','תוכנית','Plan'],['navExpenses','הוצאות','Expenses']].forEach(([id,he,en])=>$(id).querySelector('span').textContent=tr(he,en));renderDayTabs();renderActivities();renderPlaces();renderMap()}
// places-into-itinerary merge, commit 3/5 - FAB hidden on "map" again (no
// add-action there), same reasoning as places.html - back to that behavior
// now that the map tab actually exists (commit 2 deliberately never hid it,
// since both its tabs had a real action then).
function updateFab(){const labels={itinerary:tr('הוספת פעילות','Add activity'),places:tr('הוספת מקום','Add place')};$('fab').setAttribute('aria-label',labels[tab]||tr('הוספה','Add'));$('fab').classList.toggle('hidden',tab==='map')}
function fabAction(){if(!profile)return toast(tr('בחרו קודם שם','Choose your name first'));if(tab==='itinerary')openActivityForm(null);else if(tab==='places')openPlaceForm(null)}
function setTab(next){tab=next;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===next));['itinerary','places','map'].forEach(n=>$(`${n}View`).classList.toggle('hidden',n!==next));updateFab();if(next==='map')renderMap()}
function listen(){if(stopTrip)stopTrip();stopTrip=onValue(ref(db,root),s=>{if(!s.exists())return toast(tr('הטיול לא נמצא','Trip not found'));trip=s.val();tripDataLoaded=true;try{localStorage.setItem(langKey,trip.language||'he');localStorage.setItem('lastTripId',tripId)}catch(e){}itineraryDays=trip.itinerary?.days||{};places=trip.places?.items||{};populatePlacesDatalist();applyTheme();applyAccent();applyLanguage();configureLinks();if(user)loadProfile()},()=>{stopTrip=null;toast(tr('לא ניתן לטעון את הטיול','Could not load the trip'))})}
$('googleBtn').onclick=doGoogleSignIn;$('themeBtn').onclick=()=>{localStorage.setItem(themeKey,document.documentElement.dataset.theme==='dark'?'light':'dark');applyTheme()};$('fab').onclick=fabAction;$('saveActivity').onclick=saveActivity;$('exportDayBtn').onclick=exportDayToIcs;$('activityTitle').addEventListener('change',fillNoteFromMatchingPlace);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$(b.dataset.close).classList.add('hidden');editingActivityId=null;if(b.dataset.close==='placeOverlay')editingPlaceId=null});$('activityOverlay').onclick=e=>{if(e.target.id==='activityOverlay')$('cancelActivity').click()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('savePlace').onclick=savePlace;$('suggestPlacesBtn').onclick=()=>requestPlaceSuggestions($('suggestPlacesBtn'));$('placeLeg').onchange=()=>refreshPlaceCategoryOptions();$('search').oninput=renderPlaces;$('placeOverlay').onclick=e=>{if(e.target.id==='placeOverlay')$('cancelPlace').click()};$('cancelDayPicker').onclick=()=>{$('dayPickerOverlay').classList.add('hidden');dayPickerPlaceId=null};$('dayPickerOverlay').onclick=e=>{if(e.target.id==='dayPickerOverlay')$('cancelDayPicker').click()};
// wasSignedOut captured BEFORE user=u below - see index.html's own
// handleAuthStateChanged for the full reasoning (same trigger point).
function handleAuthStateChanged(u){const wasSignedOut=!user;user=u;if(wasSignedOut&&u)logSignInEvent(u);$('authLoading').classList.add('hidden');$('loginOverlay').classList.toggle('hidden',!!u);if(u){$('userChip').textContent=u.displayName||u.email||'';if(root)listen();else toast('Missing tripId')}else{profile=null;if(stopTrip){stopTrip();stopTrip=null}}}
onAuthStateChanged(auth,handleAuthStateChanged);
if(window.armAuthGate)window.armAuthGate(()=>{if(auth.currentUser)handleAuthStateChanged(auth.currentUser)});
let lastLiveActivityId;setInterval(()=>{if(!activeDay)return;const dayData=itineraryDays[activeDay]?.activities||{},arr=Object.entries(dayData).map(([id,x])=>({id,...x})),liveId=computeLiveActivityId(arr);if(liveId!==lastLiveActivityId){lastLiveActivityId=liveId;renderActivities()}},60000);
