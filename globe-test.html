<!DOCTYPE html>
<!--
  globe.gl mobile-performance prototype - throwaway test page, not linked
  from anywhere in the real app (no hamburger menu entry, no index.html
  reference). Manual-URL access only. Deliberately isolated: does not load
  any of this repo's shared scripts (version.js/legs.js/etc) and does not
  touch any existing file.

  Purpose: measure real FPS on mobile with the specific combination the
  gamification investigation flagged as the risky one - globe + choropleth
  polygon layer + atmosphere halo, together - not to build the real feature.

  Loading strategy (deliberately dynamic, not static <script src=...> and
  not a top-level `import Globe from '...'`): globe.gl and topojson-client
  are both fetched via the dynamic import() operator inside an async IIFE
  below, so this page's own Network tab shows whether "only loaded on this
  page" code-splitting actually behaves the way it should - not just in
  theory.

  Texture: self-hosted (globe-test-assets/, this repo), not the original
  unpkg URL - that redirect chain sent no Timing-Allow-Origin at all,
  which is why the first version of this page could never measure its
  real size in-page. Served as AVIF/WebP/JPEG (same 4096x2048 resolution
  throughout, no downscaling) with real in-JS format detection (globe.gl's
  texture goes through Three.js's TextureLoader, not an <img>, so there's
  no <picture> element to delegate this to). Loads a tiny blurred
  placeholder first, swaps to the full-resolution best-supported format
  once it's finished downloading in the background.

  Cache-control for globe-test-assets/**, in firebase.json: 1 year +
  immutable (JSON has no comments, so the reasoning lives here instead) -
  deliberately much longer than the 5-minute Cache-Control the 6 real app
  pages got earlier, because these specific files only change if someone
  physically replaces them, unlike a page's HTML. The real tradeoff: if
  any of these exact filenames ARE ever overwritten with different bytes
  in the future, browsers/CDN edges that already cached the old version
  won't see the new one for up to a year. Safe for a static, unchanging
  texture; the fix if it's ever swapped is to rename the file (e.g.
  earth-blue-marble-v2.avif), not overwrite the same name.
-->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>globe.gl perf test</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, system-ui, sans-serif;
  }

  #globeContainer {
    width: 100%;
    height: 100%;
  }

  #hud {
    position: fixed;
    top: 8px;
    inset-inline-start: 8px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.65);
    color: #0f0;
    font: 700 20px/1.3 "SF Mono", Consolas, monospace;
    padding: 8px 12px;
    border-radius: 8px;
    pointer-events: none;
    direction: ltr;
    text-align: left;
  }

  #hud .label {
    color: #8f8;
    font-size: 11px;
    font-weight: 400;
  }

  #report {
    position: fixed;
    bottom: 8px;
    inset-inline: 8px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.75);
    color: #ddd;
    font: 12px/1.5 "SF Mono", Consolas, monospace;
    padding: 10px 12px;
    border-radius: 8px;
    max-height: 40vh;
    overflow-y: auto;
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
  }

  #report .ok { color: #7f7; }
  #report .err { color: #f77; }
  #report .warn { color: #fd7; }
</style>
</head>
<body>

<div id="globeContainer"></div>

<div id="hud">
  <div class="label">FPS (live)</div>
  <div id="fpsValue">--</div>
</div>

<div id="report">Loading globe.gl + world-atlas via dynamic import()…</div>

<script>
(async function () {
  const reportEl = document.getElementById("report");
  const fpsValueEl = document.getElementById("fpsValue");

  function log(msg, cls) {
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = msg;
    reportEl.appendChild(line);
    reportEl.scrollTop = reportEl.scrollHeight;
  }

  // --- FPS counter: plain requestAnimationFrame loop, independent of
  // globe.gl's own internal render loop - this measures the page's real,
  // observed framerate (whatever is actually reaching the screen), not a
  // number reported from inside Three.js itself. Updates the visible
  // number twice a second so it's readable while dragging, not flickering
  // every single frame. ---
  (function startFpsCounter() {
    let frames = 0;
    let lastReportAt = performance.now();

    function tick(now) {
      frames++;
      const elapsed = now - lastReportAt;
      if (elapsed >= 500) {
        const fps = Math.round((frames * 1000) / elapsed);
        fpsValueEl.textContent = fps;
        fpsValueEl.style.color = fps >= 50 ? "#7f7" : fps >= 30 ? "#fd7" : "#f77";
        frames = 0;
        lastReportAt = now;
      }
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  })();

  // --- Real transfer-size measurement, not a theoretical guess. Reads the
  // Resource Timing entries for the exact URLs this page actually fetched.
  // transferSize is 0 for a cross-origin resource unless the server sends
  // Timing-Allow-Origin (jsdelivr does) - encodedBodySize is the fallback
  // when that's blocked, noted explicitly in the report so the number's
  // provenance is never silently ambiguous. ---
  function reportTransferSize(label, urlSubstring) {
    const entries = performance.getEntriesByType("resource")
      .filter(e => e.name.includes(urlSubstring));

    if (!entries.length) {
      log(`  ${label}: NOT FOUND in Resource Timing (check Network tab manually)`, "warn");
      return 0;
    }

    // A dynamically-imported ES module can pull in more than one network
    // request (the module itself plus anything it imports internally) -
    // sum everything matching, and say how many requests that covers.
    let total = 0;
    let usedFallback = false;

    entries.forEach(e => {
      if (e.transferSize > 0) {
        total += e.transferSize;
      } else {
        total += e.encodedBodySize;
        usedFallback = true;
      }
    });

    const kb = (total / 1024).toFixed(1);
    log(`  ${label}: ${kb} KB (${entries.length} request${entries.length > 1 ? "s" : ""}${usedFallback ? ", transferSize blocked - used encodedBodySize" : ""})`);
    return total;
  }

  let globeLibBytes = 0;
  let topoLibBytes = 0;
  let countriesDataBytes = 0;

  // --- Format negotiation for the texture (globe.gl's texture goes through
  // Three.js's own TextureLoader, not an <img>/<picture> element - a
  // <picture> element's browser-side format negotiation has no direct
  // equivalent here, so this reimplements the same idea in JS: feature-
  // detect AVIF/WebP by actually trying to decode a known-valid tiny test
  // image of each format (the standard, reliable technique - checking
  // canvas.toDataURL() encode support is NOT reliable for this, notably
  // Safari can decode/display AVIF for years before it could encode one
  // via canvas, which would make an encode-based test wrongly say "no"
  // on a browser that can actually show AVIF fine). Test images below
  // were generated and round-trip-verified locally (encoded then
  // re-decoded with sharp to confirm they're genuinely valid), not typed
  // from memory. ---
  const AVIF_TEST = "data:image/avif;base64,AAAAHGZ0eXBhdmlmAAAAAG1pZjFhdmlmbWlhZgAAANZtZXRhAAAAAAAAACFoZGxyAAAAAAAAAABwaWN0AAAAAAAAAAAAAAAAAAAAACJpbG9jAAAAAERAAAEAAQAAAAAA+gABAAAAAAAAACQAAAAjaWluZgAAAAAAAQAAABVpbmZlAgAAAAABAABhdjAxAAAAAA5waXRtAAAAAAABAAAAVmlwcnAAAAA4aXBjbwAAAAxhdjFDgSACAAAAABRpc3BlAAAAAAAAAAEAAAABAAAAEHBpeGkAAAAAAwgICAAAABZpcG1hAAAAAAAAAAEAAQOBAgMAAAAsbWRhdBIACgc4AAaQENBpMhcZQmMEwAA0AACQQMkcYUuNGtYQVLH7IA==";
  const WEBP_TEST = "data:image/webp;base64,UklGRjgAAABXRUJQVlA4ICwAAACQAQCdASoBAAEAAsBMJaACdLoAA5gA/u5DH+5sc4twV/9tD/9aH/60P+lAAA==";

  function canDecodeFormat(dataUri) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(img.naturalWidth > 0);
      img.onerror = () => resolve(false);
      img.src = dataUri;
    });
  }

  // Self-hosted now (globe-test-assets/, served by Firebase Hosting with a
  // long immutable cache - firebase.json) - not unpkg. unpkg's redirect
  // chain to the real image sent no Timing-Allow-Origin at all, which is
  // exactly why the ORIGINAL version of this page could never measure the
  // texture's real size in-page (silently read as 0 bytes). Same-origin
  // resources have no such restriction - transferSize should read
  // correctly below without the encodedBodySize fallback this page
  // needed for every cross-origin CDN resource.
  const TEXTURE_BASE = "globe-test-assets/earth-blue-marble";
  const PLACEHOLDER_URL = TEXTURE_BASE + "-placeholder.jpg";

  async function pickBestTextureFormat() {
    const [avifOk, webpOk] = await Promise.all([
      canDecodeFormat(AVIF_TEST),
      canDecodeFormat(WEBP_TEST)
    ]);

    if (avifOk) return { url: TEXTURE_BASE + ".avif", format: "AVIF" };
    if (webpOk) return { url: TEXTURE_BASE + ".webp", format: "WebP" };
    return { url: TEXTURE_BASE + ".jpg", format: "JPEG (fallback - no AVIF/WebP decode support detected)" };
  }

  // Preloads via a plain Image() + decode() BEFORE handing the URL to
  // globe.gl - this is what makes the swap a clean single moment instead
  // of the texture popping in progressively mid-download the way a bare
  // globeImageUrl(fullResUrl) would (Three.js would still show SOMETHING
  // as soon as enough bytes arrive, not necessarily complete/correct).
  function preloadImage(url) {
    const img = new Image();
    img.src = url;
    return img.decode().then(() => url);
  }

  try {
    log("Step 1/4: dynamic import() of globe.gl…");
    const t0 = performance.now();

    // Dynamic import only - never a static <script src> tag, never a
    // top-level `import Globe from '...'` declaration. This is the exact
    // thing being tested: does globe.gl actually stay out of every OTHER
    // page's bundle, loading only here, on demand.
    //
    // Loads the package's own pre-bundled UMD file (dist/globe.gl.min.js -
    // its package.json's own "unpkg"/"jsdelivr" field), NOT the jsdelivr
    // "+esm" transform endpoint - tried that first and it was actively
    // misleading for a bundle-size measurement: "+esm" doesn't serve
    // globe.gl's own bundle, it re-resolves three.js's ENTIRE internal
    // module graph live into 70+ separate small requests (confirmed via
    // Resource Timing - real count, not a guess). That's an artifact of
    // jsdelivr's on-the-fly ESM-ification of a package that ships bare
    // Node-style imports, not a property of globe.gl itself, and it would
    // have made the "measured bundle size" number meaningless. The UMD
    // file has no ESM exports, so it's imported here purely for its side
    // effect (attaching window.Globe) - dynamic import() still fetches
    // and executes any .js file as a module regardless of whether it
    // contains export statements, which is exactly the "one bundle,
    // loaded on demand" scenario a real implementation would actually ship.
    await import("https://cdn.jsdelivr.net/npm/globe.gl@2/dist/globe.gl.min.js");
    const Globe = window.Globe;

    log(`  loaded in ${(performance.now() - t0).toFixed(0)}ms`, "ok");

    log("Step 2/4: dynamic import() of topojson-client (to convert TopoJSON -> GeoJSON client-side)…");
    // Same reasoning - its own bundled dist file, side-effect import (attaches window.topojson).
    await import("https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js");
    const topoModule = window.topojson;

    log("Step 3/4: fetching world-atlas countries-110m.json (low-res TopoJSON, not GeoJSON)…");
    const topoRes = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
    if (!topoRes.ok) throw new Error(`countries-110m.json fetch failed: ${topoRes.status}`);
    const topology = await topoRes.json();

    // client-side TopoJSON -> GeoJSON conversion, chosen over a
    // preprocessing step per the task's own "pick whichever is simpler"
    // instruction - topojson-client is a single small dependency and this
    // is a one-line call, not worth a build step for a throwaway test page.
    const countries = topoModule.feature(topology, topology.objects.countries);

    log(`  ${countries.features.length} country polygons decoded`, "ok");

    log("Step 4/4: building the globe (choropleth polygons + atmosphere)…");

    // Placeholder first (542 bytes, self-hosted) - the globe renders
    // immediately with a recognizable-but-blurry earth instead of a blank
    // grey sphere while the real texture downloads in the background.
    // Quality of the FINAL texture is unaffected either way - this only
    // changes what's visible during the brief window before it's ready.
    const world = Globe()(document.getElementById("globeContainer"))
      .globeImageUrl(PLACEHOLDER_URL)
      .backgroundColor("#000")
      // Choropleth layer - uniform color for every country, no real visit
      // data needed for a performance test. altitude/transition kept
      // minimal but non-zero (0 would mean "not a choropleth at all",
      // which wouldn't represent the real feature's actual render cost).
      .polygonsData(countries.features)
      .polygonCapColor(() => "rgba(46, 204, 113, 0.65)")
      .polygonSideColor(() => "rgba(0, 0, 0, 0.15)")
      .polygonStrokeColor(() => "#111")
      .polygonAltitude(0.01)
      .polygonsTransitionDuration(0)
      // Atmosphere (halo) - explicitly on, per the task: this exact
      // combination (choropleth + atmosphere together) is the one flagged
      // as the real risk to measure, not either alone.
      .showAtmosphere(true)
      .atmosphereColor("#3a9bdc")
      .atmosphereAltitude(0.15);

    // No .polygonLabel(), no .labelsData(), no auto-rotate, no extra
    // layers - deliberately the minimal representative set, nothing more.

    window.addEventListener("resize", () => {
      world.width(window.innerWidth).height(window.innerHeight);
    });

    log("Globe built (placeholder texture). Rotate with a finger/mouse and watch the FPS counter (top-left).", "ok");

    // --- Progressive swap: pick the best format, preload it fully, then
    // hand it to globe.gl - wrapped in a brief dim/undim on the container
    // itself so the swap reads as a deliberate handoff, not a content pop.
    // This is a real limitation to flag, not silently glossed over: this
    // is NOT a true cross-fade between the two textures (that would need
    // custom shader/material blending in Three.js, real extra complexity
    // for a throwaway prototype) - it's a fast opacity dip timed around
    // the swap, which reads as "smooth" but is a simpler effect than an
    // actual blend. Good enough for this test; a real implementation
    // might want the genuine shader cross-fade if the pop still bothers
    // anyone once seen on a real device. ---
    let chosenFormat = null;
    pickBestTextureFormat()
      .then(choice => {
        chosenFormat = choice.format;
        log(`Best supported texture format detected: ${choice.format}. Preloading full-resolution texture in the background…`);
        return preloadImage(choice.url);
      })
      .then(fullUrl => {
        const container = document.getElementById("globeContainer");
        container.style.transition = "opacity 150ms ease";
        container.style.opacity = "0.55";

        setTimeout(() => {
          world.globeImageUrl(fullUrl);
          setTimeout(() => {
            container.style.opacity = "1";
          }, 60);
        }, 150);

        log(`Full-resolution texture (${chosenFormat}) swapped in.`, "ok");
      })
      .catch(err => {
        log(`Texture upgrade failed, staying on placeholder: ${err.message}`, "warn");
      });

    // 2500ms, not 1500 - now has to cover format-detection (2 tiny decodes)
    // AND the full-resolution preload finishing, not just static file
    // fetches. Still just a "probably done by now" wait, not a real
    // completion signal - see the note printed alongside the numbers.
    setTimeout(() => {
      log("");
      log("--- Bundle size report (measured, not estimated) ---");
      globeLibBytes = reportTransferSize("globe.gl (dynamic import)", "globe.gl");
      topoLibBytes = reportTransferSize("topojson-client (dynamic import)", "topojson-client");
      countriesDataBytes = reportTransferSize("countries-110m.json", "countries-110m.json");
      reportTransferSize("placeholder texture (LQIP, self-hosted)", "earth-blue-marble-placeholder");
      const textureBytes = reportTransferSize(
        `full-res texture actually loaded (${chosenFormat || "not yet swapped in - reload and wait a bit longer"}, self-hosted)`,
        chosenFormat === "AVIF" ? "earth-blue-marble.avif"
          : chosenFormat === "WebP" ? "earth-blue-marble.webp"
          : "earth-blue-marble.jpg"
      );

      const totalKb = ((globeLibBytes + topoLibBytes + countriesDataBytes + textureBytes) / 1024).toFixed(1);
      log(`  TOTAL (these 4 resources, this browser's actual download): ${totalKb} KB`, "ok");
      log("");
      log("Reference sizes for the OTHER texture formats this browser did NOT load (measured separately at conversion time, same 4096x2048 resolution, not re-verified over the wire here):");
      log("  JPEG (original):  1427.6 KB");
      log("  WebP (q82):        647.6 KB");
      log("  AVIF (q65):        644.8 KB");
      log("");
      log("Cross-check this against your browser's own Network tab (filter by this page's load) - the numbers above come from the Resource Timing API, same underlying data Chrome DevTools reads from, but verify independently before trusting it for a real capacity decision.", "warn");
    }, 2500);

  } catch (err) {
    log(`ERROR: ${err.message}`, "err");
    console.error(err);
  }
})();
</script>

</body>
</html>
