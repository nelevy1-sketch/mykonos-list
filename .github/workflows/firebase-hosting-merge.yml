# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
#
# version-history.json auto-regeneration added after the file - dashboard.html's
# version-history feature (achievements.html investigation, see CHANGELOG) needs
# scripts/generate-version-history.js re-run manually whenever CHANGELOG.md gains
# a version, or it goes stale. Automated here so a push to main that adds a
# version keeps it fresh without a manual step. Loop safety: the regenerate step
# only ever commits when the file's content actually changed (git diff --quiet),
# and that commit's message carries [skip ci] - GitHub's own push-trigger skip
# convention, not something this workflow implements itself - so the push this
# job makes never re-triggers this same workflow. The Firebase deploy step below
# runs unconditionally regardless of whether a commit happened - it deploys
# straight from the working tree's current files (firebase.json's hosting.public
# is ".", not a git ref), so the just-regenerated file ships on THIS run even
# when the [skip ci] commit means there's no second run to deploy it again.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (depth 1) clone -
          # scripts/generate-version-history.js's own git log -S (pickaxe,
          # content-based commit search - see that script's header for why
          # this is the only reliable way to date a CHANGELOG.md entry)
          # needs the complete commit history to find anything at all; on a
          # depth-1 checkout it would silently find zero matches for every
          # version older than the single most recent commit.
          fetch-depth: 0
      - name: Regenerate version-history.json
        run: node scripts/generate-version-history.js
      - name: Check whether version-history.json actually changed
        id: version_history_diff
        run: |
          if git diff --quiet -- version-history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push version-history.json if it changed
        if: steps.version_history_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version-history.json
          git commit -m "version-history.json: עדכון אוטומטי (CI) [skip ci]"
          git push
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYKONOS_LIST }}
          channelId: live
          projectId: mykonos-list
