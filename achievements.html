<!doctype html>
<!-- GitTrip - version tracked in version.js
     Stage 4/4 (final) of the gamification achievement-map feature: manual
     visit entry, for trips taken before the app existed. Stages 1-3
     (globe/choropleth, country-level data, the view toggle) are unchanged.

     Country picker is a <select>, not free text - the task's own reasoning
     (prevent input that doesn't match an existing ISO code) matches this
     file's whole existing design: every color/aggregation function here
     already assumes countryCode is a real, matching ISO alpha-2 code, and a
     free-text field would silently produce a visit that colors nothing
     (same failure shape as an unmapped continent code above). Options are
     built from window.COUNTRY_CONTINENT's own 248 alpha-2 keys (already
     loaded, already the single source of truth for "what counts as a valid
     country" on this page since stage 3) - not a second, independent list.
     Display names are generated at runtime via Intl.DisplayNames(['he'],
     {type:'region'}) - the browser's own CLDR data, the same source behind
     Hebrew country names in every other Intl-aware app, not a new
     248-entry table hand-typed or scraped into this file (confirmed
     empirically: resolves all 248 codes with zero failures, sorted
     alphabetically by the resulting Hebrew name for the dropdown).

     visitedAt: the date input is optional (the task's own instruction - a
     user adding a pre-app trip may not remember the exact date) and
     defaults to "today" when left blank, not to null - every existing
     reader of visitedAt already assumes a valid ISO string it can wrap in
     new Date() (CLAUDE.md's own documented invariant for this field), and
     null would silently break that assumption for whichever future stage
     reads it, for a field the UI here never even surfaces to justify the
     risk. cityName, by contrast, genuinely has no fallback that means
     anything (unlike a date, there's no sensible "default city") and is
     left null when blank, exactly like it already legitimately is on old
     trip-level backfilled visits (see the backfill script's own comment).

     Country identification: world-atlas's countries-110m.json keys each
     polygon feature by its ISO 3166-1 NUMERIC code (feature.id, e.g. "380"
     for Italy) - visits records store countryCode as ISO alpha-2 ("IT").
     ISO_NUMERIC_TO_ALPHA2 below bridges the two, generated from the same
     verified UN M49 source data used for countryContinent.js itself (its
     m49Code column - confirmed empirically to equal the ISO 3166-1
     numeric code for every country checked, e.g. Italy 380, USA 840 -
     not a coincidence, the two standards are aligned by design), not
     retyped by hand. Confirmed directly against the live topology: only
     177 of 195 countries have a feature at all at this resolution (e.g.
     Andorra has none) - a real, known gap in world-atlas's 110m dataset,
     not a bug in this mapping; those countries can never be colored on
     this globe regardless of how correct their visit data is.

     Continent view: countryContinent.js's window.COUNTRY_CONTINENT (alpha-2
     -> English continent name) is finally read here (loaded since stage 2,
     unused until now). A continent is colored "app" the moment ANY of its
     countries has an app-sourced visit, same priority rule as the country
     view, just aggregated one level up - not a separate decision.

     City view is fundamentally different from the other two: it's not a
     choropleth at all, it's point markers (globe.gl pointsData), because
     visits records carry a raw cityName string, not coordinates. Points are
     placed by geocoding that raw string through legGeocode.js's existing
     window.geocodeLegDestination() (already loaded by index.html/wizard.html
     for the exact same Open-Meteo->Nominatim-fallback lookup - reused here,
     not reimplemented). Deliberate, DOCUMENTED consequence: grouping is by
     EXACT raw string, not by real-world place, so "Rome"/"רומא"/"Roma,
     Italia" saved on different visits for the same real city produce three
     separate points, not one - a known, accepted limitation of the
     underlying data (cityName was never meant to be a canonical join key),
     not a bug to fix in this stage. Geocode results are cached per exact
     string for the page's lifetime - that's memoizing an idempotent
     external lookup (a fixed string always geocodes the same way), NOT the
     same thing as caching the visits-derived color/count decision itself
     (still recomputed fresh from raw records on every change, per stage
     2's rule, never persisted). Geocoding only ever runs after the user
     actually opens the city view - never speculatively.

     Stats block (stage 5, on top of the completed 4-stage feature above):
     a small text summary above the view toggle - "visited X of Y countries
     worldwide (Z%)", one line per continent the user has actually visited
     (continents with zero visits are omitted - inferred-zero noise, not
     information, matching this page's own density rule elsewhere), and a
     "visited X of Y capitals" line. Recomputed on every users/{uid}/visits
     snapshot exactly like country/continent/city info already is - no new
     write, no caching of the derived numbers, same rule as everywhere else
     on this page. Has no relationship to the globe/WebGL render loop at
     all - plain DOM text, updates independently of whether the globe has
     even finished loading.

     capitalCities.js (new file, loaded below) supplies alpha-2 -> capital
     name(s) in English AND Hebrew - see its own header for sourcing
     (Wikidata, not REST Countries - that API now requires an account/key
     this project's safety rules won't let anything here create) and for
     the 10 codes (out of the 248 in window.COUNTRY_CONTINENT) that have no
     entry because Wikidata itself has no capital statement for them
     (Antarctica, uninhabited islands, Hong Kong/Macao's "SAR, not capital"
     status). The "capitals visited" stat can only ever check a visited
     country if it has an entry there - a visited country with none simply
     can't contribute to the numerator, but still counts in the
     denominator ("Y countries you've visited"), per the stat's own
     literal wording.

     Matching a visit's cityName against a capital name is fuzzy ON
     PURPOSE and DELIBERATELY NOT SOLVED PERFECTLY - same spirit as city
     view's own documented duplicate-point limitation (stage 3): strip
     case and diacritics/Hebrew niqqud, then check partial containment
     either direction, against both the English and Hebrew capital name.
     A real capital visit typed in a spelling/transliteration this simple
     check doesn't line up with (rare, but possible) won't be detected -
     accepted, not fixed, exactly per the task's own instruction not to
     chase perfect fuzzy matching here.

     Cross-trip page, deliberately NOT structured like the 5 trip-scoped
     module pages (itinerary/packing/shopping/places) despite sharing most
     of their conventions - there is no single tripId here ("my
     achievements" spans every trip), so several trip-scoped pieces those
     pages load are intentionally NOT loaded here:
     - legs.js/legBuilder.js: every function in both operates on one
       trip's own `legs` array - no such single trip exists on this page.
     - permissions.js: its one function compares a user to a single trip's
       ownerId - nothing to compare against here.
     - member.js: reads trips/{tripId}/memberProfiles/{uid} - no tripId.
     - bottom-nav: gated per-trip by data-feature/enabledFeatures
       (index.html's applyFeatureVisibility) - no trip to read that from.
       Same precedent already set by wizard.html and gittrip-showcase.html,
       the two other pages reached outside the per-trip flow - both omit
       it too.
     Dark mode uses its own non-trip-scoped localStorage key
     (achievementsDarkMode, mirroring index.html's indexDarkMode - the
     other page with no single trip in scope for theming) rather than
     itinerary.html's trip-{tripId}-theme - and data-theme lives on
     documentElement directly (the plain, correct form - index.html's own
     body-scoped variant is a workaround for THAT page's specific legacy
     history, not something to repeat in a new page that has no such
     history). No theme-{tripType} accent class either - that's a
     per-trip "character" concept this cross-trip page has no value for.
-->

<script>
(function () {
  var savedTheme = localStorage.getItem('achievementsDarkMode');
  var shouldStartDark =
    savedTheme === 'dark'
      ? true
      : savedTheme === 'light'
        ? false
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

  if (shouldStartDark) {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
  getRedirectResult, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// Same project config as every other page.
const config = {
  apiKey: "AIzaSyDhTtqVrBiKfKLxdOVmd_XwBEJm5oh_vMg",
  authDomain: "gittrip.app",
  databaseURL: "https://mykonos-list-default-rtdb.firebaseio.com",
  projectId: "mykonos-list",
  storageBucket: "mykonos-list.firebasestorage.app",
  messagingSenderId: "471388041921",
  appId: "1:471388041921:web:c0100252c6397f67dc1a40",
  measurementId: "G-0VXCEZ117S"
};
const app = initializeApp(config), auth = getAuth(app), provider = new GoogleAuthProvider(), db = getDatabase(app);

const $ = id => document.getElementById(id);

// --- Theme toggle (own key, own element - see the file header comment
// for why this isn't itinerary.html's trip-scoped version). ---
function applyTheme() {
  const stored = localStorage.getItem('achievementsDarkMode');
  const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const shouldBeDark = stored === 'dark' ? true : stored === 'light' ? false : systemDark;

  if (shouldBeDark) document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;

  $('themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';
}
$('themeBtn').onclick = () => {
  localStorage.setItem('achievementsDarkMode', document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  applyTheme();
};
applyTheme();

// --- Auth gate - identical mechanics to itinerary.html's (doGoogleSignIn,
// the popup->redirect fallback, getRedirectResult, armAuthGate watchdog)
// which has no tripId dependency in any of those parts. The one part that
// WAS tripId-dependent there (listen() vs toast('Missing tripId')) doesn't
// carry over - there's nothing to listen to yet in stage 1. ---
function doGoogleSignIn() {
  signInWithPopup(auth, provider).catch(error => {
    const fallbackCodes = [
      "auth/popup-blocked", "auth/popup-closed-by-user",
      "auth/cancelled-popup-request", "auth/web-storage-unsupported",
      "auth/operation-not-supported-in-this-environment"
    ];
    if (fallbackCodes.includes(error?.code) || /missing initial state/i.test(error?.message || "")) {
      signInWithRedirect(auth, provider);
    } else if (window.toast) {
      window.toast(error.message, "error");
    }
  });
}
getRedirectResult(auth).catch(error => {
  if (window.toast) window.toast(error.message, "error");
});
$('googleBtn').onclick = doGoogleSignIn;

function handleAuthStateChanged(user) {
  $('authLoading').classList.add('hidden');
  $('loginOverlay').classList.toggle('hidden', !!user);
  $('appContainer').classList.toggle('hidden', !user);

  if (user && !globeStarted) {
    globeStarted = true;
    startGlobe();
  }

  if (user && !visitsListenerStarted) {
    visitsListenerStarted = true;
    startVisitsListener(user.uid);
  }
}
onAuthStateChanged(auth, handleAuthStateChanged);
if (window.armAuthGate) {
  window.armAuthGate(() => { if (auth.currentUser) handleAuthStateChanged(auth.currentUser); });
}

// --- Globe: ported from globe-test.html, verified there first (including
// the double-fetch fix from commit d417bc3 - globeImageUrl() is called
// directly with the chosen format's URL, never through a separate
// preload()+decode() step, which measurably doubled the real network
// cost of the texture when tried). Only the texture path changed (moved
// from globe-test-assets/ to globe-assets/, a copy not a move - the old
// test page keeps working unaffected). No FPS debug report panel here
// (that lived in globe-test.html only) - just the small always-visible
// counter, since this stage is still explicitly a performance check, not
// the finished feature. ---
let globeStarted = false;
let visitsListenerStarted = false;
let world = null; // set once startGlobe()'s Globe() call resolves - read by startVisitsListener()'s onValue callback to force a repaint when new data arrives after the globe already exists.

// --- Country identification bridge - see the file header comment for why

// the 177 numeric codes that world-atlas's countries-110m.json actually
// has geometry for can ever be colored, but the full 248-country table is
// included anyway (matching countryContinent.js's own completeness) -
// cheap to keep, and correct if a higher-res atlas ever replaces this one. ---

  "175": "YT", "178": "CG", "180": "CD", "184": "CK", "188": "CR", "191": "HR",
  "192": "CU", "196": "CY", "203": "CZ", "204": "BJ", "208": "DK", "212": "DM",

// --- Color priority, per the decision already made (not re-litigated
// here): any app-sourced visit wins over manual, regardless of how many
// manual visits also exist for that country. Cumulative count is tracked
// separately from which color wins - a country can show "3" while still
// being colored by a single app visit among 2 manual ones. Computed fresh
// from the raw records on every call - nothing here is cached/stored, per
// the explicit instruction (recomputed at render time only). ---
const COLOR_APP = "rgba(255, 179, 0, 0.78)";      // achieved via the app - warm gold
const COLOR_MANUAL = "rgba(88, 156, 224, 0.68)";  // manual-only - distinct cool blue
const COLOR_NONE = "rgba(255, 255, 255, 0.06)";   // no visit at all - barely tinted

let countryVisitInfo = {}; // ISO alpha-2 -> { hasApp, hasManual, count }

function computeCountryVisitInfo(visits) {
  const info = {};
  Object.values(visits || {}).forEach(v => {
    if (!v || !v.countryCode) return;
    const cc = String(v.countryCode).toUpperCase();
    if (!info[cc]) info[cc] = { hasApp: false, hasManual: false, count: 0 };
    info[cc].count++;
    if (v.source === "app") info[cc].hasApp = true;
    else if (v.source === "manual") info[cc].hasManual = true;
  });
  return info;
}

function capColorForFeature(feature) {
  const alpha2 = ISO_NUMERIC_TO_ALPHA2[feature.id];
  const info = alpha2 && countryVisitInfo[alpha2];
  if (!info) return COLOR_NONE;
  return info.hasApp ? COLOR_APP : COLOR_MANUAL;
}

// --- Continent view (stage 3) - same app-wins-over-manual priority, just
// aggregated one level up via countryContinent.js's window.COUNTRY_CONTINENT
// (alpha-2 -> English continent name, loaded since stage 2). Derived from
// countryVisitInfo (already computed fresh above), not from raw visits
// directly - no new source of truth, just a re-grouping of the same one. ---
let continentVisitInfo = {}; // English continent name -> { hasApp, hasManual }

function computeContinentVisitInfo(countryInfo) {
  const info = {};
  Object.entries(countryInfo).forEach(([cc, stat]) => {
    const continent = window.COUNTRY_CONTINENT && window.COUNTRY_CONTINENT[cc];
    if (!continent) return; // unmapped code - skip silently, don't crash the whole view
    if (!info[continent]) info[continent] = { hasApp: false, hasManual: false };
    if (stat.hasApp) info[continent].hasApp = true;
    if (stat.hasManual) info[continent].hasManual = true;
  });
  return info;
}

function capColorForFeatureContinent(feature) {
  const alpha2 = ISO_NUMERIC_TO_ALPHA2[feature.id];
  const continent = alpha2 && window.COUNTRY_CONTINENT && window.COUNTRY_CONTINENT[alpha2];
  const info = continent && continentVisitInfo[continent];
  if (!info) return COLOR_NONE;
  return info.hasApp ? COLOR_APP : COLOR_MANUAL;
}

// --- City view (stage 3) - point markers, not a choropleth (see file header
// for why). Grouped by the EXACT raw cityName string - the known/accepted
// duplicate-point limitation for non-canonical old names is a direct,
// intentional consequence of that, not something worked around here. ---
let latestVisits = {}; // raw users/{uid}/visits snapshot - country/continent views only need the aggregated countryVisitInfo, but city view needs the raw cityName strings too
const cityGeocodeCache = {}; // raw cityName string -> {lat, lon} | null (null = attempted, failed/unavailable - never retried)
let cityPoints = []; // built list actually handed to globe.gl's pointsData

function escapeHtml(value) {
  return String(value || "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function computeCityVisitInfo(visits) {
  const info = {};
  Object.values(visits || {}).forEach(v => {
    if (!v || !v.cityName) return;
    const key = String(v.cityName);
    if (!info[key]) info[key] = { hasApp: false, hasManual: false, count: 0 };
    info[key].count++;
    if (v.source === "app") info[key].hasApp = true;
    else if (v.source === "manual") info[key].hasManual = true;
  });
  return info;
}

function rebuildCityPoints() {
  const cityInfo = computeCityVisitInfo(latestVisits);
  cityPoints = Object.entries(cityInfo)
    .map(([cityName, stat]) => {
      const coords = cityGeocodeCache[cityName];
      if (!coords) return null; // not geocoded yet, or geocoding failed - just omit the point
      return {
        cityName,
        lat: coords.lat,
        lng: coords.lon,
        count: stat.count,
        color: stat.hasApp ? COLOR_APP : COLOR_MANUAL
      };
    })
    .filter(Boolean);
  if (world && currentView === "city") world.pointsData(cityPoints);
}

// Geocodes every not-yet-attempted cityName found in the latest visits
// snapshot, one at a time via legGeocode.js's existing throttled queue (see
// its own file header - critical for the Nominatim-fallback path), then
// repaints progressively as each result arrives. Only ever called while (or
// just before) the city view is actually visible - never speculatively. ---
function refreshCityPoints() {
  rebuildCityPoints(); // paint whatever's already cached immediately
  const cityInfo = computeCityVisitInfo(latestVisits);
  const pending = Object.keys(cityInfo).filter(name => !(name in cityGeocodeCache));
  if (!pending.length) return;
  if (!window.geocodeLegDestination) {
    console.warn("[achievements] geocodeLegDestination missing - legGeocode.js failed to load, city view cannot place any points");
    return;
  }
  pending.forEach(name => {
    // Mark in-flight immediately (synchronously, before the request even
    // starts) - closes a real race: refreshCityPoints() can run again
    // (new visits data arriving) while this same name's lookup is still
    // in flight, and without this, the second run would see the name as
    // still un-cached and fire a redundant concurrent request for it.
    // rebuildCityPoints() treats this null placeholder exactly like a
    // failed lookup - no point yet - which is correct while pending.
    cityGeocodeCache[name] = null;
    window.geocodeLegDestination(name)
      .then(result => {
        cityGeocodeCache[name] = (result && result.lat != null && result.lon != null)
          ? { lat: result.lat, lon: result.lon }
          : null;
        if (!cityGeocodeCache[name]) {
          console.warn(`[achievements] city view: could not geocode "${name}" - its point is omitted (known limitation - see file header on non-canonical cityName strings)`);
        }
        rebuildCityPoints();
      })
      .catch(error => {
        cityGeocodeCache[name] = null;
        console.warn(`[achievements] city view: geocoding "${name}" threw`, error);
        rebuildCityPoints();
      });
  });
}

// --- View toggle - wired early like themeBtn (no auth dependency), but
// applyView() itself no-ops until the globe exists (world is still null). ---
let currentView = "country"; // "country" | "city" | "continent"

function applyView() {
  if (!world) return;
  if (currentView === "country") {
    world.polygonCapColor(capColorForFeature).pointsData([]);
  } else if (currentView === "continent") {
    world.polygonCapColor(capColorForFeatureContinent).pointsData([]);
  } else {
    world.polygonCapColor(() => COLOR_NONE);
    refreshCityPoints(); // assigns pointsData itself, possibly progressively
  }
}

function setView(view) {
  if (view === currentView) return;
  currentView = view;
  document.querySelectorAll("#viewTabs .tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.view === view);
  });
  applyView();
}
document.querySelectorAll("#viewTabs .tab").forEach(btn => {
  btn.onclick = () => setView(btn.dataset.view);
});

// --- Manual visit entry (stage 4) - for trips taken before the app
// existed. Writes go through the existing live users/{uid}/visits
// onValue listener below, exactly like every other write in this app -
// there is no separate "refresh the globe" step here on purpose: the
// listener already recomputes country/continent/city info from raw
// records and repaints whatever view is active on every snapshot, so a
// successful push() into that same path updates the globe on its own. ---
// countryOptions carries both the Hebrew name (displayed, per the user's
// choice) and the English name (matched against but never shown) - typing
// "France" for a Hebrew-only-displayed "צרפת" is a real, expected input
// path (an English keyboard/habit), not just Hebrew substrings.
let countryOptions = null; // built lazily, once - [{code, nameHe, nameEn}]
let selectedCountryCode = ""; // only set when a suggestion is actually clicked - cleared on every real keystroke, so free text can never pass validation

function buildCountryOptions() {
  const codes = Object.keys(window.COUNTRY_CONTINENT || {});
  let namesHe = null, namesEn = null;
  try {
    namesHe = new Intl.DisplayNames(["he"], { type: "region" });
    namesEn = new Intl.DisplayNames(["en"], { type: "region" });
  } catch (error) {
    console.warn("[achievements] Intl.DisplayNames unavailable - country picker falls back to raw ISO codes", error);
  }
  return codes
    .map(code => ({
      code,
      nameHe: (namesHe && namesHe.of(code)) || code,
      nameEn: (namesEn && namesEn.of(code)) || code
    }))
    .sort((a, b) => a.nameHe.localeCompare(b.nameHe, "he"));
}

function getCountryOptions() {
  if (!countryOptions) countryOptions = buildCountryOptions();
  return countryOptions;
}

function renderCountryList(query) {
  const list = $("visitCountryList");
  const q = query.trim().toLowerCase();
  const matches = q
    ? getCountryOptions().filter(o => o.nameHe.toLowerCase().includes(q) || o.nameEn.toLowerCase().includes(q))
    : getCountryOptions();
  list.innerHTML = matches.length
    ? matches.map(o => `<div class="combo-option" data-code="${o.code}">${escapeHtml(o.nameHe)}</div>`).join("")
    : `<div class="combo-empty">לא נמצאה מדינה תואמת</div>`;
  list.classList.remove("hidden");
}

$("visitCountry").oninput = () => {
  selectedCountryCode = ""; // any real typing invalidates a previous pick - see the variable's own comment
  renderCountryList($("visitCountry").value);
};
$("visitCountry").onfocus = () => renderCountryList($("visitCountry").value);
$("visitCountry").onblur = () => {
  // Delayed, not immediate: a suggestion's own mousedown (below) must run
  // first, or the list would already be hidden by the time the click lands.
  setTimeout(() => $("visitCountryList").classList.add("hidden"), 150);
};
$("visitCountryList").addEventListener("mousedown", event => {
  const option = event.target.closest(".combo-option");
  if (!option) return;
  event.preventDefault(); // keep focus in the input - a plain click would blur it first
  selectedCountryCode = option.dataset.code;
  $("visitCountry").value = option.textContent;
  $("visitCountryList").classList.add("hidden");
});
$("visitCountry").addEventListener("keydown", event => {
  if (event.key !== "Enter") return;
  event.preventDefault();
  const firstMatch = $("visitCountryList").querySelector(".combo-option");
  if (firstMatch) firstMatch.dispatchEvent(new MouseEvent("mousedown"));
});

function openAddVisitForm() {
  selectedCountryCode = "";
  $("visitCountry").value = "";
  $("visitCountryList").classList.add("hidden");
  $("visitCity").value = "";
  $("visitDate").value = "";

async function saveManualVisit() {
  if (!auth.currentUser) return;
  const countryCode = selectedCountryCode;
  if (!countryCode) {
    if (window.toast) window.toast("יש לבחור מדינה מהרשימה", "error");
    return;
  }
  const cityName = $("visitCity").value.trim() || null;
  const dateValue = $("visitDate").value; // "YYYY-MM-DD" or "" (optional per the task)
  // A date-only string is spec-guaranteed (ECMA-262) to parse as UTC
  // midnight, so this always round-trips to a valid ISO string - never
  // null. Defaults to "now" when left blank - see file header comment on
  // why visitedAt specifically always gets a real value while cityName
  // does not.
  const visitedAt = dateValue ? new Date(dateValue).toISOString() : new Date().toISOString();
  const record = {
    source: "manual",
    countryCode: countryCode.toUpperCase(),
    cityName,
    visitedAt,
    createdAt: new Date().toISOString()
  };
  if (!(await window.safeWrite(push(ref(db, `users/${auth.currentUser.uid}/visits`), record), "saveManualVisit"))) {
    if (window.toast) window.toast("השמירה נכשלה. נסו שוב.", "error");
    return;
  }
  if (window.toast) window.toast("הביקור נוסף", "success");
  $("addVisitOverlay").classList.add("hidden");
}

$("addVisitFab").onclick = openAddVisitForm;
$("saveManualVisit").onclick = saveManualVisit;

// --- Stats block (stage 5) - plain text, no relationship to the globe/
// WebGL render loop at all. Recomputed fresh from countryVisitInfo/
// latestVisits on every visits snapshot, exactly like every other derived
// value on this page - nothing here is cached/stored. ---
const CONTINENT_LABELS_HE = {
  Africa: "אפריקה",
  Americas: "אמריקה",
  Asia: "אסיה",
  Europe: "אירופה",
  Oceania: "אוקיאניה",
  Antarctica: "אנטארקטיקה"
};

// Strips case and diacritics/Hebrew niqqud (both are Unicode combining
// marks once run through NFD normalization, just in different code-point
// ranges) - not a full fuzzy-matching solution, see the file header on why
// that's intentional here.
function normalizeForMatch(str) {
  return String(str || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0591-\u05C7\u0300-\u036f]/g, "");
}

function cityMatchesCapital(cityName, capitalEntries) {
  const normCity = normalizeForMatch(cityName);
  if (!normCity) return false;
  return capitalEntries.some(entry =>
    [entry.en, entry.he].some(name => {
      if (!name) return false;
      const normCapital = normalizeForMatch(name);
      return normCity.includes(normCapital) || normCapital.includes(normCity);
    })
  );
}

function computeStats(visits) {
  const worldTotal = Object.keys(window.COUNTRY_CONTINENT || {}).length;
  const visitedCodes = Object.keys(countryVisitInfo);

  const continentTotals = {};
  Object.values(window.COUNTRY_CONTINENT || {}).forEach(cont => {
    continentTotals[cont] = (continentTotals[cont] || 0) + 1;
  });
  const continentVisited = {};
  visitedCodes.forEach(code => {
    const cont = window.COUNTRY_CONTINENT && window.COUNTRY_CONTINENT[code];
    if (!cont) return;
    continentVisited[cont] = (continentVisited[cont] || 0) + 1;
  });

  let capitalsVisited = 0;
  visitedCodes.forEach(code => {
    const capitalEntries = window.CAPITAL_CITIES && window.CAPITAL_CITIES[code];
    if (!capitalEntries) return; // no capital data for this country - can't check it, but it still counts toward the denominator below
    const cityNames = Object.values(visits || {})
      .filter(v => v && v.cityName && v.countryCode && String(v.countryCode).toUpperCase() === code)
      .map(v => v.cityName);
    if (cityNames.some(name => cityMatchesCapital(name, capitalEntries))) capitalsVisited++;
  });

  return { worldTotal, visitedCount: visitedCodes.length, continentTotals, continentVisited, capitalsVisited };
}

function renderStats() {
  const stats = computeStats(latestVisits);
  if (!stats.visitedCount) {
    // Nothing visited yet - a "0 out of 0" capitals line would be
    // nonsensical, and every continent line would read "0 out of Y" with
    // nothing to say. Just the one honest fact stands on its own.
    $("statsBlock").innerHTML = `<div class="stat-main">ביקרת ב-0 מדינות מתוך ${stats.worldTotal} בעולם (0%)</div>`;
    return;
  }

  const worldPct = Math.round((stats.visitedCount / stats.worldTotal) * 100);
  const lines = [`<div class="stat-main">ביקרת ב-${stats.visitedCount} מדינות מתוך ${stats.worldTotal} בעולם (${worldPct}%)</div>`];

  Object.keys(stats.continentVisited)
    .sort((a, b) => stats.continentVisited[b] - stats.continentVisited[a])
    .forEach(cont => {
      const visited = stats.continentVisited[cont];
      const total = stats.continentTotals[cont] || 0;
      const pct = total ? Math.round((visited / total) * 100) : 0;
      const label = CONTINENT_LABELS_HE[cont] || cont;
      lines.push(`<div>${escapeHtml(label)}: ${visited} מתוך ${total} מדינות (${pct}%)</div>`);
    });

  lines.push(`<div>ביקרת ב-${stats.capitalsVisited} בירות מתוך ${stats.visitedCount} מדינות שביקרת בהן</div>`);

  $("statsBlock").innerHTML = lines.join("");
}

function startVisitsListener(uid) {
  onValue(ref(db, `users/${uid}/visits`), snapshot => {
    latestVisits = snapshot.val();
    countryVisitInfo = computeCountryVisitInfo(latestVisits);
    continentVisitInfo = computeContinentVisitInfo(countryVisitInfo);
    renderStats();
    // Re-applying the same accessor forces globe.gl to re-evaluate every
    // polygon's cap color against the just-updated info - needed because
    // nothing else about the polygons layer changed, so nothing would
    // otherwise trigger a repaint. Harmless/no-op before the globe exists
    // yet (world is null until startGlobe()'s own promise resolves) - each
    // color function reads its info fresh on every real invocation
    // regardless of which finished first.
    if (world) {
      if (currentView === "country") world.polygonCapColor(capColorForFeature);
      else if (currentView === "continent") world.polygonCapColor(capColorForFeatureContinent);
      else refreshCityPoints(); // city view: polygon color doesn't depend on visits, but points do
    }
  }, error => {
    console.warn("[achievements] users/{uid}/visits read failed", error);
    if (window.toast) window.toast(error.message, "error");
  });
}

(function startFpsCounter() {
  const fpsEl = $('fpsHud');
  let frames = 0;
  let lastReportAt = performance.now();

  function tick(now) {
    frames++;
    const elapsed = now - lastReportAt;
    if (elapsed >= 500) {
      const fps = Math.round((frames * 1000) / elapsed);
      fpsEl.textContent = `FPS ${fps}`;
      fpsEl.style.color = fps >= 50 ? "#7f7" : fps >= 30 ? "#fd7" : "#f77";
      frames = 0;
      lastReportAt = now;
    }
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();

const AVIF_TEST = "data:image/avif;base64,AAAAHGZ0eXBhdmlmAAAAAG1pZjFhdmlmbWlhZgAAANZtZXRhAAAAAAAAACFoZGxyAAAAAAAAAABwaWN0AAAAAAAAAAAAAAAAAAAAACJpbG9jAAAAAERAAAEAAQAAAAAA+gABAAAAAAAAACQAAAAjaWluZgAAAAAAAQAAABVpbmZlAgAAAAABAABhdjAxAAAAAA5waXRtAAAAAAABAAAAVmlwcnAAAAA4aXBjbwAAAAxhdjFDgSACAAAAABRpc3BlAAAAAAAAAAEAAAABAAAAEHBpeGkAAAAAAwgICAAAABZpcG1hAAAAAAAAAAEAAQOBAgMAAAAsbWRhdBIACgc4AAaQENBpMhcZQmMEwAA0AACQQMkcYUuNGtYQVLH7IA==";
const WEBP_TEST = "data:image/webp;base64,UklGRjgAAABXRUJQVlA4ICwAAACQAQCdASoBAAEAAsBMJaACdLoAA5gA/u5DH+5sc4twV/9tD/9aH/60P+lAAA==";

function canDecodeFormat(dataUri) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img.naturalWidth > 0);
    img.onerror = () => resolve(false);
    img.src = dataUri;
  });
}

const TEXTURE_BASE = "globe-assets/earth-blue-marble";
const PLACEHOLDER_URL = TEXTURE_BASE + "-placeholder.jpg";

async function pickBestTextureFormat() {
  const [avifOk, webpOk] = await Promise.all([canDecodeFormat(AVIF_TEST), canDecodeFormat(WEBP_TEST)]);
  if (avifOk) return TEXTURE_BASE + ".avif";
  if (webpOk) return TEXTURE_BASE + ".webp";
  return TEXTURE_BASE + ".jpg";
}

async function startGlobe() {
  await import("https://cdn.jsdelivr.net/npm/globe.gl@2/dist/globe.gl.min.js");
  const Globe = window.Globe;

  const topoRes = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
  const topology = await topoRes.json();

  await import("https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js");
  const countries = window.topojson.feature(topology, topology.objects.countries);

  world = Globe()($('globeContainer'))
    .width($('globeContainer').clientWidth)
    .height($('globeContainer').clientHeight)
    .globeImageUrl(PLACEHOLDER_URL)
    .backgroundColor("rgba(0,0,0,0)")
    .polygonsData(countries.features)
    .polygonSideColor(() => "rgba(0, 0, 0, 0.15)")
    .polygonStrokeColor(() => "#111")
    .polygonAltitude(0.01)
    .polygonsTransitionDuration(0)
    // City view (stage 3) point markers - accessors set up now, but
    // pointsData stays empty until applyView() below decides the city view
    // is actually the active one.
    .pointsData([])
    .pointLat("lat")
    .pointLng("lng")
    .pointColor("color")
    .pointAltitude(0.015)
    .pointRadius(0.4)
    .pointLabel(d => escapeHtml(d.cityName) + (d.count > 1 ? ` ×${d.count}` : ""))
    .showAtmosphere(true)
    .atmosphereColor("#3a9bdc")
    .atmosphereAltitude(0.15);

  // Sync the globe to whatever view is currently selected - almost always
  // still the "country" default at this point, but robust against the rare
  // case where the user already tapped a different tab while the globe was
  // still loading (applyView() no-ops safely when called before this, via
  // its own `if (!world) return` guard - this is the first call where world
  // actually exists).
  applyView();

  window.addEventListener("resize", () => {
    world.width($('globeContainer').clientWidth).height($('globeContainer').clientHeight);
  });

  pickBestTextureFormat()
    .then(url => {
      $('globeContainer').style.transition = "opacity 150ms ease";
      $('globeContainer').style.opacity = "0.55";
      setTimeout(() => {
        world.globeImageUrl(url);
        setTimeout(() => { $('globeContainer').style.opacity = "1"; }, 60);
      }, 150);
    })
    .catch(err => console.warn("[achievements] texture upgrade failed, staying on placeholder", err));
}
</script>

</body>
</html>
