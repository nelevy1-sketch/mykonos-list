<body>
<main class="shell"><header class="top"><a class="icon-btn" id="homeTop" href="index.html">⌂</a><div class="top-actions"><button class="icon-btn" id="themeBtn">🌙</button><button class="icon-btn" id="logoutBtn">↪</button></div></header><section class="hero"><div class="kicker" id="destination">הטיול שלנו</div><h1 id="title">מקומות ותמונות 📍</h1><p id="subtitle">כל ההמלצות והזיכרונות של הקבוצה במקום אחד</p><span class="user-chip" id="userChip"></span></section>

<nav class="bottom-nav"><a id="navHome" href="index.html">⌂<span>בית</span></a><a id="navPacking" data-feature="packing" href="packing.html">🎒<span>ציוד</span></a><a id="navShopping" data-feature="shopping" href="shopping.html">🛒<span>קניות</span></a><a class="active" id="navPlaces" href="places.html">📍<span>מקומות</span></a><a id="navExpenses" data-feature="expenses" href="expenses.html">💸<span>הוצאות</span></a></nav>
<div class="overlay" id="loginOverlay"><div class="sheet login"><div class="handle"></div><h2 id="loginTitle">כניסה לטיול</h2><p id="loginText">כדי לשמור ולשתף מקומות ותמונות יש להתחבר באמצעות Google.</p><button class="google-btn" id="googleBtn">G&nbsp;&nbsp; כניסה עם Google</button></div></div>
<div class="overlay hidden" id="memberOverlay"><div class="sheet"><div class="handle"></div><h2 id="memberTitle">מי את/ה בקבוצה?</h2><p id="memberText">בחרו את השם שהמארגן הוסיף לטיול.</p><div class="field"><select id="memberSelect"></select></div><button class="primary-btn" style="width:100%" id="saveMemberBtn">זה אני</button></div></div>
<div class="overlay hidden" id="placeOverlay"><div class="sheet"><div class="handle"></div><h2 id="placeModalTitle">הוספת מקום</h2><div class="field"><label id="placeNameLabel">שם המקום</label><input id="placeName" maxlength="120"></div><div class="field"><label id="categoryLabel">קטגוריה</label><select id="placeCategory"></select></div><div class="field"><label id="mapLabel">קישור Google Maps</label><input id="placeMap" type="url" placeholder="https://maps.google.com/..."></div><div class="field"><label id="noteLabel">הערה</label><textarea id="placeNote" maxlength="500"></textarea></div><div class="sheet-actions"><button class="secondary-btn" data-close="placeOverlay" id="cancelPlace">ביטול</button><button class="primary-btn" id="savePlace">שמירה</button></div></div></div>
<div class="overlay hidden" id="musicOverlay"><div class="sheet"><div class="handle"></div><h2 id="musicModalTitle">הוספת מוזיקה</h2><div class="field"><label id="musicNameLabel">שם השיר / הפלייליסט</label><input id="musicName" maxlength="120"></div><div class="field"><label id="musicLinkLabel">קישור Spotify / YouTube / Apple Music</label><input id="musicUrl" type="url"></div><div class="sheet-actions"><button class="secondary-btn" data-close="musicOverlay" id="cancelMusic">ביטול</button><button class="primary-btn" id="saveMusic">שמירה</button></div></div></div>
<div class="toast" id="toast"></div>
<script type="module">

const config={apiKey:"AIzaSyDhTtqVrBiKfKLxdOVmd_XwBEJm5oh_vMg",authDomain:"mykonos-list.firebaseapp.com",databaseURL:"https://mykonos-list-default-rtdb.firebaseio.com",projectId:"mykonos-list",storageBucket:"mykonos-list.firebasestorage.app",messagingSenderId:"471388041921",appId:"1:471388041921:web:c0100252c6397f67dc1a40",measurementId:"G-0VXCEZ117S"};const app=initializeApp(config),db=getDatabase(app),auth=getAuth(app),storage=getStorage(app),provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),tripId=params.get('tripId'),root=tripId?`trips/${tripId}`:null,themeKey=`trip-${tripId||'legacy'}-theme`;let user=null,trip={},profile=null,places={},photos={},music={},tab='places',stopTrip=null;const tr=(he,en)=>trip.language==='en'?en:he,escapeHtml=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),scoped=file=>{const u=new URL(file,location.href);if(tripId)u.searchParams.set('tripId',tripId);return u.href};
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}function canDelete(x){return user&&(x.createdByUid===user.uid||trip.ownerId===user.uid)}function validUrl(v){try{const u=new URL(v);return['http:','https:'].includes(u.protocol)}catch{return false}}
function applyTheme(){document.documentElement.classList.remove('theme-abroad','theme-local','theme-camping','theme-reserve');document.documentElement.classList.add(`theme-${trip.tripType||'abroad'}`);if(localStorage.getItem(themeKey)==='dark')document.documentElement.dataset.theme='dark';else delete document.documentElement.dataset.theme;$('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙'}
function categories(){const t=trip.tripType||'abroad';const he={abroad:['אוכל וקפה 🍽️','חוף 🏖️','אטרקציה 🎟️','חיי לילה 🎵','קניות 🛍️','מלון 🏨'],local:['מסלול 🥾','תצפית 🌄','אוכל וקפה 🍽️','אטרקציה 🎟️','לינה 🏡'],camping:['חניון לילה ⛺','מסלול 🥾','מים 💧','תצפית 🌄','אספקה 🛒'],reserve:['נקודת מפגש 📍','אספקה 🛒','אוכל 🍽️','לינה 🛏️','חשוב ⭐']};const en={abroad:['Food & coffee 🍽️','Beach 🏖️','Attraction 🎟️','Nightlife 🎵','Shopping 🛍️','Hotel 🏨'],local:['Trail 🥾','Viewpoint 🌄','Food & coffee 🍽️','Attraction 🎟️','Lodging 🏡'],camping:['Campsite ⛺','Trail 🥾','Water 💧','Viewpoint 🌄','Supplies 🛒'],reserve:['Meeting point 📍','Supplies 🛒','Food 🍽️','Lodging 🛏️','Important ⭐']};return(trip.language==='en'?en:he)[t]||[]}
function applyLanguage(){const en=trip.language==='en';document.documentElement.lang=en?'en':'he';document.documentElement.dir=en?'ltr':'rtl';document.title=`${tr('מקומות ותמונות','Places & photos')} • ${trip.destination||''}`;$('destination').textContent=trip.destination||tr('הטיול שלנו','Our trip');$('title').textContent=tr('מקומות ותמונות 📍','Places & photos 📍');$('subtitle').textContent=tr('כל ההמלצות והזיכרונות של הקבוצה במקום אחד','Group recommendations and memories in one place');$('placesTab').textContent=tr('מקומות','Places');$('photosTab').textContent=tr('תמונות','Photos');$('musicTab').textContent=tr('מוזיקה','Music');$('search').placeholder=tr('חיפוש מקום...','Search places...');$('addPlaceBtn').textContent=tr('+ מקום','+ Place');$('uploadLabel').textContent=tr('📷 העלאת תמונות','📷 Upload photos');$('uploadStatus').textContent=tr('JPG, PNG או HEIC • התמונות יכווצו אוטומטית','JPG, PNG or HEIC • photos are compressed automatically');$('addMusicBtn').textContent=tr('+ קישור','+ Link');$('loginTitle').textContent=tr('כניסה לטיול','Trip sign-in');$('loginText').textContent=tr('כדי לשמור ולשתף מקומות ותמונות יש להתחבר באמצעות Google.','Sign in with Google to save and share places and photos.');$('googleBtn').innerHTML=`G&nbsp;&nbsp; ${tr('כניסה עם Google','Continue with Google')}`;$('memberTitle').textContent=tr('מי את/ה בקבוצה?','Who are you in the group?');$('memberText').textContent=tr('בחרו את השם שהמארגן הוסיף לטיול.','Choose the name added by the organizer.');$('saveMemberBtn').textContent=tr('זה אני','This is me');$('placeModalTitle').textContent=tr('הוספת מקום','Add a place');$('placeNameLabel').textContent=tr('שם המקום','Place name');$('categoryLabel').textContent=tr('קטגוריה','Category');$('mapLabel').textContent=tr('קישור Google Maps','Google Maps link');$('noteLabel').textContent=tr('הערה','Note');$('cancelPlace').textContent=$('cancelMusic').textContent=tr('ביטול','Cancel');$('savePlace').textContent=$('saveMusic').textContent=tr('שמירה','Save');$('musicModalTitle').textContent=tr('הוספת מוזיקה','Add music');$('musicNameLabel').textContent=tr('שם השיר / הפלייליסט','Song / playlist name');$('musicLinkLabel').textContent=tr('קישור Spotify / YouTube / Apple Music','Spotify / YouTube / Apple Music link');$('placeCategory').innerHTML=categories().map(x=>`<option>${escapeHtml(x)}</option>`).join('');[['navHome','בית','Home'],['navPacking','ציוד','Packing'],['navShopping','קניות','Shopping'],['navPlaces','מקומות','Places'],['navExpenses','הוצאות','Expenses']].forEach(([id,he,en])=>$(id).querySelector('span').textContent=tr(he,en));renderAll()}

function participantKey(name){const bytes=new TextEncoder().encode(String(name).trim());let raw='';bytes.forEach(b=>raw+=String.fromCharCode(b));return btoa(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function profileOptions(){const names=Array.isArray(trip.participants)?trip.participants:[],claims=trip.participantClaims||{};$('memberSelect').innerHTML=`<option value="">${tr('בחר/י שם…','Choose a name…')}</option>`+names.map((n,i)=>{const taken=claims[participantKey(n)]&&claims[participantKey(n)]!==user?.uid;return`<option value="${i}" ${taken?'disabled':''}>${escapeHtml(n)}${taken?` — ${tr('כבר משויך','already linked')}`:''}</option>`}).join('')}
async function saveProfile(){if(!user||profile)return;const name=(trip.participants||[])[Number($('memberSelect').value)];if(!name)return toast(tr('יש לבחור שם','Choose a name'));const key=participantKey(name),claimRef=ref(db,`${root}/participantClaims/${key}`);try{const result=await runTransaction(claimRef,current=>current===null||current===user.uid?user.uid:undefined,{applyLocally:false});if(!result.committed||result.snapshot.val()!==user.uid)return toast(tr('השם הזה כבר שויך למשתתף אחר','This name is already linked to another participant'));const nextProfile={name,participantKey:key,email:user.email||'',photoURL:user.photoURL||'',updatedAt:Date.now()};try{await set(ref(db,`${root}/memberProfiles/${user.uid}`),nextProfile)}catch(error){await runTransaction(claimRef,current=>current===user.uid?null:current,{applyLocally:false});throw error}profile=nextProfile;$('memberOverlay').classList.add('hidden');$('userChip').textContent=`${profile.name} · ${user.email||''}`}catch(error){console.error(error);toast(tr('לא ניתן היה לשייך את השם. נסו שוב.','Could not link the name. Please try again.'))}}
function iconFor(category=''){return category.match(/🏖️|חוף|Beach/)?'🏖️':category.match(/🍽️|אוכל|Food|coffee/)?'🍽️':category.match(/🥾|מסלול|Trail/)?'🥾':category.match(/⛺|חניון|Camp/)?'⛺':'📍'}
function renderPlaces(){const search=$('search').value.trim().toLocaleLowerCase(),arr=Object.entries(places||{}).map(([id,x])=>({id,...x})).filter(x=>!search||`${x.name} ${x.note} ${x.category}`.toLocaleLowerCase().includes(search)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$('placesList').innerHTML=arr.length?arr.map(x=>`<article class="place-card"><div class="place-top"><div class="place-icon">${iconFor(x.category)}</div><div class="place-copy"><h3>${escapeHtml(x.name)}</h3><p>${escapeHtml(x.note||'')}</p><span class="tag">${escapeHtml(x.category||tr('כללי','General'))}</span></div></div><div class="card-actions">${validUrl(x.mapUrl)?`<a class="action" target="_blank" rel="noopener" href="${escapeHtml(x.mapUrl)}">${tr('ניווט','Navigate')} ↗</a>`:''}${canDelete(x)?`<button class="action danger" data-delete-place="${x.id}">${tr('מחיקה','Delete')}</button>`:''}</div></article>`).join(''):`<div class="empty"><b>📍</b>${tr('עדיין לא נשמרו מקומות.','No places saved yet.')}</div>`;document.querySelectorAll('[data-delete-place]').forEach(b=>b.onclick=()=>deleteEntry('places/items',b.dataset.deletePlace,tr('למחוק את המקום?','Delete this place?')))}
function renderPhotos(){const arr=Object.entries(photos||{}).map(([id,x])=>({id,...x})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$('gallery').innerHTML=arr.length?arr.map(x=>`<figure class="photo"><img loading="lazy" src="${escapeHtml(x.downloadURL)}" alt="${escapeHtml(x.caption||trip.destination||'Trip photo')}"><figcaption class="photo-info">${escapeHtml(x.ownerName||'')}</figcaption>${user&&x.createdByUid===user.uid?`<button class="photo-delete" data-delete-photo="${x.id}" aria-label="${tr('מחיקה','Delete')}">🗑️</button>`:''}</figure>`).join(''):`<div class="empty" style="grid-column:1/-1"><b>📷</b>${tr('גלריית הטיול עדיין ריקה.','The trip gallery is empty.')}</div>`;document.querySelectorAll('[data-delete-photo]').forEach(b=>b.onclick=()=>deletePhoto(b.dataset.deletePhoto))}
function renderMusic(){const arr=Object.entries(music||{}).map(([id,x])=>({id,...x})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$('musicList').innerHTML=arr.length?arr.map(x=>`<article class="music-card"><div class="place-top"><div class="place-icon">🎵</div><div class="place-copy"><h3>${escapeHtml(x.name)}</h3><p>${escapeHtml(x.ownerName||'')}</p></div></div><div class="card-actions"><a class="action" target="_blank" rel="noopener" href="${escapeHtml(x.url)}">${tr('פתיחה','Open')} ↗</a>${canDelete(x)?`<button class="action danger" data-delete-music="${x.id}">${tr('מחיקה','Delete')}</button>`:''}</div></article>`).join(''):`<div class="empty"><b>🎵</b>${tr('הפסקול המשותף עדיין ריק.','The shared soundtrack is empty.')}</div>`;document.querySelectorAll('[data-delete-music]').forEach(b=>b.onclick=()=>deleteEntry('music/items',b.dataset.deleteMusic,tr('למחוק את הקישור?','Delete this link?')))}function renderAll(){renderPlaces();renderPhotos();renderMusic()}
async function deleteEntry(path,id,msg){if(confirm(msg))await remove(ref(db,`${root}/${path}/${id}`))}async function deletePhoto(id){const x=photos[id];if(!x||!confirm(tr('למחוק את התמונה?','Delete this photo?')))return;try{if(x.storagePath)await deleteObject(storageRef(storage,x.storagePath))}catch(e){console.warn(e)}await remove(ref(db,`${root}/photos/items/${id}`))}
async function savePlace(){const name=$('placeName').value.trim();if(!name)return toast(tr('יש להזין שם מקום','Enter a place name'));const mapUrl=$('placeMap').value.trim();if(mapUrl&&!validUrl(mapUrl))return toast(tr('קישור המפה אינו תקין','Map link is invalid'));await push(ref(db,`${root}/places/items`),{name,category:$('placeCategory').value,mapUrl,note:$('placeNote').value.trim(),ownerName:profile.name,createdByUid:user.uid,createdAt:Date.now()});$('placeOverlay').classList.add('hidden');['placeName','placeMap','placeNote'].forEach(id=>$(id).value='');toast(tr('המקום נוסף','Place added'))}
async function saveMusic(){const name=$('musicName').value.trim(),url=$('musicUrl').value.trim();if(!name||!validUrl(url))return toast(tr('יש להזין שם וקישור תקין','Enter a name and valid link'));await push(ref(db,`${root}/music/items`),{name,url,ownerName:profile.name,createdByUid:user.uid,createdAt:Date.now()});$('musicOverlay').classList.add('hidden');$('musicName').value=$('musicUrl').value=''}
async function compress(file){const bitmap=await createImageBitmap(file),max=1600,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('compression failed')),'image/jpeg',.82))}
async function uploadPhotos(files){if(!profile)return;const list=[...files].slice(0,12);for(let i=0;i<list.length;i++){const file=list[i];if(!file.type.startsWith('image/'))continue;$('uploadStatus').textContent=tr(`מעלה ${i+1} מתוך ${list.length}...`,`Uploading ${i+1} of ${list.length}...`);try{const blob=await compress(file),key=`${Date.now()}_${crypto.getRandomValues(new Uint32Array(1))[0].toString(36)}.jpg`,path=`trip-media/${tripId}/photos/${user.uid}/${key}`,sref=storageRef(storage,path);await uploadBytes(sref,blob,{contentType:'image/jpeg',customMetadata:{tripId,uploaderUid:user.uid}});const downloadURL=await getDownloadURL(sref);await push(ref(db,`${root}/photos/items`),{downloadURL,storagePath:path,ownerName:profile.name,createdByUid:user.uid,createdAt:Date.now()})}catch(e){console.error(e);toast(tr('אחת התמונות לא הועלתה','A photo could not be uploaded'))}}$('uploadStatus').textContent=tr('ההעלאה הסתיימה','Upload complete');$('photoInput').value=''}
function setTab(next){tab=next;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===next));['places','photos','music'].forEach(n=>$(`${n}View`).classList.toggle('hidden',n!==next))}
async function loadProfile(){const s=await get(ref(db,`${root}/memberProfiles/${user.uid}`));profile=s.val();profileOptions();if(!profile)$('memberOverlay').classList.remove('hidden');else $('userChip').textContent=`${profile.name} · ${user.email||''}`}
function listen(){if(stopTrip)stopTrip();stopTrip=onValue(ref(db,root),s=>{if(!s.exists())return toast(tr('הטיול לא נמצא','Trip not found'));trip=s.val();places=trip.places?.items||{};photos=trip.photos?.items||{};music=trip.music?.items||{};applyTheme();applyLanguage();configureLinks();profileOptions();if(user)loadProfile();renderAll()},()=>{stopTrip=null;toast(tr('לא ניתן לטעון את הטיול','Could not load the trip'))})}
$('googleBtn').onclick=()=>signInWithPopup(auth,provider).catch(e=>toast(e.message));$('logoutBtn').onclick=()=>signOut(auth);$('themeBtn').onclick=()=>{localStorage.setItem(themeKey,document.documentElement.dataset.theme==='dark'?'light':'dark');applyTheme()};$('saveMemberBtn').onclick=saveProfile;$('addPlaceBtn').onclick=()=>profile?$('placeOverlay').classList.remove('hidden'):toast(tr('בחרו קודם שם','Choose your name first'));$('addMusicBtn').onclick=()=>profile?$('musicOverlay').classList.remove('hidden'):toast(tr('בחרו קודם שם','Choose your name first'));$('savePlace').onclick=savePlace;$('saveMusic').onclick=saveMusic;$('search').oninput=renderPlaces;$('photoInput').onchange=e=>uploadPhotos(e.target.files);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.add('hidden'));
onAuthStateChanged(auth,u=>{user=u;$('loginOverlay').classList.toggle('hidden',!!u);if(u){$('userChip').textContent=u.email||u.displayName||'';if(root)listen();else toast('Missing tripId')}else{profile=null;if(stopTrip){stopTrip();stopTrip=null}$('memberOverlay').classList.add('hidden')}});
</script>
</body>
