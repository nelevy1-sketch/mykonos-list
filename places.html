<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="app-version" content="1.4.0" />
  <title>המדריך למיקונוס 🇬🇷 (v1.4.0)</title>

  <!-- Firebase SDKs (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #0066cc;
      --primary-hover: #0052a3;
      --primary-soft: #edf5ff;
      --bg-gradient: linear-gradient(180deg, #f0f6fc 0%, #e6eff8 100%);
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --edit-color: #0284c7;
      --delete-color: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      padding: 14px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px;
    }

    /* Tabs Bar */
    .nav-tabs {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 5px;
      border-radius: 18px;
      display: flex;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 70, 140, 0.06);
    }

    .tab-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(0, 102, 204, 0.25);
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .tab-content.active {
      display: flex;
    }

    /* Header */
    .header-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 14px 16px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
    }

    .header-card h1 {
      font-size: 1.25rem;
      color: var(--primary);
      margin-bottom: 2px;
    }

    .header-card p {
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* Trigger Action Buttons */
    .btn-open-modal {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 13px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 102, 204, 0.2);
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn-open-modal:active {
      transform: scale(0.98);
    }

    .btn-music-open {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.22);
    }

    /* Filters */
    .filters-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .filters-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      background: rgba(255, 255, 255, 0.9);
      color: #475569;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 7px 13px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 102, 204, 0.2);
    }

    /* List & Cards */
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .card-item {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(226, 232, 240, 0.7);
    }

    .card-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge-cat {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: #f1f5f9;
      color: #334155;
    }

    .badge-plat {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: #eff6ff;
      color: #0369a1;
    }

    .badge-user {
      font-size: 0.72rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .badge-vibe {
      font-size: 0.72rem;
      color: #d97706;
      background: #fffbeb;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 500;
    }

    .card-note {
      font-size: 0.8rem;
      color: #475569;
      line-height: 1.25;
      word-break: break-word;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-action {
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 7px 11px;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-action:active {
      opacity: 0.8;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.95rem;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon.edit:active { color: var(--edit-color); background: #f0f9ff; }
    .btn-icon.delete:active { color: var(--delete-color); background: #fef2f2; }

    /* Bottom Sheet / Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 26px 26px 0 0;
      padding: 20px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal-sheet {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 4px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }

    .btn-close-modal {
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .row-inputs {
      display: flex;
      gap: 8px;
    }

    .input-field, .select-field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.9rem;
      background: #f8fafc;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .input-field:focus, .select-field:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .select-field {
      width: 130px;
      flex-shrink: 0;
      cursor: pointer;
      font-weight: 500;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-submit {
      flex: 1;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-submit.btn-editing {
      background: var(--edit-color);
    }

    .btn-cancel {
      background: #e2e8f0;
      color: #475569;
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 32px 18px;
      color: var(--muted);
      font-size: 0.88rem;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      border: 1px dashed var(--border);
    }

    .skeleton {
      height: 60px;
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 16px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Toasts */
    .toast-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 90%;
      max-width: 380px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background: #1e293b;
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.success { background: #065f46; }
    .toast.warning { background: #92400e; }
    .toast.error { background: #991b1b; }

    .toast-undo-btn {
      background: white;
      color: #0f172a;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Footer App Version Badge */
    .app-version-badge {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      opacity: 0.75;
      padding-top: 10px;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navigation Tabs -->
    <div class="nav-tabs">

      <button class="tab-btn" onclick="switchTab('music')">🎧 פסקול הטיול</button>
    </div>

    <!-- ================= PLACES TAB ================= -->
    <div id="tab-places" class="tab-content active">
      <div class="header-card">
        <h1>מקומות שווים במיקונוס 📍</h1>

      <!-- Action Button to open Modal -->
      <button class="btn-open-modal" onclick="openPlaceModal()">

      <div class="filters-bar" id="placesFilters">

        <button class="filter-chip" data-filter="בר">ברים 🍸</button>

        <button class="filter-chip" data-filter="מפה">מפות 🗺️</button>
      </div>

      <div class="items-list" id="placesContainer">
        <div class="skeleton"></div>

      </div>

    <!-- ================= MUSIC TAB ================= -->
    <div id="tab-music" class="tab-content">
      <div class="header-card">
        <h1>פסקול הטיול 🎧</h1>
        <p>הפלייליסטים, הסטים והשירים שהחברים השמיעו</p>
      </div>

      <!-- Action Button to open Modal -->
      <button class="btn-open-modal btn-music-open" onclick="openTrackModal()">

      <div class="filters-bar" id="musicFilters">

        <button class="filter-chip" data-platform="SoundCloud">SoundCloud 🟠</button>

        <button class="filter-chip" data-platform="YouTube">YouTube ▶️</button>

      <div class="items-list" id="musicContainer">

    <!-- Version Tracker Badge -->
    <div class="app-version-badge">
      גרסה v1.4.0 • סנכרון Firebase פעיל ☁️
    </div>
  </div>

  <!-- ================= PLACES MODAL ================= -->
  <div class="modal-overlay" id="placeModalOverlay" onclick="handleOverlayClick(event, 'placeModalOverlay')">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title" id="placeModalTitle">הוספת מקום חדש 📍</div>
        <button class="btn-close-modal" onclick="closePlaceModal()">✕</button>
      </div>

      <form id="placeForm" style="display: flex; flex-direction: column; gap: 10px;">
        <input type="hidden" id="placeEditId" value="" />
        <div class="row-inputs">
          <select class="select-field" id="placeCategory">
            <option value="חוף">חוף 🏖️</option>
            <option value="בר">בר 🍸</option>
            <option value="מסעדה">מסעדה 🍽️</option>
            <option value="שופינג">שופינג 🛍️</option>
            <option value="מפה">מפה 🗺️</option>
            <option value="אחר">אחר ✨</option>
          </select>
          <input type="text" class="input-field" id="placeName" placeholder="שם המקום / הרשימה *" required />
        </div>
        
        <div class="row-inputs">
          <input type="text" class="input-field" id="placeLink" placeholder="קישור (גוגל מפות, אינסטגרם...)" />
          <input type="text" class="input-field" id="placeSharer" placeholder="מי המליץ?" style="width: 120px; flex-shrink: 0;" />
        </div>

        <input type="text" class="input-field" id="placeNote" placeholder="הערה / טיפ (שקיעה, להזמין מראש)" />
        
        <div class="modal-buttons">
          <button type="submit" class="btn-submit" id="placeSubmitBtn">
            <span>+</span> הוסף לרשימה

        </div>

  <!-- ================= MUSIC MODAL ================= -->
  <div class="modal-overlay" id="trackModalOverlay" onclick="handleOverlayClick(event, 'trackModalOverlay')">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title" id="trackModalTitle">הוספת מוזיקה לפסקול 🎧</div>
        <button class="btn-close-modal" onclick="closeTrackModal()">✕</button>
      </div>

      <form id="musicForm" style="display: flex; flex-direction: column; gap: 10px;">
        <input type="hidden" id="trackEditId" value="" />
        <input type="text" class="input-field" id="trackLink" placeholder="הדבק קישור (SoundCloud, Spotify, YouTube...)*" required />
        
        <div class="row-inputs">
          <input type="text" class="input-field" id="trackTitle" placeholder="שם השיר / הסט *" required />
          <input type="text" class="input-field" id="trackSharer" placeholder="מי השמיע?" style="width: 120px; flex-shrink: 0;" />
        </div>
        
        <input type="text" class="input-field" id="trackVibe" placeholder="איזה וייב? (שקיעה, הרמות, צ'יל ברכב)" />
        
        <div class="modal-buttons">
          <button type="submit" class="btn-submit btn-music-submit" id="trackSubmitBtn">
            <span>+</span> הוסף לפסקול
          </button>
          <button type="button" class="btn-cancel" onclick="closeTrackModal()">ביטול</button>
        </div>
      </form>
    </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // -------------------------------------------------------------
    // App Version Metadata
    // -------------------------------------------------------------
    const APP_VERSION = "1.4.0";
    console.log(`Mykonos Guide App initialized - Version: ${APP_VERSION}`);

    // -------------------------------------------------------------
    // Helper Functions
    // -------------------------------------------------------------
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function normalizeUrl(url) {
      if (!url) return '';
      url = url.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        return 'https://' + url;
      }
      return url;
    }

    function showToast(msg, type = 'info', action = null) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      const span = document.createElement('span');
      span.textContent = msg;
      toast.appendChild(span);

      if (action) {
        const btn = document.createElement('button');
        btn.className = 'toast-undo-btn';
        btn.textContent = action.label;
        btn.onclick = () => {
          action.callback();
          toast.remove();
        };
        toast.appendChild(btn);
      }

      container.appendChild(toast);

      setTimeout(() => {
        if (toast.parentElement) toast.remove();
      }, action ? 4500 : 3000);
    }

    function handleOverlayClick(e, overlayId) {
      if (e.target.id === overlayId) {
        if (overlayId === 'placeModalOverlay') closePlaceModal();
        if (overlayId === 'trackModalOverlay') closeTrackModal();
      }
    }

    // -------------------------------------------------------------
    // Firebase Config (places-d2918)
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyDNUB4fgqhcPOXua7GxzeUJKn5SAzFqrJ8",
      authDomain: "places-d2918.firebaseapp.com",
      projectId: "places-d2918",
      storageBucket: "places-d2918.firebasestorage.app",
      messagingSenderId: "536137064680",
      appId: "1:536137064680:web:f211b4e761ec511a3ae95d",
      measurementId: "G-8Y68MLY65M"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const placesRef = db.collection('places');
    const tracksRef = db.collection('tracks');

    // ניווט טאבים
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tabId === 'places') {
        document.querySelector('.nav-tabs button:first-child').classList.add('active');
        document.getElementById('tab-places').classList.add('active');
      } else {
        document.querySelector('.nav-tabs button:last-child').classList.add('active');
        document.getElementById('tab-music').classList.add('active');
      }
    }

    // -------------------------------------------------------------
    // מקומות ורשימות
    // -------------------------------------------------------------
    let placesData = [];
    let currentPlaceFilter = 'all';
    let isPlacesLoaded = false;

    const placeModalOverlay = document.getElementById('placeModalOverlay');
    const placeModalTitle = document.getElementById('placeModalTitle');
    const placeForm = document.getElementById('placeForm');
    const placeEditIdInput = document.getElementById('placeEditId');
    const placeSubmitBtn = document.getElementById('placeSubmitBtn');

    function openPlaceModal() {
      placeForm.reset();
      placeEditIdInput.value = '';
      placeModalTitle.textContent = 'הוספת מקום חדש 📍';
      placeSubmitBtn.innerHTML = '<span>+</span> הוסף לרשימה';
      placeSubmitBtn.classList.remove('btn-editing');
      placeModalOverlay.classList.add('active');
    }

    function closePlaceModal() {
      placeModalOverlay.classList.remove('active');
    }

    window.startEditPlace = function(id) {
      const p = placesData.find(item => item.id === id);
      if (!p) return;

      placeEditIdInput.value = p.id;
      document.getElementById('placeName').value = p.name || '';
      document.getElementById('placeCategory').value = p.category || 'חוף';
      document.getElementById('placeLink').value = p.link || '';
      document.getElementById('placeSharer').value = p.sharer || '';
      document.getElementById('placeNote').value = p.note || '';

      placeModalTitle.textContent = 'עריכת מקום ✏️';
      placeSubmitBtn.innerHTML = '<span>✓</span> שמור שינויים';
      placeSubmitBtn.classList.add('btn-editing');
      placeModalOverlay.classList.add('active');
    };

    placesRef.orderBy('createdAt', 'desc').onSnapshot(snapshot => {
      isPlacesLoaded = true;
      placesData = [];
      snapshot.forEach(doc => {
        placesData.push({ id: doc.id, ...doc.data() });
      });
      renderPlaces();
    }, err => {
      showToast('שגיאה בסנכרון נתוני מקומות', 'error');
    });

    function renderPlaces() {
      const container = document.getElementById('placesContainer');
      container.innerHTML = '';

      if (!isPlacesLoaded) {
        container.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
        return;
      }

      if (placesData.length === 0) {
        container.innerHTML = `<div class="empty-state">הרשימה עדיין ריקה. לחצו למעלה להוספת מקום! 🇬🇷</div>`;
        return;
      }

      const filtered = placesData.filter(p => {
        if (currentPlaceFilter === 'all') return true;
        return (p.category || '').includes(currentPlaceFilter);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">אין מקומות בקטגוריית "${escapeHTML(currentPlaceFilter)}"</div>`;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card-item';
        const isMap = (p.category || '').includes('מפה');
        const safeLink = p.link ? escapeHTML(p.link) : '';

        card.innerHTML = `
          <div class="card-main">
            <div class="card-title">${escapeHTML(p.name)}</div>
            <div class="card-meta-row">
              <span class="badge-cat">${escapeHTML(p.category)}</span>
              ${p.sharer ? `<span class="badge-user">👤 ${escapeHTML(p.sharer)}</span>` : ''}
            </div>
            ${p.note ? `<div class="card-note">${escapeHTML(p.note)}</div>` : ''}
          </div>
          <div class="card-actions">
            ${safeLink ? `<a href="${safeLink}" target="_blank" rel="noopener noreferrer" class="btn-action">${isMap ? 'פתח מפה 🗺️' : 'ניווט 📍'}</a>` : ''}
            <button class="btn-icon edit" title="ערוך" onclick="startEditPlace('${p.id}')">✏️</button>
            <button class="btn-icon delete" title="מחק" onclick="deletePlace('${p.id}')">✕</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    placeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const editId = placeEditIdInput.value;
      const name = document.getElementById('placeName').value.trim();
      const category = document.getElementById('placeCategory').value;
      const link = normalizeUrl(document.getElementById('placeLink').value);
      const sharer = document.getElementById('placeSharer').value.trim();
      const note = document.getElementById('placeNote').value.trim();

      if (!name) return;

      const isDuplicate = placesData.some(p => 
        p.id !== editId &&
        (p.name.toLowerCase() === name.toLowerCase() || 
        (link && p.link && p.link.toLowerCase() === link.toLowerCase()))
      );

      if (isDuplicate) {
        showToast('המקום הזה כבר קיים ברשימה!', 'warning');
        return;
      }

      closePlaceModal();

      if (editId) {
        placesRef.doc(editId).update({ name, category, link, sharer, note })
          .then(() => showToast('המקום עודכן בהצלחה ✓', 'success'))
          .catch(() => showToast('שגיאה בעדכון המקום', 'error'));
      } else {
        placesRef.add({
          name,
          category,
          link,
          sharer,
          note,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(() => showToast('המקום נוסף לרשימה ✓', 'success'))
        .catch(() => showToast('שגיאה בשמירת המקום', 'error'));
      }
    });

    window.deletePlace = function(id) {
      const itemToDelete = placesData.find(p => p.id === id);
      if (!itemToDelete) return;

      let canceled = false;
      showToast(`"${itemToDelete.name}" יוסר...`, 'info', {
        label: 'בטל ↩',
        callback: () => { canceled = true; }
      });

      setTimeout(() => {
        if (!canceled) {
          placesRef.doc(id).delete();
        }
      }, 4000);
    };

    document.getElementById('placesFilters').addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-chip')) {
        document.querySelectorAll('#placesFilters .filter-chip').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentPlaceFilter = e.target.getAttribute('data-filter');
        renderPlaces();
      }
    });

    // -------------------------------------------------------------
    // פסקול מוזיקה
    // -------------------------------------------------------------
    let tracksData = [];
    let currentMusicFilter = 'all';
    let isMusicLoaded = false;

    const trackModalOverlay = document.getElementById('trackModalOverlay');
    const trackModalTitle = document.getElementById('trackModalTitle');
    const musicForm = document.getElementById('musicForm');
    const trackEditIdInput = document.getElementById('trackEditId');
    const trackSubmitBtn = document.getElementById('trackSubmitBtn');

    function openTrackModal() {
      musicForm.reset();
      trackEditIdInput.value = '';
      trackModalTitle.textContent = 'הוספת מוזיקה לפסקול 🎧';
      trackSubmitBtn.innerHTML = '<span>+</span> הוסף לפסקול';
      trackSubmitBtn.classList.remove('btn-editing');
      trackModalOverlay.classList.add('active');
    }

    function closeTrackModal() {
      trackModalOverlay.classList.remove('active');
    }

    window.startEditTrack = function(id) {
      const t = tracksData.find(item => item.id === id);
      if (!t) return;

      trackEditIdInput.value = t.id;
      document.getElementById('trackLink').value = t.link || '';
      document.getElementById('trackTitle').value = t.title || '';
      document.getElementById('trackSharer').value = t.sharer || '';
      document.getElementById('trackVibe').value = t.vibe || '';

      trackModalTitle.textContent = 'עריכת שיר / סט ✏️';
      trackSubmitBtn.innerHTML = '<span>✓</span> שמור שינויים';
      trackSubmitBtn.classList.add('btn-editing');
      trackModalOverlay.classList.add('active');
    };

    function detectPlatform(url) {
      const u = url.toLowerCase();
      if (u.includes('spotify.com')) return { name: 'Spotify', icon: '🟢' };
      if (u.includes('soundcloud.com')) return { name: 'SoundCloud', icon: '🟠' };
      if (u.includes('apple.com')) return { name: 'Apple Music', icon: '🍎' };
      if (u.includes('youtube.com') || u.includes('youtu.be')) return { name: 'YouTube', icon: '▶️' };
      return { name: 'לינק', icon: '🎵' };
    }

    async function fetchTrackTitle(url) {
      const u = url.toLowerCase();

      try {
        if (u.includes('youtube.com') || u.includes('youtu.be')) {
          const res = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`);
          const data = await res.json();
          if (data && data.title) return data.title;
        }

        if (u.includes('soundcloud.com')) {
          const res = await fetch(`https://soundcloud.com/oembed?format=json&url=${encodeURIComponent(url)}`);
          const data = await res.json();
          if (data && data.title) return data.title;
        }

        if (u.includes('spotify.com')) {
          const res = await fetch(`https://open.spotify.com/oembed?url=${encodeURIComponent(url)}`);
          const data = await res.json();
          if (data && data.title) return data.title;
        }
      } catch (err) {}

      try {
        const urlObj = new URL(url);
        const pathParts = urlObj.pathname.split('/').filter(Boolean);
        if (pathParts.length > 0) {
          const slug = pathParts[pathParts.length - 1];
          const cleaned = decodeURIComponent(slug).replace(/[-_]/g, ' ');
          if (cleaned.length > 2) {
            return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
          }
        }
      } catch (e) {}

      return '';
    }

    const trackLinkInput = document.getElementById('trackLink');
    const trackTitleInput = document.getElementById('trackTitle');
    let debounceTimer = null;

    trackLinkInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const rawUrl = trackLinkInput.value.trim();
      const url = normalizeUrl(rawUrl);

      if (trackEditIdInput.value) return;

      if (url.startsWith('http://') || url.startsWith('https://')) {
        trackTitleInput.placeholder = 'מחלץ שם שיר/סט... ⏳';
        
        debounceTimer = setTimeout(async () => {
          const fetchedTitle = await fetchTrackTitle(url);
          if (fetchedTitle && !trackTitleInput.value) {
            trackTitleInput.value = fetchedTitle;
          }
          trackTitleInput.placeholder = 'שם השיר / הסט *';
        }, 450);
      }
    });

    tracksRef.orderBy('createdAt', 'desc').onSnapshot(snapshot => {
      isMusicLoaded = true;
      tracksData = [];
      snapshot.forEach(doc => {
        tracksData.push({ id: doc.id, ...doc.data() });
      });
      renderTracks();
    }, err => {
      showToast('שגיאה בסנכרון הפסקול', 'error');
    });

    function renderTracks() {
      const container = document.getElementById('musicContainer');
      container.innerHTML = '';

      if (!isMusicLoaded) {
        container.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
        return;
      }

      if (tracksData.length === 0) {
        container.innerHTML = `<div class="empty-state">הפסקול ריק. לחצו למעלה להוספת טראק ראשון! 🎧</div>`;
        return;
      }

      const filtered = tracksData.filter(t => {
        if (currentMusicFilter === 'all') return true;
        return t.platform === currentMusicFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">אין טראקים בפלטפורמת ${escapeHTML(currentMusicFilter)}</div>`;
        return;
      }

      filtered.forEach(t => {
        const plat = detectPlatform(t.link);
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="card-main">
            <div class="card-title">${escapeHTML(t.title)}</div>
            <div class="card-meta-row">
              <span class="badge-plat">${plat.icon} ${escapeHTML(t.platform || plat.name)}</span>
              ${t.sharer ? `<span class="badge-user">👤 ${escapeHTML(t.sharer)}</span>` : ''}
              ${t.vibe ? `<span class="badge-vibe">✨ ${escapeHTML(t.vibe)}</span>` : ''}
            </div>
          </div>
          <div class="card-actions">
            <a href="${escapeHTML(t.link)}" target="_blank" rel="noopener noreferrer" class="btn-action">נגן ▶</a>
            <button class="btn-icon edit" title="ערוך" onclick="startEditTrack('${t.id}')">✏️</button>
            <button class="btn-icon delete" title="מחק" onclick="deleteTrack('${t.id}')">✕</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    musicForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const editId = trackEditIdInput.value;
      const title = document.getElementById('trackTitle').value.trim();
      const sharer = document.getElementById('trackSharer').value.trim();
      const link = normalizeUrl(document.getElementById('trackLink').value);
      const vibe = document.getElementById('trackVibe').value.trim();

      if (!title || !link) return;

      const isDuplicate = tracksData.some(t => 
        t.id !== editId &&
        (t.link.toLowerCase() === link.toLowerCase() || 
        t.title.toLowerCase() === title.toLowerCase())
      );

      if (isDuplicate) {
        showToast('השיר או הפלייליסט כבר קיים!', 'warning');
        return;
      }

      closeTrackModal();
      const plat = detectPlatform(link);

      if (editId) {
        tracksRef.doc(editId).update({
          title,
          sharer,
          link,
          vibe,
          platform: plat.name
        }).then(() => {
          showToast('הפסקול עודכן בהצלחה ✓', 'success');
        }).catch(() => showToast('שגיאה בעדכון הפסקול', 'error'));
      } else {
        tracksRef.add({
          title,
          sharer,
          link,
          vibe,
          platform: plat.name,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(() => showToast('הטראק נוסף לפסקול ✓', 'success'))
        .catch(() => showToast('שגיאה בשמירת הפסקול', 'error'));
      }
    });

    window.deleteTrack = function(id) {
      const itemToDelete = tracksData.find(t => t.id === id);
      if (!itemToDelete) return;

      let canceled = false;
      showToast(`"${itemToDelete.title}" יוסר...`, 'info', {
        label: 'בטל ↩',
        callback: () => { canceled = true; }
      });

      setTimeout(() => {
        if (!canceled) {
          tracksRef.doc(id).delete();
        }
      }, 4000);
    };

    document.getElementById('musicFilters').addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-chip')) {
        document.querySelectorAll('#musicFilters .filter-chip').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentMusicFilter = e.target.getAttribute('data-platform');
        renderTracks();
      }
    });
  </script>
</body>
</html>
