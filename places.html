<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>המדריך למיקונוס 🇬🇷</title>

  <!-- Firebase SDKs (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #0066cc;
      --primary-hover: #0052a3;
      --primary-soft: #edf5ff;
      --bg-gradient: linear-gradient(180deg, #f0f6fc 0%, #e6eff8 100%);
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --edit-color: #0284c7;
      --delete-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      padding: 14px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 30px;
    }

    /* Navigation Tabs */
    .nav-tabs {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 5px;
      border-radius: 18px;
      display: flex;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 70, 140, 0.06);
    }

    .tab-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(0, 102, 204, 0.25);
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .tab-content.active {
      display: flex;
    }

    /* Header */
    .header-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px 18px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
    }

    .header-card h1 {
      font-size: 1.3rem;
      color: var(--primary);
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .header-card p {
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* Form Card */
    .form-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 2px solid transparent;
      transition: border-color 0.25s;
    }

    .form-card.editing {
      border-color: var(--edit-color);
      background: #fdfefe;
    }

    .row-inputs {
      display: flex;
      gap: 8px;
    }

    .input-field, .select-field {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.9rem;
      background: #f8fafc;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .input-field:focus, .select-field:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .select-field {
      width: 130px;
      flex-shrink: 0;
      cursor: pointer;
      font-weight: 500;
    }

    .form-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-submit {
      flex: 1;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-submit.btn-editing {
      background: var(--edit-color);
    }

    .btn-cancel {
      display: none;
      background: #e2e8f0;
      color: #475569;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-music-submit {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
    }

    /* Filters */
    .filters-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .filters-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      background: rgba(255, 255, 255, 0.85);
      color: #475569;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 7px 13px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 102, 204, 0.2);
    }

    /* Item List & Modern Card */
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .card-item {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(226, 232, 240, 0.6);
    }

    .card-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: #f1f5f9;
      color: #475569;
      white-space: nowrap;
    }

    .card-note {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .btn-action {
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 7px 11px;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-action:active {
      opacity: 0.8;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.92rem;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .btn-icon.edit:active {
      color: var(--edit-color);
      background: #f0f9ff;
    }

    .btn-icon.delete:active {
      color: var(--delete-color);
      background: #fef2f2;
    }

    .empty-state {
      text-align: center;
      padding: 36px 20px;
      color: var(--muted);
      font-size: 0.88rem;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      border: 1px dashed var(--border);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('places')">📍 מקומות שווים</button>
      <button class="tab-btn" onclick="switchTab('music')">🎧 פסקול הטיול</button>
    </div>

    <!-- ================= PLACES TAB ================= -->
    <div id="tab-places" class="tab-content active">
      <div class="header-card">
        <h1>מקומות שווים במיקונוס 📍</h1>
        <p>חופים, ברים, מסעדות, שופינג ורשימות מפות</p>
      </div>

      <form class="form-card" id="placeForm">
        <input type="hidden" id="placeEditId" value="" />
        <div class="row-inputs">
          <select class="select-field" id="placeCategory">
            <option value="חוף">חוף 🏖️</option>
            <option value="בר">בר 🍸</option>
            <option value="מסעדה">מסעדה 🍽️</option>
            <option value="שופינג">שופינג 🛍️</option>
            <option value="מפה">מפה 🗺️</option>
            <option value="אחר">אחר ✨</option>
          </select>
          <input type="text" class="input-field" id="placeName" placeholder="שם המקום / הרשימה" required />
        </div>
        <input type="url" class="input-field" id="placeLink" placeholder="קישור למיקום / רשימת מפות" />
        <input type="text" class="input-field" id="placeNote" placeholder="הערה קצרה (למשל: שקיעה, להזמין מראש)" />
        <div class="form-buttons">
          <button type="submit" class="btn-submit" id="placeSubmitBtn">
            <span>+</span> הוסף לרשימה
          </button>
          <button type="button" class="btn-cancel" id="placeCancelBtn" onclick="cancelPlaceEdit()">ביטול</button>
        </div>
      </form>

      <div class="filters-bar" id="placesFilters">
        <button class="filter-chip active" data-filter="all">הכל</button>
        <button class="filter-chip" data-filter="חוף">חופים 🏖️</button>
        <button class="filter-chip" data-filter="בר">ברים 🍸</button>
        <button class="filter-chip" data-filter="מסעדה">מסעדות 🍽️</button>
        <button class="filter-chip" data-filter="שופינג">שופינג 🛍️</button>
        <button class="filter-chip" data-filter="מפה">מפות 🗺️</button>
      </div>

      <div class="items-list" id="placesContainer"></div>
    </div>

    <!-- ================= MUSIC TAB ================= -->
    <div id="tab-music" class="tab-content">
      <div class="header-card">
        <h1>פסקול הטיול 🎧</h1>
        <p>הפלייליסטים, הסטים והשירים שהחברים השמיעו</p>
      </div>

      <form class="form-card" id="musicForm">
        <input type="hidden" id="trackEditId" value="" />
        <input type="url" class="input-field" id="trackLink" placeholder="הדבק קישור (SoundCloud, Spotify, YouTube...)" required />
        <div class="row-inputs">
          <input type="text" class="input-field" id="trackTitle" placeholder="שם הפלייליסט / השיר (יחולץ אוטומטית)" required />
          <input type="text" class="input-field" id="trackSharer" placeholder="מי השמיע?" style="width: 120px; flex-shrink: 0;" />
        </div>
        <input type="text" class="input-field" id="trackVibe" placeholder="איזה וייב? (שקיעה, הרמות, צ'יל ברכב)" />
        <div class="form-buttons">
          <button type="submit" class="btn-submit btn-music-submit" id="trackSubmitBtn">
            <span>+</span> הוסף לפסקול
          </button>
          <button type="button" class="btn-cancel" id="trackCancelBtn" onclick="cancelTrackEdit()">ביטול</button>
        </div>
      </form>

      <div class="filters-bar" id="musicFilters">
        <button class="filter-chip active" data-platform="all">הכל 🎶</button>
        <button class="filter-chip" data-platform="Spotify">Spotify 🟢</button>
        <button class="filter-chip" data-platform="SoundCloud">SoundCloud 🟠</button>
        <button class="filter-chip" data-platform="Apple Music">Apple Music 🍎</button>
        <button class="filter-chip" data-platform="YouTube">YouTube ▶️</button>
      </div>

      <div class="items-list" id="musicContainer"></div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // Firebase Config
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyDNUB4fgqhcPOXua7GxzeUJKn5SAzFqrJ8",
      authDomain: "places-d2918.firebaseapp.com",
      projectId: "places-d2918",
      storageBucket: "places-d2918.firebasestorage.app",
      messagingSenderId: "536137064680",
      appId: "1:536137064680:web:f211b4e761ec511a3ae95d",
      measurementId: "G-8Y68MLY65M"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const placesRef = db.collection('places');
    const tracksRef = db.collection('tracks');

    // ניווט טאבים
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tabId === 'places') {
        document.querySelector('.nav-tabs button:first-child').classList.add('active');
        document.getElementById('tab-places').classList.add('active');
      } else {
        document.querySelector('.nav-tabs button:last-child').classList.add('active');
        document.getElementById('tab-music').classList.add('active');
      }
    }

    // -------------------------------------------------------------
    // מקומות ורשימות
    // -------------------------------------------------------------
    let placesData = [];
    let currentPlaceFilter = 'all';

    placesRef.orderBy('createdAt', 'desc').onSnapshot(snapshot => {
      placesData = [];
      snapshot.forEach(doc => {
        placesData.push({ id: doc.id, ...doc.data() });
      });
      renderPlaces();
    }, err => {
      console.error("Firestore Listen Error:", err);
    });

    function renderPlaces() {
      const container = document.getElementById('placesContainer');
      container.innerHTML = '';

      const filtered = placesData.filter(p => {
        if (currentPlaceFilter === 'all') return true;
        return (p.category || '').includes(currentPlaceFilter);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">אין מקומות להצגה בקטגוריה זו</div>`;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card-item';
        const isMap = (p.category || '').includes('מפה');
        card.innerHTML = `
          <div class="card-main">
            <div class="card-title">${p.name}</div>
            <div class="card-meta-row">
              <span class="badge">${p.category}</span>
              ${p.note ? `<span class="card-note">${p.note}</span>` : ''}
            </div>
          </div>
          <div class="card-actions">
            ${p.link ? `<a href="${p.link}" target="_blank" rel="noopener noreferrer" class="btn-action">${isMap ? 'פתח מפה 🗺️' : 'ניווט 📍'}</a>` : ''}
            <button class="btn-icon edit" title="ערוך" onclick="startEditPlace('${p.id}')">✏️</button>
            <button class="btn-icon delete" title="מחק" onclick="deletePlace('${p.id}')">✕</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    const placeForm = document.getElementById('placeForm');
    const placeEditIdInput = document.getElementById('placeEditId');
    const placeSubmitBtn = document.getElementById('placeSubmitBtn');
    const placeCancelBtn = document.getElementById('placeCancelBtn');

    window.startEditPlace = function(id) {
      const p = placesData.find(item => item.id === id);
      if (!p) return;

      placeEditIdInput.value = p.id;
      document.getElementById('placeName').value = p.name || '';
      document.getElementById('placeCategory').value = p.category || 'חוף';
      document.getElementById('placeLink').value = p.link || '';
      document.getElementById('placeNote').value = p.note || '';

      placeForm.classList.add('editing');
      placeSubmitBtn.innerHTML = '<span>✓</span> שמור שינויים';
      placeSubmitBtn.classList.add('btn-editing');
      placeCancelBtn.style.display = 'block';

      placeForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    window.cancelPlaceEdit = function() {
      placeForm.reset();
      placeEditIdInput.value = '';
      placeForm.classList.remove('editing');
      placeSubmitBtn.innerHTML = '<span>+</span> הוסף לרשימה';
      placeSubmitBtn.classList.remove('btn-editing');
      placeCancelBtn.style.display = 'none';
    };

    placeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const editId = placeEditIdInput.value;
      const name = document.getElementById('placeName').value.trim();
      const category = document.getElementById('placeCategory').value;
      const link = document.getElementById('placeLink').value.trim();
      const note = document.getElementById('placeNote').value.trim();

      if (!name) return;

      const isDuplicate = placesData.some(p => 
        p.id !== editId &&
        (p.name.toLowerCase() === name.toLowerCase() || 
        (link && p.link && p.link.toLowerCase() === link.toLowerCase()))
      );

      if (isDuplicate) {
        alert('המקום הזה כבר קיים ברשימה!');
        return;
      }

      if (editId) {
        placesRef.doc(editId).update({
          name,
          category,
          link,
          note
        }).then(() => {
          cancelPlaceEdit();
        }).catch(err => {
          alert('שגיאה בעדכון המקום בענן.');
        });
      } else {
        placeForm.reset();
        placesRef.add({
          name,
          category,
          link,
          note,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(err => {
          alert('שגיאה בשמירת המקום בענן.');
        });
      }
    });

    window.deletePlace = async function(id) {
      if (confirm('למחוק את הרשומה לצמיתות עבור כולם?')) {
        await placesRef.doc(id).delete();
        if (placeEditIdInput.value === id) cancelPlaceEdit();
      }
    };

    document.getElementById('placesFilters').addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-chip')) {
        document.querySelectorAll('#placesFilters .filter-chip').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentPlaceFilter = e.target.getAttribute('data-filter');
        renderPlaces();
      }
    });

    // -------------------------------------------------------------
    // פסקול מוזיקה
    // -------------------------------------------------------------
    let tracksData = [];
    let currentMusicFilter = 'all';

    function detectPlatform(url) {
      const u = url.toLowerCase();
      if (u.includes('spotify.com')) return { name: 'Spotify', icon: '🟢' };
      if (u.includes('soundcloud.com')) return { name: 'SoundCloud', icon: '🟠' };
      if (u.includes('apple.com')) return { name: 'Apple Music', icon: '🍎' };
      if (u.includes('youtube.com') || u.includes('youtu.be')) return { name: 'YouTube', icon: '▶️' };
      return { name: 'לינק', icon: '🎵' };
    }

    async function fetchTrackTitle(url) {
      const u = url.toLowerCase();

      try {
        if (u.includes('youtube.com') || u.includes('youtu.be')) {
          const res = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`);
          const data = await res.json();
          if (data && data.title) return data.title;
        }

        if (u.includes('soundcloud.com')) {
          const res = await fetch(`https://soundcloud.com/oembed?format=json&url=${encodeURIComponent(url)}`);
          const data = await res.json();
          if (data && data.title) return data.title;
        }

        if (u.includes('spotify.com')) {
          const res = await fetch(`https://open.spotify.com/oembed?url=${encodeURIComponent(url)}`);
          const data = await res.json();
          if (data && data.title) return data.title;
        }
      } catch (err) {
        console.warn("oEmbed fetch failed, parsing URL:", err);
      }

      try {
        const urlObj = new URL(url);
        const pathParts = urlObj.pathname.split('/').filter(Boolean);
        if (pathParts.length > 0) {
          const slug = pathParts[pathParts.length - 1];
          const cleaned = decodeURIComponent(slug).replace(/[-_]/g, ' ');
          if (cleaned.length > 2) {
            return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
          }
        }
      } catch (e) {}

      return '';
    }

    const trackLinkInput = document.getElementById('trackLink');
    const trackTitleInput = document.getElementById('trackTitle');

    trackLinkInput.addEventListener('input', async () => {
      const url = trackLinkInput.value.trim();
      if (trackEditIdInput.value) return;

      if (url.startsWith('http://') || url.startsWith('https://')) {
        trackTitleInput.placeholder = 'מחלץ שם שיר/סט... ⏳';
        const fetchedTitle = await fetchTrackTitle(url);
        if (fetchedTitle) {
          trackTitleInput.value = fetchedTitle;
        }
        trackTitleInput.placeholder = 'שם הפלייליסט / השיר (יחולץ אוטומטית)';
      }
    });

    tracksRef.orderBy('createdAt', 'desc').onSnapshot(snapshot => {
      tracksData = [];
      snapshot.forEach(doc => {
        tracksData.push({ id: doc.id, ...doc.data() });
      });
      renderTracks();
    }, err => {
      console.error("Firestore Listen Error:", err);
    });

    function renderTracks() {
      const container = document.getElementById('musicContainer');
      container.innerHTML = '';

      const filtered = tracksData.filter(t => {
        if (currentMusicFilter === 'all') return true;
        return t.platform === currentMusicFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">אין שירים או פלייליסטים להצגה</div>`;
        return;
      }

      filtered.forEach(t => {
        const plat = detectPlatform(t.link);
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="card-main">
            <div class="card-title">${t.title}</div>
            <div class="card-meta-row">
              <span class="badge">${plat.icon} ${t.platform || plat.name}</span>
              ${t.sharer ? `<span class="card-note">👤 ${t.sharer}</span>` : ''}
              ${t.vibe ? `<span class="card-note">• ✨ ${t.vibe}</span>` : ''}
            </div>
          </div>
          <div class="card-actions">
            <a href="${t.link}" target="_blank" rel="noopener noreferrer" class="btn-action">נגן ▶</a>
            <button class="btn-icon edit" title="ערוך" onclick="startEditTrack('${t.id}')">✏️</button>
            <button class="btn-icon delete" title="מחק" onclick="deleteTrack('${t.id}')">✕</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    const musicForm = document.getElementById('musicForm');
    const trackEditIdInput = document.getElementById('trackEditId');
    const trackSubmitBtn = document.getElementById('trackSubmitBtn');
    const trackCancelBtn = document.getElementById('trackCancelBtn');

    window.startEditTrack = function(id) {
      const t = tracksData.find(item => item.id === id);
      if (!t) return;

      trackEditIdInput.value = t.id;
      document.getElementById('trackLink').value = t.link || '';
      document.getElementById('trackTitle').value = t.title || '';
      document.getElementById('trackSharer').value = t.sharer || '';
      document.getElementById('trackVibe').value = t.vibe || '';

      musicForm.classList.add('editing');
      trackSubmitBtn.innerHTML = '<span>✓</span> שמור שינויים';
      trackSubmitBtn.classList.add('btn-editing');
      trackCancelBtn.style.display = 'block';

      musicForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    window.cancelTrackEdit = function() {
      musicForm.reset();
      trackEditIdInput.value = '';
      musicForm.classList.remove('editing');
      trackSubmitBtn.innerHTML = '<span>+</span> הוסף לפסקול';
      trackSubmitBtn.classList.remove('btn-editing');
      trackCancelBtn.style.display = 'none';
    };

    musicForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const editId = trackEditIdInput.value;
      const title = document.getElementById('trackTitle').value.trim();
      const sharer = document.getElementById('trackSharer').value.trim();
      const link = document.getElementById('trackLink').value.trim();
      const vibe = document.getElementById('trackVibe').value.trim();

      if (!title || !link) return;

      const isDuplicate = tracksData.some(t => 
        t.id !== editId &&
        (t.link.toLowerCase() === link.toLowerCase() || 
        t.title.toLowerCase() === title.toLowerCase())
      );

      if (isDuplicate) {
        alert('השיר או הפלייליסט הזה כבר קיים בפסקול!');
        return;
      }

      const plat = detectPlatform(link);

      if (editId) {
        tracksRef.doc(editId).update({
          title,
          sharer,
          link,
          vibe,
          platform: plat.name
        }).then(() => {
          cancelTrackEdit();
        }).catch(err => {
          alert('שגיאה בעדכון הפסקול בענן.');
        });
      } else {
        musicForm.reset();
        tracksRef.add({
          title,
          sharer,
          link,
          vibe,
          platform: plat.name,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(err => {
          alert('שגיאה בשמירת הפסקול בענן.');
        });
      }
    });

    window.deleteTrack = async function(id) {
      if (confirm('להסיר את הלינק מהפסקול לצמיתות?')) {
        await tracksRef.doc(id).delete();
        if (trackEditIdInput.value === id) cancelTrackEdit();
      }
    };

    document.getElementById('musicFilters').addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-chip')) {
        document.querySelectorAll('#musicFilters .filter-chip').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentMusicFilter = e.target.getAttribute('data-platform');
        renderTracks();
      }
    });
  </script>
</body>
</html>
