<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ריכוז הכנות לטיול ✈️</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      direction: rtl;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    h1 { font-size: 1.4rem; margin-bottom: 24px; color: #222; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-shopping { background-color: #0076ff; color: white; }
    .btn-packing { background-color: #6c5ce7; color: white; }
    .btn-splitwise { background-color: #1cc29f; color: white; }
  </style>
</head>
<body>

  <div class="card">
    <h1>הכנות לטיול ✈️</h1>

    <!-- קישור לרשימת הקניות הקיימת שלך -->
    <a href="shopping.html" class="btn btn-shopping">
      🛒 רשימת קניות
    </a>

    <!-- קישור לרשימת הציוד/אריזה -->
    <a href="packing.html" class="btn btn-packing">
      🧳 רשימת ציוד ומה לארוז
    </a>

    <!-- קישור לקבוצה ב-Splitwise -->
    <a href="https://www.splitwise.com" target="_blank" class="btn btn-splitwise">
      🔗 הקבוצה שלנו ב-Splitwise
    </a>
  </div>

</body>
</html>
