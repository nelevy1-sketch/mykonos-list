<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הכנות לטיול למיקונוס 🇬🇷 🏳️‍🌈</title>
  <style>
    :root {
      --greek-blue: #005bae;
      --greek-blue-dark: #004585;
      --spliit-color: #6366f1;
      --spliit-dark: #4f46e5;
      --splitwise-color: #1cc29f;
      --splitwise-dark: #149c7f;
      --bg-color: #eef2f6;
      --card-bg: #ffffff;
      --text-main: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, #e2eaf4 0%, var(--bg-color) 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      direction: rtl;
    }

    .card {
      background: var(--card-bg);
      padding: 34px 22px;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      width: 100%;
      max-width: 420px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flags-container {
      display: flex;
      gap: 16px;
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    .flag {
      display: inline-block;
      transform-origin: bottom center;
      animation: wave-flag 2.8s ease-in-out infinite alternate;
    }

    .flag-pride {
      animation-delay: -1.4s;
    }

    @keyframes wave-flag {
      0% { transform: rotate(-6deg) translateY(0px) skewX(-2deg); }
      50% { transform: rotate(4deg) translateY(-3px) skewX(2deg); }
      100% { transform: rotate(-4deg) translateY(2px) skewX(-1deg); }
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--greek-blue);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 16px;
    }

    /* תיבת השעון */
    .timer-box {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 10px 14px;
      width: 100%;
      margin-bottom: 14px;
    }

    .timer-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .timer-display {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--greek-blue);
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
    }

    /* שורת מזג אוויר */
    .weather-container {
      width: 100%;
      padding: 4px 0 14px 0;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      border-bottom: 1px solid transparent;
      border-image: linear-gradient(to right, transparent, #cbd5e1 20%, #cbd5e1 80%, transparent) 1;
    }

    .weather-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .weather-val {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .weather-lbl {
      font-size: 0.68rem;
      color: #94a3b8;
      font-weight: 500;
      white-space: nowrap;
    }

    .weather-divider {
      width: 1px;
      height: 16px;
      background: #e2e8f0;
      flex-shrink: 0;
    }

    .buttons-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 20px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      position: relative;
      transition: all 0.15s ease;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .btn-list {
      background-color: #ffffff;
      color: var(--greek-blue);
      border: 2px solid var(--greek-blue);
      box-shadow: 0 3px 0 var(--greek-blue), 0 6px 12px rgba(0, 0, 0, 0.04);
    }
    .btn-list:hover {
      background-color: #f8fafc;
      transform: translateY(-1px);
      box-shadow: 0 4px 0 var(--greek-blue), 0 8px 15px rgba(0, 0, 0, 0.06);
    }
    .btn-list:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 var(--greek-blue), 0 2px 4px rgba(0, 0, 0, 0.03);
    }

    .section-divider {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 6px 0;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .section-divider::before,
    .section-divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .section-divider:not(:empty)::before {
      margin-left: 10px;
    }
    .section-divider:not(:empty)::after {
      margin-right: 10px;
    }

    /* עיצוב כפתור ההוצאות הראשי (דינמי) */
    .btn-expense-spliit {
      background-color: var(--spliit-color);
      color: #ffffff;
      box-shadow: 0 3px 0 var(--spliit-dark), 0 6px 12px rgba(99, 102, 241, 0.2);
    }
    .btn-expense-spliit:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 0 var(--spliit-dark), 0 8px 15px rgba(99, 102, 241, 0.25);
    }
    .btn-expense-spliit:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 var(--spliit-dark), 0 2px 4px rgba(99, 102, 241, 0.1);
    }

    .btn-expense-splitwise {
      background-color: var(--splitwise-color);
      color: #ffffff;
      box-shadow: 0 3px 0 var(--splitwise-dark), 0 6px 12px rgba(28, 194, 159, 0.2);
    }
    .btn-expense-splitwise:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 0 var(--splitwise-dark), 0 8px 15px rgba(28, 194, 159, 0.25);
    }
    .btn-expense-splitwise:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 var(--splitwise-dark), 0 2px 4px rgba(28, 194, 159, 0.1);
    }

    /* כפתור החלפה מהיר ועדין */
    .switch-btn {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s ease;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .switch-btn:hover {
      color: #334155;
    }

    .footer-text {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="flags-container">
      <span class="flag flag-greece">🇬🇷</span>
      <span class="flag flag-pride">🏳️‍🌈</span>
    </div>
    <h1>הכנות לטיול למיקונוס</h1>
    <p class="subtitle">ריכוז כל הרשימות וההוצאות במקום אחד</p>

    <!-- רכיב השעון -->
    <div class="timer-box">
      <div class="timer-title" id="timerTitle">זמן נותר להמראה ✈️</div>
      <div class="timer-display" id="timerDisplay">מחשב זמן...</div>
    </div>

    <!-- רכיב מזג אוויר -->
    <div class="weather-container">
      <div class="weather-item">
        <span class="weather-val" id="mykTemp">--°C</span>
        <span class="weather-lbl">🌡️ חום</span>
      </div>
      <div class="weather-divider"></div>
      <div class="weather-item">
        <span class="weather-val" id="mykStatus">טוען...</span>
        <span class="weather-lbl">שמיים</span>
      </div>
      <div class="weather-divider"></div>
      <div class="weather-item">
        <span class="weather-val" id="mykWind">-- קמ"ש</span>
        <span class="weather-lbl">💨 רוח</span>
      </div>
      <div class="weather-divider"></div>
      <div class="weather-item">
        <span class="weather-val" id="mykHumidity">--%</span>
        <span class="weather-lbl">💧 לחות</span>
      </div>
      <div class="weather-divider"></div>
      <div class="weather-item">
        <span class="weather-val" id="mykUV">--</span>
        <span class="weather-lbl">☀️ קרינה</span>
      </div>
    </div>

    <div class="buttons-container">
      <!-- קניות משותפת -->
      <a href="shopping.html" class="btn btn-list">
        <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        <span>רשימת קניות משותפת</span>
      </a>

      <!-- ציוד -->
      <a href="packing.html" class="btn btn-list">
        <svg viewBox="0 0 24 24"><path d="M17 6h-2V3c0-.55-.45-1-1-1h-4c-.55 0-1 .45-1 1v3H7c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2h2v2h-2V4zm6 15H7V8h10v11z"/></svg>
        <span>רשימת ציוד ומה לארוז</span>
      </a>

      <div class="section-divider">הוצאות ותשלומים</div>

      <!-- כפתור הוצאות דינמי שמתחלף -->
      <a id="expenseBtn" href="#" target="_blank" class="btn">
        <svg viewBox="0 0 24 24" id="expenseIcon"></svg>
        <span id="expenseText"></span>
      </a>

      <!-- מתג החלפה מהיר -->
      <button class="switch-btn" id="toggleExpenseApp">
        🔄 החלף אפליקציית הוצאות (<span id="altAppName"></span>)
      </button>
    </div>

    <div class="footer-text">Mykonos 2026 ☀️</div>
  </div>

  <script>
    // 1. ניהול אפליקציית הוצאות נבחרת (Spliit מול Splitwise)
    const appsConfig = {
      spliit: {
        name: "Spliit",
        title: "הוצאות קבוצתיות ב-Spliit 💸",
        url: "https://spliit.app/groups/mTdTK6l_IZHWOhmjS45ZQ/expenses",
        className: "btn-expense-spliit",
        iconPath: "M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"
      },
      splitwise: {
        name: "Splitwise",
        title: "הקבוצה שלנו ב-Splitwise",
        url: "https://www.splitwise.com/join/v6H6rTgvqDq+8vv9f?v=s",
        className: "btn-expense-splitwise",
        iconPath: "M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"
      }
    };

    let currentExpenseApp = localStorage.getItem('preferred_expense_app') || 'spliit';

    function renderExpenseButton() {
      const active = appsConfig[currentExpenseApp];
      const altKey = currentExpenseApp === 'spliit' ? 'splitwise' : 'spliit';
      const alt = appsConfig[altKey];

      const btn = document.getElementById('expenseBtn');
      btn.href = active.url;
      btn.className = `btn ${active.className}`;
      document.getElementById('expenseText').textContent = active.title;
      document.getElementById('expenseIcon').innerHTML = `<path d="${active.iconPath}"/>`;
      document.getElementById('altAppName').textContent = alt.name;
    }

    document.getElementById('toggleExpenseApp').addEventListener('click', () => {
      currentExpenseApp = currentExpenseApp === 'spliit' ? 'splitwise' : 'spliit';
      localStorage.setItem('preferred_expense_app', currentExpenseApp);
      renderExpenseButton();
      if ('vibrate' in navigator) navigator.vibrate(20);
    });

    renderExpenseButton();

    // 2. שעון וספירה לאחור
    const targetDate = new Date("2026-08-20T08:15:00");
    const timerTitle = document.getElementById("timerTitle");
    const timerDisplay = document.getElementById("timerDisplay");

    function updateClock() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff > 0) {
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        timerTitle.textContent = "זמן נותר להמראה ✈️";

        const timeString = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        if (days > 0) {
          timerDisplay.textContent = `${days} ימים, ${timeString}`;
        } else {
          timerDisplay.textContent = timeString;
        }
      } else {
        timerTitle.textContent = "אנחנו במיקונוס! ☀️ זמן יוון";
        
        const dateOptions = { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'Europe/Athens' };
        const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Europe/Athens' };
        
        const dateStr = now.toLocaleDateString('he-IL', dateOptions);
        const timeStr = now.toLocaleTimeString('he-IL', timeOptions);

        timerDisplay.textContent = `${dateStr} | ${timeStr}`;
      }
    }

    updateClock();
    setInterval(updateClock, 1000);

    // 3. רטט בלחיצת כפתור
    document.querySelectorAll('.btn').forEach(button => {
      button.addEventListener('click', () => {
        if ('vibrate' in navigator) navigator.vibrate(15);
      });
    });

    // 4. מזג אוויר חי במיקונוס
    async function fetchMykonosWeather() {
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.4467&longitude=25.3289&current=temperature_2m,relative_humidity_2m,uv_index,wind_speed_10m,weather_code,is_day&timezone=Europe%2FAthens");
        const data = await res.json();
        
        if (data && data.current) {
          const temp = Math.round(data.current.temperature_2m);
          const wind = Math.round(data.current.wind_speed_10m);
          const humidity = Math.round(data.current.relative_humidity_2m);
          const uv = Math.round(data.current.uv_index || 0);
          const code = data.current.weather_code;
          const isDay = data.current.is_day === 1;

          document.getElementById('mykTemp').textContent = `${temp}°C`;
          document.getElementById('mykWind').textContent = `${wind} קמ"ש`;
          document.getElementById('mykHumidity').textContent = `${humidity}%`;
          document.getElementById('mykUV').textContent = `${uv}`;

          let statusText = isDay ? "☀️ בהיר" : "🌙 בהיר";
          if (code >= 1 && code <= 3) statusText = isDay ? "⛅ מעונן" : "☁️ מעונן";
          else if (code >= 45 && code <= 48) statusText = "🌫️ ערפל";
          else if (code >= 51 && code <= 67) statusText = "🌧️ גשם";
          else if (code >= 80) statusText = "🌦️ ממטר";

          document.getElementById('mykStatus').textContent = statusText;
        }
      } catch (err) {
        console.error("שגיאה בטעינת מזג האוויר:", err);
      }
    }

    fetchMykonosWeather();
    setInterval(fetchMykonosWeather, 15 * 60 * 1000);
  </script>

</body>
</html>
